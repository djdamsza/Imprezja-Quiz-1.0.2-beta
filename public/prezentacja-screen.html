<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezentacja – Imprezja</title>
    <link rel="icon" href="/favicon.ico">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; }
        #slides-wrapper { position: relative; width: 100vw; height: 100vh; }
        .slide-frame { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.6s ease; }
        .slide-frame.active { opacity: 1; pointer-events: auto; }
        .slide-frame.trans-none { transition: none; }
        .slide-frame.trans-fade { transition: opacity 0.6s ease; }
        .slide-frame.trans-slide { transition: transform 0.6s ease, opacity 0.6s ease; }
        .slide-frame.trans-convex { transition: transform 0.8s ease, opacity 0.6s ease; }
        .slide-frame.trans-concave { transition: transform 0.8s ease, opacity 0.6s ease; }
        .slide-frame.trans-zoom { transition: transform 0.8s ease, opacity 0.6s ease; }
        .slide-text { padding: 40px; text-align: center; color: #fff; }
        .slide-text.size-small { font-size: 2.5vw; }
        .slide-text.size-medium { font-size: 4vw; }
        .slide-text.size-large { font-size: 6vw; }
        .slide-text.shadow { text-shadow: 0 4px 20px rgba(0,0,0,0.8), 0 0 40px rgba(241,196,15,0.3); }
        .slide-text.anim-fade { animation: textFade 1.5s ease-out; }
        .slide-text.anim-slide { animation: textSlide 1s ease-out; }
        .slide-text.anim-pulse { animation: textPulse 2s ease-in-out infinite; }
        @keyframes textFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes textSlide { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes textPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .slide-image, .slide-video { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .slide-image img, .slide-video video { width: 100%; height: 100%; object-fit: contain; }
        .slide-image .caption { position: absolute; bottom: 24px; left: 0; right: 0; text-align: center; font-size: 1.5vw; color: rgba(255,255,255,0.9); text-shadow: 0 1px 4px #000; pointer-events: none; }
        .slide-visualization { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .slide-visualization .viz-container { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
        .slide-visualization .viz-no-mic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 40px; text-align: center; color: rgba(255,255,255,0.7); font-size: 1.2rem; max-width: 500px; }
        .slide-visualization .viz-no-mic strong { color: #f1c40f; }
        .slide-visualization .viz-winamp-hint { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 0.8rem; color: rgba(255,255,255,0.4); pointer-events: none; }
        .viz-overlay { position: absolute; z-index: 10; pointer-events: none; }
        .viz-overlay-live { position: absolute; inset: 0; z-index: 9999; pointer-events: none; }
        .viz-overlay-clock { top: 16px; right: 24px; }
        .viz-overlay-clock .clock-time { font-size: 3.5vw; font-weight: 700; color: rgba(241,196,15,0.95); font-variant-numeric: tabular-nums; text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 2px 8px #000; }
        .viz-overlay-countdown { top: 16px; left: 24px; }
        .viz-overlay-countdown .countdown-time { font-size: 4vw; font-weight: 700; color: rgba(241,196,15,0.95); font-variant-numeric: tabular-nums; text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 2px 8px #000; }
        .viz-overlay-countdown.countdown-zero .countdown-time { color: #e74c3c; text-shadow: 0 0 20px rgba(231,76,60,0.8); animation: vizCountdownPulse 0.5s ease-in-out infinite alternate; }
        .viz-overlay-live .viz-overlay-countdown { top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; transition: background 0.5s ease; }
        .viz-overlay-live .viz-overlay-countdown .countdown-time { font-size: 20vw; font-weight: 700; color: #f1c40f; font-variant-numeric: tabular-nums; text-shadow: 0 0 40px rgba(241,196,15,0.5); }
        .viz-overlay-live .viz-overlay-countdown.countdown-zero { background: #c0392b !important; }
        .viz-overlay-live .viz-overlay-countdown.countdown-zero .countdown-time { color: #fff; text-shadow: 0 0 40px rgba(255,255,255,0.5); }
        .viz-overlay-live .viz-overlay-dbmeter { left: 50%; transform: translateX(-50%); right: auto; }
        .viz-overlay-live .viz-overlay-logo { inset: 0; display: flex; align-items: center; justify-content: center; background: transparent; }
        .viz-overlay-live .viz-overlay-logo .logo-img { max-width: 60%; max-height: 60%; object-fit: contain; will-change: transform; }
        .viz-overlay-live .slide-logo-bouncer { background: transparent !important; }
        @keyframes vizCountdownPulse { from { opacity: 1; } to { opacity: 0.85; } }
        .viz-overlay-dbmeter { bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .viz-overlay-dbmeter .db-row { display: flex; gap: 12px; align-items: center; justify-content: center; }
        .viz-overlay-dbmeter .db-max, .viz-overlay-dbmeter .db-min { font-size: 1.8vw; font-weight: 600; color: rgba(241,196,15,0.8); font-variant-numeric: tabular-nums; }
        .viz-overlay-dbmeter .db-value { font-size: 3.5vw; font-weight: 700; color: #f1c40f; font-variant-numeric: tabular-nums; text-shadow: 0 0 12px rgba(0,0,0,0.8); }
        .viz-overlay-dbmeter .db-bar-wrap { width: 200px; max-width: 30vw; height: 12px; background: rgba(255,255,255,0.15); border-radius: 6px; overflow: hidden; }
        .viz-overlay-dbmeter .db-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #27ae60, #f1c40f, #e74c3c); transition: width 0.1s; }
        .viz-overlay-dbmeter .db-no-mic { font-size: 0.9rem; color: rgba(255,255,255,0.4); }
        .viz-overlay-text { left: 0; right: 0; padding: 24px 40px; display: flex; align-items: center; justify-content: center; text-align: center; }
        .viz-overlay-text.text-top { top: 0; bottom: auto; }
        .viz-overlay-text.text-center { top: 0; bottom: 0; }
        .viz-overlay-text.text-bottom { top: auto; bottom: 0; }
        .viz-overlay-text .viz-overlay-text-inner { font-size: clamp(2rem, 5vw, 4rem); font-weight: 700; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 4px 12px rgba(0,0,0,0.6), 0 0 40px rgba(0,0,0,0.5); letter-spacing: 0.02em; line-height: 1.2; }
        .slide-clock { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .slide-clock .clock-time { font-size: 18vw; font-weight: 700; color: #f1c40f; font-variant-numeric: tabular-nums; text-shadow: 0 0 40px rgba(241,196,15,0.5); }
        .slide-dbmeter { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
        .slide-dbmeter .db-row { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
        .slide-dbmeter .db-max { font-size: 6vw; font-weight: 600; color: rgba(241,196,15,0.8); font-variant-numeric: tabular-nums; min-width: 11ch; text-align: center; }
        .slide-dbmeter .db-value { font-size: 12vw; font-weight: 700; color: #f1c40f; font-variant-numeric: tabular-nums; min-width: 9ch; text-align: center; }
        .slide-dbmeter .db-min { font-size: 6vw; font-weight: 600; color: rgba(241,196,15,0.8); font-variant-numeric: tabular-nums; min-width: 11ch; text-align: center; }
        .slide-dbmeter .db-bar-wrap { width: 80%; max-width: 600px; height: 40px; background: rgba(255,255,255,0.1); border-radius: 20px; overflow: hidden; }
        .slide-dbmeter .db-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #27ae60, #f1c40f, #e74c3c); transition: width 0.1s; }
        .slide-dbmeter .db-no-mic { color: rgba(255,255,255,0.6); font-size: 1.2rem; }
        .slide-countdown { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: background 0.5s ease; }
        .slide-countdown.countdown-zero { background: #c0392b !important; }
        .slide-countdown .countdown-time { font-size: 20vw; font-weight: 700; color: #f1c40f; font-variant-numeric: tabular-nums; text-shadow: 0 0 40px rgba(241,196,15,0.5); }
        .slide-countdown.countdown-zero .countdown-time { color: #fff; text-shadow: 0 0 40px rgba(255,255,255,0.5); }
        .slide-logo-bouncer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #000; }
        .slide-logo-bouncer .logo-img { max-width: 60%; max-height: 60%; object-fit: contain; will-change: transform; }
        .slide-logo-bouncer .logo-no-mic { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 40px; text-align: center; color: rgba(255,255,255,0.7); font-size: 1.2rem; }
        .slide-logo-bouncer .logo-no-mic strong { color: #f1c40f; }
        .empty-state { color: rgba(255,255,255,0.85); font-size: 1.5rem; text-align: center; padding: 24px; }
    </style>
</head>
<body>
    <div id="slides-wrapper"><div class="slide-frame active trans-fade" style="display:flex;align-items:center;justify-content:center;"><p class="empty-state">Ładowanie…</p></div></div>
    <audio id="bg-music" loop style="display:none;"></audio>
    <audio id="countdown-alarm" loop style="display:none;"></audio>
    <audio id="countdown-bell" style="display:none;"></audio>

    <script>
        window.onerror = function(msg, url, line, col, err) {
            document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0d14;color:#f1c40f;padding:40px;text-align:center;font-family:system-ui;"><h2 style="margin-bottom:16px;">Błąd</h2><p style="margin-bottom:12px;color:rgba(255,255,255,0.8);">' + (msg || err && err.message || '') + '</p><p style="font-size:0.85rem;color:rgba(255,255,255,0.5);">' + (url || '') + ':' + line + '</p></div>';
            return false;
        };
        (function() {
        try {
        const socket = io();
        let config = null;
        let currentIndex = 0;
        let playing = false;
        let loop = true;
        let autoAdvanceTimer = null;
        const DEFAULT_SLIDE_DURATION = 8000;
        let vizAnalyzer = null;
        let vizMicStream = null;
        let vizWinampAnimationId = null;
        let vizWinampContainer = null;
        let vizWinampStream = null;
        let vizWinampRotateTimerId = null;
        let vizWinampModeDelta = 0;
        let clockIntervalId = null;
        let dbmeterStream = null;
        let dbmeterAnalyser = null;
        let dbmeterAnimationId = null;
        let countdownTimerId = null;
        let countdownEndTime = null;
        let countdownReachedZeroIndex = -1;
        let prezentacjaChannelVolume = 1;
        let masterVolume = 1;
        let logoBouncerStream = null;
        let logoBouncerAnimationId = null;
        let vizWebvsStream = null;
        let vizWebvsMain = null;
        let vizWebvsResizeHandler = null;
        let vizWebvsChangePreset = null;
        let vizMilkdropStream = null;
        let vizMilkdropVisualizer = null;
        let vizMilkdropPresetNames = [];
        let vizMilkdropPresetIndex = 0;
        let vizMilkdropChangePreset = null;
        let vizMilkdropResizeHandler = null;
        let liveOverlayState = { type: 'none', countdownMinutes: 3, text: '', textPosition: 'center' };

        function getPrezentacjaEffectiveVolume() { return Math.min(1, prezentacjaChannelVolume * masterVolume); }
        function applyVideoVolumes() {
            const eff = getPrezentacjaEffectiveVolume();
            document.querySelectorAll('#slides-wrapper .slide-video video').forEach(v => {
                v.volume = eff;
                if (v.readyState >= 2) v.muted = false;
            });
        }

        function setupVideoUnmuteOnPlay(video) {
            const unmute = () => {
                video.muted = false;
                video.volume = getPrezentacjaEffectiveVolume();
                video.removeEventListener('playing', unmute);
            };
            video.addEventListener('playing', unmute, { once: true });
        }

        function renderSlide(slide, index) {
            const div = document.createElement('div');
            div.className = 'slide-frame';
            div.dataset.index = index;
            if (slide.type === 'text') {
                const size = slide.size || 'medium';
                const anim = slide.animation || 'none';
                const shadow = slide.shadow ? ' shadow' : '';
                div.innerHTML = `<div class="slide-text size-${size}${shadow} anim-${anim}">${(slide.text || '').replace(/\n/g, '<br>')}</div>`;
            } else if (slide.type === 'image') {
                const src = (slide.src || '').startsWith('/') ? slide.src : '/' + (slide.src || '');
                div.innerHTML = `<div class="slide-image"><img src="${src}" alt=""><p class="caption">${(slide.caption || '').replace(/</g,'&lt;')}</p></div>`;
            } else if (slide.type === 'video') {
                const src = (slide.src || '').startsWith('/') ? slide.src : '/' + (slide.src || '');
                div.innerHTML = `<div class="slide-video"><video src="${src}" controls muted playsinline></video></div>`;
            } else if (slide.type === 'visualization') {
                const preset = slide.preset || 'equalizer';
                const oc = slide.vizOverlayClock;
                const ocd = slide.vizOverlayCountdown;
                const odb = slide.vizOverlayDbmeter;
                let overlays = '';
                if (oc) overlays += `<div class="viz-overlay viz-overlay-clock"><span class="clock-time">00:00</span></div>`;
                if (ocd) overlays += `<div class="viz-overlay viz-overlay-countdown"><span class="countdown-time">0:00</span></div>`;
                if (odb) overlays += `<div class="viz-overlay viz-overlay-dbmeter slide-dbmeter"><div class="db-row"><span class="db-max">MAX --</span><span class="db-value">-- dB</span><span class="db-min">MIN --</span></div><div class="db-bar-wrap"><div class="db-bar"></div></div><div class="db-no-mic" style="display:none">Brak mikrofonu</div></div>`;
                div.innerHTML = `<div class="slide-visualization">
                    <div class="viz-container"></div>
                    <div class="viz-no-mic" style="display:none">
                        <strong>Brak dostępu do mikrofonu</strong> – wizualizacja niedostępna.<br><br>
                        Udziel uprawnień do mikrofonu w ustawieniach przeglądarki. Na Macu możesz użyć BlackHole – przekieruj dźwięk z oprogramowania DJ na wejście mikrofonowe (BlackHole).
                    </div>
                    ${overlays}
                    <div class="viz-overlay-live"></div>
                </div>`;
            } else if (slide.type === 'clock') {
                div.innerHTML = `<div class="slide-clock"><span class="clock-time">00:00</span></div>`;
            } else if (slide.type === 'dbmeter') {
                div.innerHTML = `<div class="slide-dbmeter">
                    <div class="db-row">
                        <span class="db-max">MAX --</span>
                        <span class="db-value">-- dB</span>
                        <span class="db-min">MIN --</span>
                    </div>
                    <div class="db-bar-wrap"><div class="db-bar"></div></div>
                    <div class="db-no-mic" style="display:none">Brak dostępu do mikrofonu</div>
                </div>`;
            } else if (slide.type === 'countdown') {
                div.innerHTML = `<div class="slide-countdown"><span class="countdown-time">0:00</span></div>`;
            } else if (slide.type === 'logo-bouncer') {
                const logoSrc = slide.src || (config && config.logo) || '/img/logo_imprezja.png';
                const src = (logoSrc || '/img/logo_imprezja.png').startsWith('/') ? (logoSrc || '/img/logo_imprezja.png') : '/' + (logoSrc || '/img/logo_imprezja.png');
                div.innerHTML = `<div class="slide-logo-bouncer">
                    <img class="logo-img" src="${src}" alt="Logo">
                    <div class="logo-no-mic" style="display:none">
                        <strong>Brak dostępu do mikrofonu</strong> – logo nie pulsuje.<br><br>
                        Udziel uprawnień do mikrofonu. Na Macu możesz użyć BlackHole – przekieruj dźwięk DJ na wejście mikrofonowe.
                    </div>
                </div>`;
            } else {
                div.innerHTML = '<div class="empty-state">Nieznany typ</div>';
            }
            return div;
        }

        function renderAll() {
            cleanupVisualization();
            const wrapper = document.getElementById('slides-wrapper');
            wrapper.innerHTML = '';
            const trans = (config && config.transition) || 'fade';
            if (!config || !config.slides || config.slides.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'slide-frame active';
                empty.innerHTML = '<p class="empty-state">Wybierz prezentację w panelu admina.<br><span style="font-size:0.9rem;opacity:0.8;">Panel → Prezentacja → Załaduj</span></p>';
                wrapper.appendChild(empty);
                return;
            }
            config.slides.forEach((s, i) => {
                const frame = renderSlide(s, i);
                frame.classList.add('trans-' + trans);
                wrapper.appendChild(frame);
                const vid = frame.querySelector('.slide-video video');
                if (vid) setupVideoUnmuteOnPlay(vid);
            });
            applyVideoVolumes();
            goToSlide(currentIndex, true);
        }

        function cleanupVisualization() {
            if (vizWinampAnimationId) {
                cancelAnimationFrame(vizWinampAnimationId);
                vizWinampAnimationId = null;
            }
            if (vizWinampStream) {
                vizWinampStream.getTracks().forEach(t => t.stop());
                vizWinampStream = null;
            }
            if (vizWinampRotateTimerId) {
                clearInterval(vizWinampRotateTimerId);
                vizWinampRotateTimerId = null;
            }
            if (vizWinampContainer) {
                vizWinampContainer.innerHTML = '';
                vizWinampContainer = null;
            }
            if (vizAnalyzer) {
                try {
                    if (vizMicStream) vizAnalyzer.disconnectInput(vizMicStream, true);
                    vizAnalyzer.destroy();
                } catch (e) { console.warn('viz cleanup:', e); }
                vizAnalyzer = null;
                vizMicStream = null;
            }
            if (clockIntervalId) { clearInterval(clockIntervalId); clockIntervalId = null; }
            if (dbmeterAnimationId) { cancelAnimationFrame(dbmeterAnimationId); dbmeterAnimationId = null; }
            if (dbmeterStream) { dbmeterStream.getTracks().forEach(t => t.stop()); dbmeterStream = null; }
            dbmeterAnalyser = null;
            if (countdownTimerId) { clearTimeout(countdownTimerId); countdownTimerId = null; }
            countdownEndTime = null;
            document.querySelectorAll('.slide-countdown.countdown-zero').forEach(el => el.classList.remove('countdown-zero'));
            if (logoBouncerStream) { logoBouncerStream.getTracks().forEach(t => t.stop()); logoBouncerStream = null; }
            if (logoBouncerAnimationId) { cancelAnimationFrame(logoBouncerAnimationId); logoBouncerAnimationId = null; }
            if (vizWebvsResizeHandler) { window.removeEventListener('resize', vizWebvsResizeHandler); vizWebvsResizeHandler = null; }
            if (vizWebvsStream) { vizWebvsStream.getTracks().forEach(t => t.stop()); vizWebvsStream = null; }
            if (vizWebvsMain) { try { vizWebvsMain.destroy(); } catch (e) {} vizWebvsMain = null; }
            vizWebvsChangePreset = null;
            if (vizMilkdropStream) { vizMilkdropStream.getTracks().forEach(t => t.stop()); vizMilkdropStream = null; }
            if (vizMilkdropVisualizer) { try { vizMilkdropVisualizer.disconnectAudio(); } catch (e) {} vizMilkdropVisualizer = null; }
            if (vizMilkdropResizeHandler) { window.removeEventListener('resize', vizMilkdropResizeHandler); vizMilkdropResizeHandler = null; }
            vizMilkdropChangePreset = null;
            const alarm = document.getElementById('countdown-alarm');
            const bell = document.getElementById('countdown-bell');
            if (alarm) { alarm.pause(); alarm.currentTime = 0; }
            if (bell) { bell.pause(); bell.currentTime = 0; }
        }

        const WINAMP_MODES = [
            { id: 'spectrum', name: 'Spektrum' },
            { id: 'scope', name: 'Oscyloskop' },
            { id: 'circle', name: 'Koło' },
            { id: 'line', name: 'Linia' },
            { id: 'wave', name: 'Fala' }
        ];

        function runWinamp(container, slide) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                container.querySelector('.viz-no-mic').style.display = 'block';
                container.querySelector('.viz-container').style.display = 'none';
                return;
            }
            const autoRotate = !!(slide.winampAutoRotate);
            const rotateInterval = Math.max(5, Math.min(120, slide.winampRotateInterval || 10)) * 1000;

            const audioConstraints = { autoGainControl: false, echoCancellation: false, noiseSuppression: false };
            navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false })
                .then(stream => {
                    vizWinampStream = stream;
                    const vizContainer = container.querySelector('.viz-container');
                    vizWinampContainer = vizContainer;
                    const noMic = container.querySelector('.viz-no-mic');
                    if (noMic) noMic.style.display = 'none';
                    vizContainer.style.display = 'block';
                    vizContainer.innerHTML = '';
                    const canvas = document.createElement('canvas');
                    canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;display:block;cursor:pointer;';
                    vizContainer.appendChild(canvas);
                    const hint = document.createElement('div');
                    hint.className = 'viz-winamp-hint';
                    hint.textContent = 'Kliknij aby zmienić wizualizację';
                    vizContainer.appendChild(hint);

                    const ctx = canvas.getContext('2d');
                    if (!ctx) return;
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const src = audioCtx.createMediaStreamSource(stream);
                    const gainNode = audioCtx.createGain();
                    gainNode.gain.value = Math.pow(10, 9 / 20);
                    src.connect(gainNode);
                    const analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 2048;
                    analyser.smoothingTimeConstant = 0.7;
                    analyser.minDecibels = -90;
                    analyser.maxDecibels = -25;
                    gainNode.connect(analyser);
                    const freqData = new Uint8Array(analyser.frequencyBinCount);
                    const timeData = new Uint8Array(analyser.fftSize);
                    const BAR_COUNT = 64;
                    const barFalloff = new Float32Array(BAR_COUNT);
                    let modeIndex = 0;

                    function setMode(i) {
                        modeIndex = ((i % WINAMP_MODES.length) + WINAMP_MODES.length) % WINAMP_MODES.length;
                        const modeName = WINAMP_MODES[modeIndex].name;
                        hint.textContent = modeName + (autoRotate ? ' • auto co ' + (rotateInterval / 1000) + ' s' : ' • ← → lub klik');
                    }

                    function nextMode() {
                        setMode(modeIndex + 1);
                    }

                    canvas.onclick = () => nextMode();

                    if (autoRotate) {
                        vizWinampRotateTimerId = setInterval(nextMode, rotateInterval);
                    }
                    setMode(0);

                    function resize() {
                        const nw = Math.max(300, window.innerWidth);
                        const nh = Math.max(300, window.innerHeight);
                        if (canvas.width !== nw || canvas.height !== nh) {
                            canvas.width = nw;
                            canvas.height = nh;
                        }
                    }

                    function drawSpectrum() {
                        const cw = canvas.width;
                        const ch = canvas.height;
                        analyser.getByteFrequencyData(freqData);
                        const barW = Math.max(2, (cw / BAR_COUNT) * 0.7);
                        const gap = (cw / BAR_COUNT) - barW;
                        const maxH = ch * 0.45;
                        const len = freqData.length;
                        for (let i = 0; i < BAR_COUNT; i++) {
                            const norm = i / BAR_COUNT;
                            const normNext = (i + 1) / BAR_COUNT;
                            const startBin = Math.floor(len * Math.pow(norm, FREQ_EXP));
                            const endBin = Math.min(len, Math.floor(len * Math.pow(normNext, FREQ_EXP)) + 1);
                            let maxVal = 0;
                            for (let j = startBin; j < endBin; j++) maxVal = Math.max(maxVal, freqData[j] || 0);
                            const raw = maxVal / 255;
                            const target = raw * maxH;
                            barFalloff[i] = Math.max(barFalloff[i] * 0.85, target);
                            const h = Math.max(2, barFalloff[i]);
                            const x = (cw / BAR_COUNT) * i + gap / 2;
                            const y = ch / 2 - h / 2;
                            const grad = ctx.createLinearGradient(x, y + h, x, y);
                            grad.addColorStop(0, '#0a2a0a');
                            grad.addColorStop(0.4, '#1a5a1a');
                            grad.addColorStop(0.7, '#3dd63d');
                            grad.addColorStop(1, '#7fff7f');
                            ctx.fillStyle = grad;
                            ctx.fillRect(x, y, barW, h);
                            ctx.fillRect(x, ch / 2, barW, h);
                        }
                    }

                    function drawScope() {
                        const cw = canvas.width;
                        const ch = canvas.height;
                        analyser.getByteTimeDomainData(timeData);
                        ctx.strokeStyle = '#3dd63d';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        for (let i = 0; i < timeData.length; i++) {
                            const x = (i / timeData.length) * cw;
                            const y = ch / 2 + (128 - timeData[i]) / 128 * (ch * 0.4);
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                    }

                    const FREQ_EXP = 0.85;
                    function getBarValue(i) {
                        const len = freqData.length;
                        const norm = i / BAR_COUNT;
                        const normNext = (i + 1) / BAR_COUNT;
                        const startBin = Math.floor(len * Math.pow(norm, FREQ_EXP));
                        const endBin = Math.min(len, Math.floor(len * Math.pow(normNext, FREQ_EXP)) + 1);
                        let maxVal = 0;
                        for (let j = startBin; j < endBin; j++) maxVal = Math.max(maxVal, freqData[j] || 0);
                        return maxVal / 255;
                    }

                    function drawCircle() {
                        const cw = canvas.width;
                        const ch = canvas.height;
                        const cx = cw / 2;
                        const cy = ch / 2;
                        const maxR = Math.min(cw, ch) * 0.4;
                        analyser.getByteFrequencyData(freqData);
                        const barW = 4;
                        for (let i = 0; i < BAR_COUNT; i++) {
                            const raw = getBarValue(i);
                            barFalloff[i] = Math.max(barFalloff[i] * 0.85, raw * maxR);
                            const r = barFalloff[i];
                            const a = (i / BAR_COUNT) * Math.PI * 2 - Math.PI / 2;
                            const x1 = cx + Math.cos(a) * maxR;
                            const y1 = cy + Math.sin(a) * maxR;
                            const x2 = cx + Math.cos(a) * (maxR + r);
                            const y2 = cy + Math.sin(a) * (maxR + r);
                            const grad = ctx.createLinearGradient(x1, y1, x2, y2);
                            grad.addColorStop(0, '#1a5a1a');
                            grad.addColorStop(1, '#7fff7f');
                            ctx.strokeStyle = grad;
                            ctx.lineWidth = barW;
                            ctx.beginPath();
                            ctx.moveTo(x1, y1);
                            ctx.lineTo(x2, y2);
                            ctx.stroke();
                        }
                    }

                    function drawLine() {
                        const cw = canvas.width;
                        const ch = canvas.height;
                        analyser.getByteFrequencyData(freqData);
                        ctx.strokeStyle = '#3dd63d';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        for (let i = 0; i <= BAR_COUNT; i++) {
                            const v = i < BAR_COUNT ? getBarValue(i) : getBarValue(BAR_COUNT - 1);
                            const x = (i / BAR_COUNT) * cw;
                            const y = ch - v * ch * 0.8;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.stroke();
                    }

                    function drawWave() {
                        const cw = canvas.width;
                        const ch = canvas.height;
                        analyser.getByteFrequencyData(freqData);
                        const barH = ch / BAR_COUNT * 0.8;
                        for (let i = 0; i < BAR_COUNT; i++) {
                            const raw = getBarValue(i);
                            barFalloff[i] = Math.max(barFalloff[i] * 0.85, raw);
                            const w = barFalloff[i] * cw * 0.9;
                            const x = (cw - w) / 2;
                            const y = (i / BAR_COUNT) * ch + ch / BAR_COUNT * 0.1;
                            const grad = ctx.createLinearGradient(x, y, x + w, y);
                            grad.addColorStop(0, '#0a2a0a');
                            grad.addColorStop(0.5, '#3dd63d');
                            grad.addColorStop(1, '#0a2a0a');
                            ctx.fillStyle = grad;
                            ctx.fillRect(x, y, w, barH);
                        }
                    }

                    function draw() {
                        if (!vizWinampContainer) return;
                        if (vizWinampModeDelta !== 0) {
                            const d = vizWinampModeDelta;
                            vizWinampModeDelta = 0;
                            setMode(modeIndex + d);
                        }
                        resize();
                        const cw = canvas.width;
                        const ch = canvas.height;
                        ctx.fillStyle = '#000';
                        ctx.fillRect(0, 0, cw, ch);
                        const mode = WINAMP_MODES[modeIndex].id;
                        if (mode === 'spectrum') drawSpectrum();
                        else if (mode === 'scope') drawScope();
                        else if (mode === 'circle') drawCircle();
                        else if (mode === 'line') drawLine();
                        else if (mode === 'wave') drawWave();
                        vizWinampAnimationId = requestAnimationFrame(draw);
                    }
                    draw();
                })
                .catch(() => {
                    container.querySelector('.viz-no-mic').style.display = 'block';
                    container.querySelector('.viz-container').style.display = 'none';
                });
        }

        function runDbmeter(container) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                container.querySelector('.db-no-mic').style.display = 'block';
                return;
            }
            const audioConstraints = { autoGainControl: false, echoCancellation: false, noiseSuppression: false };
            navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false })
                .then(stream => {
                    dbmeterStream = stream;
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const src = ctx.createMediaStreamSource(stream);
                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 2048;
                    analyser.smoothingTimeConstant = 0.5;
                    analyser.minDecibels = -90;
                    analyser.maxDecibels = -10;
                    src.connect(analyser);
                    dbmeterAnalyser = analyser;
                    const data = new Uint8Array(analyser.frequencyBinCount);
                    const valEl = container.querySelector('.db-value');
                    const barEl = container.querySelector('.db-bar');
                    const minEl = container.querySelector('.db-min');
                    const maxEl = container.querySelector('.db-max');
                    let smoothedDb = 40;
                    const UPDATE_MS = 100;
                    const MINMAX_MS = 5000;
                    let lastUpdate = 0;
                    let lastMinMaxUpdate = 0;
                    const buffer = [];
                    const bufferMaxAge = 60000;
                    const DB_MIN = 30;
                    const DB_MAX = 120;
                    function fmtDb(db, alwaysDecimal) {
                        const d = Math.round(db * 10) / 10;
                        const s = (alwaysDecimal ? d.toFixed(1) : (d % 1 === 0 ? String(d) : d.toFixed(1))).replace('.', ',');
                        return s + ' dB';
                    }
                    function update(now) {
                        if (!dbmeterAnalyser) return;
                        dbmeterAnalyser.getByteFrequencyData(data);
                        let sum = 0;
                        for (let i = 0; i < data.length; i++) sum += data[i];
                        const avg = data.length ? sum / data.length : 0;
                        const rawDb = 20 * Math.log10(avg / 255 * 400 + 0.01) + 60.5;
                        const dbSpl = Math.max(DB_MIN, Math.min(DB_MAX, rawDb));
                        smoothedDb = smoothedDb * 0.6 + dbSpl * 0.4;
                        buffer.push({ db: smoothedDb, t: now });
                        while (buffer.length && buffer[0].t < now - bufferMaxAge) buffer.shift();
                        if (now - lastUpdate >= UPDATE_MS) {
                            lastUpdate = now;
                            if (valEl) valEl.textContent = fmtDb(smoothedDb, true);
                            const pct = Math.min(100, Math.max(0, (smoothedDb - DB_MIN) / (DB_MAX - DB_MIN) * 100));
                            if (barEl) barEl.style.width = pct + '%';
                        }
                        if (now - lastMinMaxUpdate >= MINMAX_MS && buffer.length > 0) {
                            lastMinMaxUpdate = now;
                            let min = buffer[0].db, max = buffer[0].db;
                            for (let i = 1; i < buffer.length; i++) {
                                if (buffer[i].db < min) min = buffer[i].db;
                                if (buffer[i].db > max) max = buffer[i].db;
                            }
                            if (minEl) minEl.textContent = 'MIN ' + fmtDb(min, true);
                            if (maxEl) maxEl.textContent = 'MAX ' + fmtDb(max, true);
                        }
                        dbmeterAnimationId = requestAnimationFrame(update);
                    }
                    update(0);
                })
                .catch(() => { container.querySelector('.db-no-mic').style.display = 'block'; });
        }

        function runLogoBouncer(container, logoUrl) {
            const img = container.querySelector('.logo-img');
            const noMic = container.querySelector('.logo-no-mic');
            if (!img) return;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                if (noMic) noMic.style.display = 'flex';
                return;
            }
            const audioConstraints = { autoGainControl: false, echoCancellation: false, noiseSuppression: false };
            navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false })
                .then(stream => {
                    logoBouncerStream = stream;
                    if (noMic) noMic.style.display = 'none';
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const src = ctx.createMediaStreamSource(stream);
                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 4096;
                    analyser.smoothingTimeConstant = 0.2;
                    src.connect(analyser);
                    const data = new Uint8Array(analyser.frequencyBinCount);
                    const sr = ctx.sampleRate;
                    const binLo = Math.floor(40 * analyser.fftSize / sr);
                    const binHi = Math.min(analyser.frequencyBinCount - 1, Math.ceil(150 * analyser.fftSize / sr));
                    let smoothedScale = 1;
                    let beatThreshold = 50;
                    let lastBeatTime = 0;
                    let lastMusicTime = 0;
                    let recentMin = 255;
                    const SCALE_MIN = 1;
                    const SCALE_MAX = 1.35;
                    const SPL_MIN = 48;
                    const ARM_THRESH = 50;
                    const ARM_TIMEOUT_MS = 2000;
                    const MIN_DELTA = 20;
                    // 80–160 BPM: 140 BPM (≈428 ms) to częste tempo na imprezach. 400 ms ≈ 150 BPM max – wspiera 140 BPM, ogranicza „szaleństwo”.
                    const BEAT_HOLD_MS = 400;
                    const BEAT_DECAY = 0.97;
                    const SMOOTH_UP = 0.5;
                    const SMOOTH_DOWN = 0.35;
                    function update(t) {
                        if (!logoBouncerStream) return;
                        analyser.getByteFrequencyData(data);
                        let sum = 0;
                        for (let i = binLo; i <= binHi; i++) sum += data[i];
                        const current = (binHi - binLo + 1) ? sum / (binHi - binLo + 1) : 0;
                        if (current > ARM_THRESH) lastMusicTime = t;
                        const armed = (t - lastMusicTime) < ARM_TIMEOUT_MS;
                        if (current < recentMin) recentMin = current;
                        else recentMin = recentMin * 0.997 + current * 0.003;
                        beatThreshold *= BEAT_DECAY;
                        beatThreshold = Math.max(beatThreshold, SPL_MIN);
                        const holdOk = (t - lastBeatTime) >= BEAT_HOLD_MS;
                        const delta = current - recentMin;
                        const isBeat = armed && holdOk && current >= SPL_MIN && current > beatThreshold && delta >= MIN_DELTA;
                        if (isBeat) {
                            beatThreshold = current;
                            lastBeatTime = t;
                        }
                        const targetScale = isBeat ? SCALE_MAX : SCALE_MIN;
                        const smooth = targetScale > smoothedScale ? SMOOTH_UP : SMOOTH_DOWN;
                        smoothedScale = smoothedScale * (1 - smooth) + targetScale * smooth;
                        img.style.transform = 'scale(' + smoothedScale.toFixed(3) + ')';
                        logoBouncerAnimationId = requestAnimationFrame(update);
                    }
                    update(performance.now());
                })
                .catch(() => { if (noMic) noMic.style.display = 'flex'; });
        }

        function runCountdown(container, minutes, forcePlaying) {
            const el = container.querySelector('.countdown-time');
            if (!el) return;
            const totalSec = Math.max(1, minutes) * 60;
            const shouldRun = forcePlaying || playing;
            function updateDisplay(secLeft) {
                const m = Math.floor(secLeft / 60);
                const s = secLeft % 60;
                el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
            }
            if (countdownReachedZeroIndex === currentIndex) {
                el.textContent = '0:00';
                container.classList.add('countdown-zero');
                return;
            }
            if (countdownTimerId) { clearTimeout(countdownTimerId); countdownTimerId = null; }
            if (shouldRun) {
                const alarm = document.getElementById('countdown-alarm');
                if (alarm) {
                    alarm.src = '/uploads/podziekowanie.mp3';
                    alarm.loop = true;
                    alarm.play().catch(() => {});
                }
                countdownEndTime = Date.now() + totalSec * 1000;
                function tick() {
                    const left = Math.max(0, Math.ceil((countdownEndTime - Date.now()) / 1000));
                    updateDisplay(left);
                    if (left <= 0) {
                        countdownTimerId = null;
                        el.textContent = '0:00';
                        container.classList.add('countdown-zero');
                        countdownReachedZeroIndex = currentIndex;
                        const a = document.getElementById('countdown-alarm');
                        if (a) { a.pause(); a.currentTime = 0; }
                        const b = document.getElementById('countdown-bell');
                        if (b) { b.src = '/sfx/undertakers-bell.mp3'; b.loop = false; b.play().catch(() => {}); }
                        return;
                    }
                    countdownTimerId = setTimeout(tick, 200);
                }
                tick();
            } else {
                container.classList.remove('countdown-zero');
                updateDisplay(totalSec);
                const alarm = document.getElementById('countdown-alarm');
                if (alarm) { alarm.pause(); alarm.currentTime = 0; }
            }
        }

        function loadAudiomotion() {

        function runWebvs(container, slide) {

                container.querySelector('.viz-container').style.display = 'none';

        function runWebvsInner(container, slide) {
            const audioConstraints = { autoGainControl: false, echoCancellation: false, noiseSuppression: false };
            navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false })
                .then(stream => {
                    vizWebvsStream = stream;
                    const vizContainer = container.querySelector('.viz-container');
                    const noMic = container.querySelector('.viz-no-mic');
                    if (noMic) noMic.style.display = 'none';
                    vizContainer.style.display = 'block';
                    vizContainer.innerHTML = '';
                    const canvas = document.createElement('canvas');
                    canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;display:block;cursor:pointer;';
                    vizContainer.appendChild(canvas);
                    const hint = document.createElement('div');
                    hint.className = 'viz-winamp-hint';
                    hint.textContent = 'Webvs AVS – kliknij aby zmienić preset';
                    vizContainer.appendChild(hint);
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const src = ctx.createMediaStreamSource(stream);
                    const gainNode = ctx.createGain();
                    gainNode.gain.value = Math.pow(10, 9 / 20);
                    src.connect(gainNode);
                    const analyser = new window.Webvs.WebAudioAnalyser({ context: ctx, fftSize: 512 });
                    analyser.connectToNode(gainNode);
                    let presetIndex = 0;
                    function loadPreset() {
                        const p = WEBVS_PRESETS[presetIndex];
                        hint.textContent = (p.name || 'Webvs') + ' • strzałki lub klik';
                        vizWebvsMain.loadPreset(p.preset);
                    }
                    vizWebvsMain = new window.Webvs.Main({ canvas, analyser, showStat: false });
                    loadPreset();
                    vizWebvsMain.start();
                    vizWebvsChangePreset = (delta) => {
                        presetIndex = (presetIndex + (delta || 1) + WEBVS_PRESETS.length) % WEBVS_PRESETS.length;
                        loadPreset();
                    };
                    vizContainer.addEventListener('click', () => vizWebvsChangePreset(1));
                    const resize = () => {
                        const w = vizContainer.clientWidth || window.innerWidth;
                        const h = vizContainer.clientHeight || window.innerHeight;
                        if (canvas.width !== w || canvas.height !== h) {
                            canvas.width = w;
                            canvas.height = h;
                            if (vizWebvsMain) vizWebvsMain.notifyResize();
                        }
                    };
                    resize();
                    vizWebvsResizeHandler = resize;
                    window.addEventListener('resize', vizWebvsResizeHandler);
                })
                .catch(err => {
                    console.warn('getUserMedia denied:', err);
                    container.querySelector('.viz-no-mic').style.display = 'block';
                    container.querySelector('.viz-container').style.display = 'none';
                });
        }

        function loadMilkdrop() {
            if (window._milkdropLoadPromise) return window._milkdropLoadPromise;
            const presetUrls = [
                'https://esm.sh/butterchurn-presets@2.4.7',
                'https://esm.sh/butterchurn-presets@2.4.7/lib/butterchurnPresetsExtra.min.js',
                'https://esm.sh/butterchurn-presets@2.4.7/lib/butterchurnPresetsExtra2.min.js',
                'https://esm.sh/butterchurn-presets@2.4.7/lib/butterchurnPresetsMD1.min.js',
                'https://esm.sh/butterchurn-presets@2.4.7/lib/butterchurnPresetsNonMinimal.min.js'
            ];
            window._milkdropLoadPromise = Promise.all([
                import('https://esm.sh/butterchurn@2.6.7'),
                Promise.all(presetUrls.map(url => import(url).catch(() => ({})))).then(modules => {
                    const merged = {};
                    modules.forEach(mod => {
                        if (!mod || (typeof mod !== 'object')) return;
                        const p = mod.default || mod;
                        const presets = p && p.getPresets ? p.getPresets() : (p && typeof p === 'object' && !p.getPresets ? p : {});
                        if (presets && typeof presets === 'object') {
                            Object.keys(presets).forEach(k => { if (presets[k] && !merged[k]) merged[k] = presets[k]; });
                        }
                    });
                    return merged;
                })
            ]).then(([bc, allPresets]) => ({
                butterchurn: bc.default || bc,
                allPresets: allPresets
            }));
            return window._milkdropLoadPromise;
        }

        function runMilkdrop(container, slide) {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                container.querySelector('.viz-no-mic').style.display = 'block';
                container.querySelector('.viz-container').style.display = 'none';
                return;
            }
            const canvas = document.createElement('canvas');
            const testCtx = canvas.getContext('webgl2');
            if (!testCtx) {
                container.querySelector('.viz-no-mic').innerHTML = '<strong>WebGL 2</strong> nie jest obsługiwany – Milkdrop wymaga nowszej przeglądarki.';
                container.querySelector('.viz-no-mic').style.display = 'block';
                container.querySelector('.viz-container').style.display = 'none';
                return;
            }
            loadMilkdrop().then(({ butterchurn, allPresets }) => {
                const audioConstraints = { autoGainControl: false, echoCancellation: false, noiseSuppression: false };
                return navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false }).then(stream => ({ stream, butterchurn, allPresets }));
            }).then(({ stream, butterchurn, allPresets }) => {
                vizMilkdropStream = stream;
                const vizContainer = container.querySelector('.viz-container');
                const noMic = container.querySelector('.viz-no-mic');
                if (noMic) noMic.style.display = 'none';
                vizContainer.style.display = 'block';
                vizContainer.innerHTML = '';
                const canvas = document.createElement('canvas');
                canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;display:block;cursor:pointer;';
                vizContainer.appendChild(canvas);
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                if (ctx.state === 'suspended') ctx.resume();
                const src = ctx.createMediaStreamSource(stream);
                const gainNode = ctx.createGain();
                gainNode.gain.value = Math.pow(10, 10 / 20);
                src.connect(gainNode);
                const w = Math.max(640, vizContainer.clientWidth || window.innerWidth);
                const h = Math.max(480, vizContainer.clientHeight || window.innerHeight);
                const visualizer = butterchurn.createVisualizer(ctx, canvas, { width: w, height: h });
                visualizer.connectAudio(gainNode);
                vizMilkdropVisualizer = visualizer;
                vizMilkdropPresetNames = Object.keys(allPresets || {}).filter(k => allPresets[k]);
                if (vizMilkdropPresetNames.length === 0) return;
                vizMilkdropPresetIndex = Math.floor(Math.random() * vizMilkdropPresetNames.length);
                function loadPreset() {
                    const name = vizMilkdropPresetNames[vizMilkdropPresetIndex];
                    const preset = allPresets[name];
                    if (preset && vizMilkdropVisualizer) {
                        vizMilkdropVisualizer.loadPreset(preset, 2.0);
                    }
                }
                loadPreset();
                vizMilkdropChangePreset = (delta) => {
                    vizMilkdropPresetIndex = (vizMilkdropPresetIndex + (delta || 1) + vizMilkdropPresetNames.length) % vizMilkdropPresetNames.length;
                    loadPreset();
                };
                vizContainer.addEventListener('click', (e) => { e.preventDefault(); vizMilkdropChangePreset(1); });
                const VIZ_TARGET_FPS = 30;
                const VIZ_FRAME_INTERVAL = 1000 / VIZ_TARGET_FPS;
                let vizLastRender = 0;
                function render(now) {
                    if (!vizMilkdropVisualizer) return;
                    if (now - vizLastRender >= VIZ_FRAME_INTERVAL) {
                        vizLastRender = now;
                        vizMilkdropVisualizer.render();
                    }
                    requestAnimationFrame(render);
                }
                requestAnimationFrame(render);
                vizMilkdropResizeHandler = () => {
                    const nw = vizContainer.clientWidth || window.innerWidth;
                    const nh = vizContainer.clientHeight || window.innerHeight;
                    if (vizMilkdropVisualizer && (canvas.width !== nw || canvas.height !== nh)) {
                        vizMilkdropVisualizer.setRendererSize(nw, nh);
                    }
                };
                vizMilkdropResizeHandler();
                window.addEventListener('resize', vizMilkdropResizeHandler);
            }).catch(err => {
                console.warn('Milkdrop:', err);
                container.querySelector('.viz-no-mic').innerHTML = '<strong>Błąd</strong> – ' + (err.message || 'Milkdrop nie załadował się') + '. Wymaga połączenia z internetem (CDN).';
                container.querySelector('.viz-no-mic').style.display = 'block';
                container.querySelector('.viz-container').style.display = 'none';
            });
        }

        function initVisualization(container, preset, slide) {
            if (preset === 'winamp' || preset === 'tunnel') {
                runWinamp(container, slide || {});
                return;
            }
            if (preset === 'webvs') {
                runWebvs(container, slide || {});
                return;
            }
            if (preset === 'milkdrop') {
                runMilkdrop(container, slide || {});
                return;
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                container.querySelector('.viz-no-mic').style.display = 'block';
                container.querySelector('.viz-container').style.display = 'none';
                return;
            }
            loadAudiomotion().then(() => {
                if (!window.AudioMotionAnalyzer) {
                    container.querySelector('.viz-no-mic').innerHTML = '<strong>Błąd</strong> – biblioteka audioMotion nie załadowana.';
                    container.querySelector('.viz-no-mic').style.display = 'block';
                    return Promise.reject(new Error('AudioMotion nie załadowana'));
                }
                const audioConstraints = { autoGainControl: false, echoCancellation: false, noiseSuppression: false };
                return navigator.mediaDevices.getUserMedia({ audio: audioConstraints, video: false });
            }).then(stream => {
                if (!stream) return;
                    const vizContainer = container.querySelector('.viz-container');
                    vizContainer.innerHTML = '';
                    vizContainer.style.display = 'block';
                    container.querySelector('.viz-no-mic').style.display = 'none';
                    const opts = {
                        gradient: 'rainbow',
                        height: window.innerHeight,
                        showScaleY: false,
                        mirror: 0,
                        volume: 0
                    };
                    if (preset === 'led') {
                        opts.ledBars = true;
                        opts.trueLeds = true;
                    } else if (preset === 'spectrum') {
                        opts.mode = 1;
                    } else if (preset === 'equalizer-mirror') {
                        opts.mirror = 2;
                    }
                    vizAnalyzer = new AudioMotionAnalyzer(vizContainer, opts);
                    vizMicStream = vizAnalyzer.audioCtx.createMediaStreamSource(stream);
                    vizAnalyzer.connectInput(vizMicStream);
                })
                .catch(err => {
                    console.warn('getUserMedia/audiomotion:', err);
                    container.querySelector('.viz-no-mic').innerHTML = '<strong>Błąd</strong> – ' + (err.message || 'mikrofon lub biblioteka') + '.';
                    container.querySelector('.viz-no-mic').style.display = 'block';
                    container.querySelector('.viz-container').style.display = 'none';
                });
        }

        function goToSlide(index, forceInit) {
            if (!config || !config.slides.length) return;
            const newIndex = ((index % config.slides.length) + config.slides.length) % config.slides.length;
            if (!forceInit && newIndex === currentIndex) return;
            const prevSlide = config.slides[currentIndex];
            const needsCleanup = prevSlide && ['visualization','clock','dbmeter','countdown','logo-bouncer'].includes(prevSlide.type);
            if (needsCleanup) {
                if (prevSlide.type === 'countdown') countdownReachedZeroIndex = -1;
                cleanupVisualization();
            }
            currentIndex = newIndex;
            document.querySelectorAll('#slides-wrapper .slide-frame').forEach((f, i) => {
                f.classList.toggle('active', i === currentIndex);
            });
            const slide = config.slides[currentIndex];
            const frame = document.querySelector(`#slides-wrapper .slide-frame[data-index="${currentIndex}"]`);
            if (slide && frame) {
                if (slide.type === 'visualization') {
                    const viz = frame.querySelector('.slide-visualization');
                    if (viz) {
                        initVisualization(viz, String(slide.preset || 'equalizer').toLowerCase(), slide);
                        if (slide.vizOverlayClock) {
                            const clockEl = viz.querySelector('.viz-overlay-clock');
                            if (clockEl) runClock(clockEl, slide.vizOverlayClockSeconds !== false);
                        }
                        if (slide.vizOverlayCountdown) {
                            const cdEl = viz.querySelector('.viz-overlay-countdown');
                            if (cdEl) runCountdown(cdEl, slide.vizOverlayCountdownMinutes || 3);
                        }
                        if (slide.vizOverlayDbmeter) {
                            const dbEl = viz.querySelector('.viz-overlay-dbmeter');
                            if (dbEl) runDbmeter(dbEl);
                        }
                        applyLiveOverlay();
                    }
                } else if (slide.type === 'clock') {
                    const clockDiv = frame.querySelector('.slide-clock');
                    if (clockDiv) runClock(clockDiv, slide.showSeconds !== false);
                } else if (slide.type === 'dbmeter') {
                    const dbDiv = frame.querySelector('.slide-dbmeter');
                    if (dbDiv) runDbmeter(dbDiv);
                } else if (slide.type === 'countdown') {
                    const cdDiv = frame.querySelector('.slide-countdown');
                    if (cdDiv) runCountdown(cdDiv, slide.minutes || 3);
                } else if (slide.type === 'logo-bouncer') {
                    const lbDiv = frame.querySelector('.slide-logo-bouncer');
                    if (lbDiv) runLogoBouncer(lbDiv, slide.src || (config && config.logo) || '/img/logo_imprezja.png');
                } else if (slide.type === 'video') {
                    const vid = frame.querySelector('.slide-video video');
                    if (vid) {
                        if (playing) {
                            vid.play().catch(() => {});
                        } else {
                            vid.pause();
                            vid.currentTime = 0;
                        }
                    }
                }
            }
        }

        function syncVideoPlayback() {
            const frame = document.querySelector('#slides-wrapper .slide-frame.active');
            const activeVid = frame && frame.querySelector('.slide-video video');
            document.querySelectorAll('#slides-wrapper .slide-video video').forEach(v => {
                if (v === activeVid && playing) v.play().catch(() => {});
                else { v.pause(); v.currentTime = 0; }
            });
        }

        function startCountdownIfNeeded() {
            if (!config || !config.slides.length || !playing) return;
            const slide = config.slides[currentIndex];
            const frame = document.querySelector(`#slides-wrapper .slide-frame[data-index="${currentIndex}"]`);
            if (slide && slide.type === 'countdown') {
                const cdDiv = frame && frame.querySelector('.slide-countdown');
                if (cdDiv) runCountdown(cdDiv, slide.minutes || 3);
            } else if (slide && slide.type === 'visualization' && slide.vizOverlayCountdown) {
                const cdDiv = frame && frame.querySelector('.viz-overlay-countdown');
                if (cdDiv) runCountdown(cdDiv, slide.vizOverlayCountdownMinutes || 3);
            }
        }

        function stopCountdownIfNeeded() {
            if (!config || !config.slides.length) return;
            const slide = config.slides[currentIndex];
            if (!slide) return;
            const frame = document.querySelector(`#slides-wrapper .slide-frame[data-index="${currentIndex}"]`);
            const totalSec = (slide.type === 'countdown' ? (slide.minutes || 3) : (slide.type === 'visualization' && slide.vizOverlayCountdown ? (slide.vizOverlayCountdownMinutes || 3) : 0)) * 60;
            if (totalSec > 0) {
                if (countdownTimerId) { clearTimeout(countdownTimerId); countdownTimerId = null; }
                const cdDiv = frame && (slide.type === 'countdown' ? frame.querySelector('.slide-countdown') : frame.querySelector('.viz-overlay-countdown'));
                if (cdDiv) {
                    const m = Math.floor(totalSec / 60);
                    const s = totalSec % 60;
                    const el = cdDiv.querySelector('.countdown-time');
                    if (el) el.textContent = m + ':' + (s < 10 ? '0' : '') + s;
                    cdDiv.classList.remove('countdown-zero');
                }
            }
        }

        function getSlideDuration(index) {
            if (!config || !config.slides || !config.slides[index]) return DEFAULT_SLIDE_DURATION;
            const s = config.slides[index];
            if (s.type === 'image' && typeof s.duration === 'number') return s.duration * 1000;
            if (s.type === 'visualization') return (typeof s.duration === 'number' && s.duration > 0) ? s.duration * 1000 : 3600000;
            if (s.type === 'logo-bouncer') return (typeof s.duration === 'number' && s.duration > 0) ? s.duration * 1000 : 3600000;
            if (s.type === 'countdown') return 86400000;
            return DEFAULT_SLIDE_DURATION;
        }

        function startAutoAdvance() {
            stopAutoAdvance();
            if (!playing || !config || !config.slides.length) return;
            function advance() {
                const next = (currentIndex + 1) % config.slides.length;
                if (next === 0 && !loop) {
                    playing = false;
                    stopAutoAdvance();
                    return;
                }
                goToSlide(next);
                const ms = getSlideDuration(next);
                autoAdvanceTimer = setTimeout(advance, ms);
            }
            const ms = getSlideDuration(currentIndex);
            autoAdvanceTimer = setTimeout(advance, ms);
        }

        function stopAutoAdvance() {
            if (autoAdvanceTimer) {
                clearTimeout(autoAdvanceTimer);
                autoAdvanceTimer = null;
            }
        }

        function updateBackgroundMusic() {
            const audio = document.getElementById('bg-music');
            let src = config && config.backgroundMusic ? (config.backgroundMusic || '').trim() : '';
            if (!src) {
                audio.pause();
                audio.src = '';
                return;
            }
            if (!src.startsWith('http') && !src.startsWith('/')) src = '/' + src;
            audio.loop = config.backgroundMusicLoop !== false;
            const targetUrl = src.startsWith('http') ? src : location.origin + src;
            if (audio.src !== targetUrl) audio.src = src;
            if (playing) audio.play().catch(() => {});
            else audio.pause();
        }

        socket.on('prezentacja_state', (data) => {
            config = data.config;
            currentIndex = data.index || 0;
            playing = data.playing || false;
            loop = data.loop !== false;
            if (data.liveOverlay) {
                liveOverlayState = { type: data.liveOverlay.type || 'none', countdownMinutes: data.liveOverlay.countdownMinutes || 3, text: data.liveOverlay.text || '', textPosition: data.liveOverlay.textPosition || 'center' };
            }
            renderAll();
            syncVideoPlayback();
            updateBackgroundMusic();
            if (playing) { startAutoAdvance(); startCountdownIfNeeded(); } else stopAutoAdvance();
        });

        socket.on('prezentacja_loaded', (data) => {
            config = data.config;
            currentIndex = 0;
            playing = false;
            countdownReachedZeroIndex = -1;
            renderAll();
            syncVideoPlayback();
            updateBackgroundMusic();
            stopAutoAdvance();
        });

        socket.on('prezentacja_slide', (data) => {
            currentIndex = data.index ?? currentIndex;
            playing = data.playing ?? playing;
            goToSlide(currentIndex);
            updateBackgroundMusic();
            if (playing) { startAutoAdvance(); startCountdownIfNeeded(); } else { stopAutoAdvance(); stopCountdownIfNeeded(); }
            applyLiveOverlay();
        });

        socket.on('prezentacja_playing', (data) => {
            playing = data.playing || false;
            syncVideoPlayback();
            updateBackgroundMusic();
            if (playing) { startAutoAdvance(); startCountdownIfNeeded(); } else { stopAutoAdvance(); stopCountdownIfNeeded(); }
            applyLiveOverlay();
        });

        socket.on('prezentacja_loop', (data) => {
            loop = data.loop !== false;
        });

        socket.on('prezentacja_overlay', (data) => {
            if (data) {
                liveOverlayState = { type: data.type || 'none', countdownMinutes: data.countdownMinutes || 3, text: data.text || '', textPosition: data.textPosition || 'center' };
                applyLiveOverlay();
            }
        });

        function handleWinampMode(delta) {
            const d = delta === 1 || delta === -1 ? delta : 0;
            if (!d) return;
            const slide = config && config.slides && config.slides[currentIndex];
            const preset = String(slide && slide.preset || '').toLowerCase();
            const isWebvs = slide && slide.type === 'visualization' && preset === 'webvs';
            const isMilkdrop = slide && slide.type === 'visualization' && preset === 'milkdrop';
            if (isWebvs && vizWebvsChangePreset) vizWebvsChangePreset(d);
            else if (isMilkdrop && vizMilkdropChangePreset) vizMilkdropChangePreset(d);
            else vizWinampModeDelta = d;
        }
        socket.on('prezentacja_winamp_mode', (data) => handleWinampMode(data && data.delta));
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'prezentacja_winamp_mode') handleWinampMode(e.data.delta);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
                const slide = config && config.slides && config.slides[currentIndex];
                const preset = String(slide && slide.preset || '').toLowerCase();
                const isWinamp = slide && slide.type === 'visualization' && (preset === 'winamp' || preset === 'tunnel');
                const isWebvs = slide && slide.type === 'visualization' && preset === 'webvs';
                const isMilkdrop = slide && slide.type === 'visualization' && preset === 'milkdrop';
                const delta = e.key === 'ArrowRight' ? 1 : -1;
                if (isWinamp) {
                    vizWinampModeDelta = delta;
                    e.preventDefault();
                } else if (isWebvs && vizWebvsChangePreset) {
                    vizWebvsChangePreset(delta);
                    e.preventDefault();
                } else if (isMilkdrop && vizMilkdropChangePreset) {
                    vizMilkdropChangePreset(delta);
                    e.preventDefault();
                }
            }
        });

        socket.on('connect', () => {
            socket.emit('prezentacja_join');
            socket.emit('master_volume_request');
        });

        socket.on('master_volume', (d) => {
            const v = parseFloat(d && d.volume);
            if (!isNaN(v) && v >= 0 && v <= 1) {
                masterVolume = v;
                applyVideoVolumes();
            }
        });
        socket.on('prezentacja_volume', (d) => {
            const v = parseFloat(d && d.volume);
            if (!isNaN(v) && v >= 0 && v <= 1) {
                prezentacjaChannelVolume = v;
                applyVideoVolumes();
            }
        });

        renderAll();
        } catch (e) {
            document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d0d14;color:#f1c40f;padding:40px;text-align:center;font-family:system-ui;"><h2 style="margin-bottom:16px;">Błąd ładowania prezentacji</h2><p style="margin-bottom:12px;color:rgba(255,255,255,0.8);">' + (e.message || e) + '</p><p style="font-size:0.9rem;color:rgba(255,255,255,0.5);">Sprawdź połączenie z internetem (CDN) lub konsolę przeglądarki (F12).</p></div>';
            console.error('Prezentacja błąd:', e);
        }
        })();
    </script>
</body>
</html>
