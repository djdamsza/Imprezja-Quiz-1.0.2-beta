<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NJR Sampler – Panel</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .tile, .tile * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .tile .emoji.img { pointer-events: none; draggable: false; }
        html {
            width: 100%;
            height: 100%;
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
        }
        html.fullscreen, html:fullscreen, html:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d14;
            min-height: 100vh;
            min-height: 100dvh;
            color: #fff;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        html.fullscreen body, html:fullscreen body, html:-webkit-full-screen body {
            min-height: 100%;
            height: 100%;
        }
        .bank-switcher {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            flex-shrink: 0;
            touch-action: pan-y;
        }
        .bank-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
        }
        .tiles-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 10px;
            padding: 12px 16px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            max-width: 100%;
            width: 100%;
        }
        .tile.tile-last-odd {
            grid-column: 1 / -1;
            width: 46.75%;
            max-width: 46.75%;
            margin: 0 auto;
            justify-self: center;
        }
        .tile {
            aspect-ratio: 1;
            width: 93.5%;
            min-width: 0;
            max-width: 93.5%;
            justify-self: center;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            border: 3px solid rgba(255,255,255,0.2);
            min-height: 0;
        }
        .tile:active { transform: scale(0.96); }
        .tile.playing { box-shadow: 0 0 0 4px #f1c40f, 0 0 20px rgba(241,196,15,0.5); }
        .tile { position: relative; -webkit-touch-callout: none; touch-action: pan-y; }
        .tile .tile-bg-note { position: absolute; top: 6px; right: 6px; font-size: 1.1rem; opacity: 0.95; }
        .tile .tile-play-icon { position: absolute; top: 6px; left: 6px; font-size: 1.1rem; opacity: 0.95; }
        .tile .emoji { font-size: 2.5rem; margin-bottom: 4px; }
        .tile .emoji.img { width: 48px; height: 48px; object-fit: contain; }
        .tile .label { font-size: 1.16rem; font-weight: 600; text-align: center; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; min-width: 0; color: inherit; }
        .tile.tile-light-bg .label,
        .tile.tile-light-bg .emoji,
        .tile.tile-light-bg .tile-bg-note,
        .tile.tile-light-bg .tile-play-icon { color: #000 !important; }
        .tile.tile-light-bg .emoji.img { opacity: 0; }
        .wait-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            padding: 24px;
            text-align: center;
        }
        .wait-screen p { color: rgba(255,255,255,0.7); margin-top: 12px; }
        .fullscreen-btn {
            position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); right: max(16px, env(safe-area-inset-right));
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(155, 89, 182, 0.9); border: 2px solid rgba(255,255,255,0.3);
            color: #fff; font-size: 1.3rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .fullscreen-btn:hover, .fullscreen-btn:active { background: rgba(155, 89, 182, 1); }
        /* Imprezator bank – lista piosenek */
        .tiles-container.imprezator-mode {
            display: flex !important;
            flex-direction: column;
            gap: 8px;
            padding: 12px 14px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }
        .imprezator-track {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: rgba(255,255,255,0.07);
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            touch-action: pan-y;
            transition: background 0.1s;
            min-height: 56px;
        }
        .imprezator-track:active { background: rgba(255,255,255,0.18); }
        .imprezator-track.playing {
            border-color: #f1c40f;
            background: rgba(241,196,15,0.15);
            box-shadow: 0 0 12px rgba(241,196,15,0.35);
        }
        .imprezator-track-icon { font-size: 1.3rem; flex-shrink: 0; width: 28px; text-align: center; }
        .imprezator-track-label { flex: 1; font-size: 1.22rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    </style>
</head>
<body>
    <div class="bank-switcher" id="bank-switcher" style="display:none;">
        <span class="bank-name" id="bank-name">—</span>
    </div>

    <div class="wait-screen" id="wait-screen">
        <p>Ładowanie samplera...</p>
    </div>

    <div class="tiles-container" id="tiles" style="display: none;"></div>

    <button type="button" class="fullscreen-btn" id="fullscreen-btn" title="Pełny ekran">⛶</button>

    <script>
        const socket = io();
        let config = { banks: [] };
        let currentBankIndex = 0;
        let active = false;
        let playingTileId = null;
        let playingImprezatorTrackId = null;
        /** Rozróżnienie tap vs scroll (nie odtwarzaj przy przewijaniu listy). */
        const TILE_TAP_MAX_MOVE_PX = 22;
        let tileTouchPan = null;
        let tileIgnoreClicksUntil = 0;
        let _iframeLayoutRoTimer = null;

        function scheduleRenderAfterLayout() {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => { render(); });
            });
        }

        function attachSamplerIframeLayoutFix() {
            if (typeof ResizeObserver === 'undefined') return;
            const ro = new ResizeObserver(() => {
                if (!active) return;
                const tiles = document.getElementById('tiles');
                if (!tiles || tiles.style.display === 'none') return;
                const r = tiles.getBoundingClientRect();
                if (r.width < 8 || r.height < 8) return;
                clearTimeout(_iframeLayoutRoTimer);
                _iframeLayoutRoTimer = setTimeout(() => {
                    _iframeLayoutRoTimer = null;
                    render();
                }, 70);
            });
            ro.observe(document.body);
        }
        attachSamplerIframeLayoutFix();

        function ensureBanks() {
            if (!config.banks || !config.banks.length) {
                const oldTiles = config.tiles || [];
                config.banks = [{ id: 'b1', name: 'Bank 1', tiles: Array.isArray(oldTiles) ? oldTiles : [] }];
            }
        }

        function rejoin() {
            socket.emit('njr_sampler_join_phone');
        }
        /** Telefony (wolniejsze WebSocket / iframe PWA) czasem dostawały niepełny stan z socketu — pełna konfiguracja jak po ręcznym odświeżeniu z GET. */
        function fetchStateViaREST() {
            const url = '/api/njr-sampler/config?_=' + Date.now();
            fetch(url, { cache: 'no-store' }).then(r => r.json()).then(d => {
                if (d && (d.config || d.active !== undefined)) {
                    active = !!d.active;
                    if (d.config) config = d.config;
                    ensureBanks();
                    const _si = currentSamplerBankIndices();
                    if (_si.length) {
                        if (_si.indexOf(currentBankIndex) < 0) currentBankIndex = _si[0];
                    } else {
                        currentBankIndex = Math.min(currentBankIndex, (config.banks || []).length - 1);
                        if (currentBankIndex < 0) currentBankIndex = 0;
                    }
                    render();
                    scheduleRenderAfterLayout();
                }
            }).catch(() => {});
        }
        let _samplerRestAfterActiveOnce = false;
        let _bankNavDedupe = { t: 0, d: 0 };
        let _setBankDedupe = { t: 0, idx: -1 };

        function applySamplerBankDelta(delta) {
            if (delta !== 1 && delta !== -1) return;
            const now = Date.now();
            if (now - _bankNavDedupe.t < 100 && _bankNavDedupe.d === delta) return;
            _bankNavDedupe = { t: now, d: delta };
            goToBank(delta);
        }

        function samplerTabIndexToPhysicalBankIndex(tabIdx) {
            const list = currentSamplerBankIndices();
            if (!list.length) return 0;
            const t = Math.max(0, Math.min(list.length - 1, Math.floor(Number(tabIdx)) || 0));
            return list[t];
        }

        function applySamplerSetBank(tabIndex) {
            if (typeof tabIndex !== 'number' || !Number.isFinite(tabIndex)) return;
            const now = Date.now();
            if (now - _setBankDedupe.t < 100 && _setBankDedupe.idx === tabIndex) return;
            _setBankDedupe = { t: now, idx: tabIndex };
            ensureBanks();
            const list = currentSamplerBankIndices();
            /** NIE klampujemy — jeśli lokalny config ma mniej banków (wyścig z bootstrapem), wychodzimy bez zmiany; właściwe dane przyjdą bootstrapem admin-pwa. */
            const t = Math.floor(Number(tabIndex));
            if (t < 0 || t >= list.length) return;
            currentBankIndex = list[t];
            render();
        }

        socket.on('connect', () => {
            _samplerRestAfterActiveOnce = false;
            rejoin();
            fetchStateViaREST();
        });
        let autoStartDone = false;
        let stateSeq = 0;
        let _lastPostedSamplerTabIdx = -999;
        socket.on('njr_sampler_state', (s) => {
            stateSeq++;
            _lastPostedSamplerTabIdx = -999;
            active = s.active;
            if (!s.active) _samplerRestAfterActiveOnce = false;
            if (s.config) config = s.config;
            ensureBanks();
            const _samplerIdx = currentSamplerBankIndices();
            if (_samplerIdx.length) {
                if (_samplerIdx.indexOf(currentBankIndex) < 0) currentBankIndex = _samplerIdx[0];
            } else {
                currentBankIndex = Math.min(currentBankIndex, (config.banks || []).length - 1);
                if (currentBankIndex < 0) currentBankIndex = 0;
            }
            if (!s.active && !autoStartDone) {
                autoStartDone = true;
                fetch('/api/njr-sampler/start', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
            }
            render();
            scheduleRenderAfterLayout();
            if (s.active && !_samplerRestAfterActiveOnce) {
                _samplerRestAfterActiveOnce = true;
                setTimeout(() => { fetchStateViaREST(); }, 500);
            }
        });
        let playingBankIndex = null;
        socket.on('njr_sampler_playing', (payload) => {
            const p = typeof payload === 'object' ? payload : { tileId: payload };
            playingTileId = p.tileId;
            playingBankIndex = p.bankIndex != null ? p.bankIndex : null;
            render();
        });
        socket.on('njr_sampler_stopped', () => { playingTileId = null; render(); });
        socket.on('njr_sampler_imprezator_playing', (trackId) => {
            playingImprezatorTrackId = trackId || null;
            render();
        });

        function currentSamplerBankIndices() {
            ensureBanks();
            const banks = config.banks || [];
            return banks.map((_, i) => i).filter(i => {
                const b = banks[i];
                return b && b.id !== '__imprezator__' && b.type !== 'imprezator';
            });
        }

        function currentSamplerTabIndexForParent() {
            const idxList = currentSamplerBankIndices();
            if (!idxList.length) return 0;
            const pos = idxList.indexOf(currentBankIndex);
            return pos >= 0 ? pos : 0;
        }

        function notifyParentSamplerTabIndex() {
            try {
                if (!active || !window.parent || window.parent === window) return;
                const pos = currentSamplerTabIndexForParent();
                if (pos === _lastPostedSamplerTabIdx) return;
                _lastPostedSamplerTabIdx = pos;
                window.parent.postMessage({ type: 'imprezja_sampler_bank_tab', index: pos }, window.location.origin);
            } catch (_) {}
        }

        function renderBankSwitcher(bankName) {
            const switcher = document.getElementById('bank-switcher');
            const bankNameEl = document.getElementById('bank-name');
            if (!switcher) return;
            bankNameEl.textContent = bankName;
            switcher.style.display = 'flex';
        }

        function render() {
            try {
            const wait = document.getElementById('wait-screen');
            const tiles = document.getElementById('tiles');
            const hasBanks = config.banks && config.banks.length > 0;
            const bank = hasBanks ? config.banks[currentBankIndex] : null;

            // bank Imprezatora – lista piosenek
            if (active && bank && bank.type === 'imprezator') {
                const trackList = bank.tracks || [];
                if (trackList.length === 0) {
                    wait.style.display = 'flex';
                    tiles.style.display = 'none';
                    wait.querySelector('p').textContent = 'Brak utworów w Imprezatorze. Dodaj piosenki w panelu Imprezatora.';
                    renderBankSwitcher(bank.name || '🎵 Imprezator');
                    document.getElementById('bank-switcher').style.display = 'flex';
                    return;
                }
                wait.style.display = 'none';
                tiles.className = 'tiles-container imprezator-mode';
                tiles.style.display = '';
                renderBankSwitcher(bank.name || '🎵 Imprezator');
                tiles.innerHTML = trackList.map(t => {
                    const raw = t.displayName || (t.audio || '').replace(/^.*[/\\]/, '').replace(/\.[^.]+$/, '') || 'Utwór';
                    const label = raw.replace(/</g, '&lt;');
                    const isPlaying = playingImprezatorTrackId === t.id;
                    const icon = isPlaying ? '⏸' : '▶';
                    return `<div class="imprezator-track${isPlaying ? ' playing' : ''}" data-imprezator-id="${(t.id || '').replace(/"/g, '&quot;')}" role="button" tabindex="0">
                        <span class="imprezator-track-icon">${icon}</span>
                        <span class="imprezator-track-label">${label}</span>
                    </div>`;
                }).join('');
                return;
            }

            // normalny bank – kafelki
            const trackList = bank ? (bank.tiles || []) : [];
            if (!active || !hasBanks || trackList.length === 0) {
                wait.style.display = 'flex';
                tiles.style.display = 'none';
                document.getElementById('bank-switcher').style.display = 'none';
                wait.querySelector('p').textContent = active ? 'Brak kafelków.' : 'Sampler nie jest włączony. Włącz na komputerze.';
                return;
            }
            wait.style.display = 'none';
            tiles.className = 'tiles-container';
            tiles.style.display = 'grid';
            renderBankSwitcher(bank.name || 'Bank ' + (currentBankIndex + 1));
            const cnt = trackList.length;
            const lastOdd = cnt % 2 === 1;
            const isLightBg = (c) => {
                if (!c) return false;
                const s = String(c).toLowerCase().replace(/\s/g, '');
                if (s === '#fff' || s === '#ffffff' || s === 'white') return true;
                if (/^#[0-9a-f]{6}$/.test(s)) {
                    const r = parseInt(s.slice(1,3), 16), g = parseInt(s.slice(3,5), 16), b = parseInt(s.slice(5,7), 16);
                    return (r + g + b) / 3 > 240;
                }
                return false;
            };
            tiles.innerHTML = trackList.map((t, i) => {
                const isPlaying = playingTileId === t.id && playingBankIndex === currentBankIndex;
                const icon = isPlaying ? '⏸' : '▶';
                const emoji = t.image && (t.image.startsWith('/') || t.image.startsWith('http')) ? '' : (t.image || '');
                const img = t.image && (t.image.startsWith('/') || t.image.startsWith('http')) ? t.image : '';
                const spanClass = lastOdd && i === cnt - 1 ? ' tile-last-odd' : '';
                const lightClass = isLightBg(t.color) ? ' tile-light-bg' : '';
                return `
                    <div class="tile${spanClass}${lightClass} ${isPlaying ? 'playing' : ''}" data-id="${t.id}" data-bank="${currentBankIndex}" style="background:${t.color || '#0000ff'}" role="button" tabindex="0">
                        <span class="tile-play-icon">${icon}</span>
                        ${img ? `<img class="emoji img" src="${img}" alt="" draggable="false" loading="lazy">` : (emoji ? `<span class="emoji">${emoji}</span>` : '')}
                        <span class="label">${(t.label || '').replace(/</g,'&lt;') || '—'}</span>
                    </div>
                `;
            }).join('');
            } finally {
                if (active && window.parent && window.parent !== window) notifyParentSamplerTabIndex();
            }
        }

        function goToBank(delta) {
            const idxList = currentSamplerBankIndices();
            const n = idxList.length;
            if (n <= 1) return;
            let pos = idxList.indexOf(currentBankIndex);
            if (pos < 0) pos = 0;
            pos = (pos + delta + n) % n;
            currentBankIndex = idxList[pos];
            render();
        }

        function emitBankDelta(delta) {
            if (delta !== 1 && delta !== -1) return;
            if (currentSamplerBankIndices().length <= 1) return;
            socket.emit('njr_sampler_bank_delta', delta);
        }

        let bankSwipeStartX = 0;
        let bankSwipeStartY = 0;
        function setupBankSwipe(el) {
            if (!el || el._bankSwipeSetup) return;
            el._bankSwipeSetup = true;
            el.addEventListener('touchstart', (e) => {
                if (!e.touches?.[0]) return;
                bankSwipeStartX = e.touches[0].clientX;
                bankSwipeStartY = e.touches[0].clientY;
            }, { passive: true });
            el.addEventListener('touchend', (e) => {
                if (!e.changedTouches?.[0]) return;
                const dx = e.changedTouches[0].clientX - bankSwipeStartX;
                const dy = e.changedTouches[0].clientY - bankSwipeStartY;
                if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
                    emitBankDelta(dx > 0 ? -1 : 1);
                }
            }, { passive: true });
        }
        setupBankSwipe(document.getElementById('bank-switcher'));

        function handleTileTap(e) {
            e.stopPropagation();
            if (!active) return;
            const tile = e.target.closest('.tile[data-id]');
            const imprezator = e.target.closest('.imprezator-track[data-imprezator-id]');
            if (tile) {
                const id = tile.dataset.id;
                const bank = parseInt(tile.dataset.bank, 10);
                if (id != null) socket.emit('njr_sampler_toggle', { bankIndex: isNaN(bank) ? 0 : bank, tileId: id });
            } else if (imprezator) {
                const id = imprezator.dataset.imprezatorId;
                if (id) socket.emit('njr_sampler_imprezator_toggle', id);
            }
        }
        const tilesEl = document.getElementById('tiles');
        tilesEl.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) { tileTouchPan = null; return; }
            const t = e.touches[0];
            tileTouchPan = { x0: t.clientX, y0: t.clientY, moved: false };
        }, { passive: true });
        tilesEl.addEventListener('touchmove', (e) => {
            if (!tileTouchPan || e.touches.length !== 1) return;
            const t = e.touches[0];
            const dx = t.clientX - tileTouchPan.x0;
            const dy = t.clientY - tileTouchPan.y0;
            if (Math.hypot(dx, dy) > TILE_TAP_MAX_MOVE_PX) tileTouchPan.moved = true;
        }, { passive: true });
        tilesEl.addEventListener('touchcancel', () => { tileTouchPan = null; }, { passive: true });
        tilesEl.addEventListener('touchend', (e) => {
            if (!tileTouchPan || e.changedTouches.length !== 1) {
                tileTouchPan = null;
                return;
            }
            const t = e.changedTouches[0];
            const dx = t.clientX - tileTouchPan.x0;
            const dy = t.clientY - tileTouchPan.y0;
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) && currentSamplerBankIndices().length > 1) {
                tileTouchPan = null;
                tileIgnoreClicksUntil = Date.now() + 450;
                emitBankDelta(dx > 0 ? -1 : 1);
                return;
            }
            const moved = tileTouchPan.moved || Math.hypot(dx, dy) > TILE_TAP_MAX_MOVE_PX;
            tileTouchPan = null;
            if (moved) {
                tileIgnoreClicksUntil = Date.now() + 450;
                return;
            }
            e.preventDefault();
            handleTileTap(e);
        }, { passive: false });
        tilesEl.addEventListener('click', (e) => {
            if (Date.now() < tileIgnoreClicksUntil) {
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            handleTileTap(e);
        });
        document.getElementById('tiles').addEventListener('contextmenu', (e) => {
            if (e.target.closest('.tile') || e.target.closest('.imprezator-track')) e.preventDefault();
        });

        /**
         * Bootstrap z admin-pwa (rodzic iframe): config już zbudowany dla kształtu telefonu, z aktualnym stanem.
         * Przyjmujemy go jako źródło prawdy — eliminuje wyścig z socket.io przy pierwszym otwarciu (problem „F5 naprawia”).
         */
        function applySamplerBootstrap(payload) {
            if (!payload || !payload.config) return;
            const prevIdx = currentBankIndex;
            active = !!payload.active;
            config = payload.config;
            ensureBanks();
            const _si = currentSamplerBankIndices();
            /** Admin może przysłać 'targetTabIndex' — wtedy od razu ustawiamy żądany bank (pełne dane są w payload.config, więc render na pewno zobaczy nowe kafelki). */
            if (_si.length && payload && typeof payload.targetTabIndex === 'number' && Number.isFinite(payload.targetTabIndex)) {
                const tt = Math.floor(payload.targetTabIndex);
                if (tt >= 0 && tt < _si.length) currentBankIndex = _si[tt];
                else currentBankIndex = _si[0];
            } else if (_si.length) {
                if (_si.indexOf(prevIdx) >= 0) currentBankIndex = prevIdx;
                else currentBankIndex = _si[0];
            } else {
                currentBankIndex = 0;
            }
            _samplerRestAfterActiveOnce = true;
            _lastPostedSamplerTabIdx = -999;
            render();
            scheduleRenderAfterLayout();
        }

        window.addEventListener('message', (e) => {
            if (e.origin !== window.location.origin) return;
            if (!e.data || typeof e.data.type !== 'string') return;
            if (e.data.type === 'imprezja_sampler_bootstrap') {
                applySamplerBootstrap(e.data);
                return;
            }
            if (e.data.type === 'njr_sampler_set_bank' && typeof e.data.index === 'number' && Number.isFinite(e.data.index)) {
                applySamplerSetBank(e.data.index);
            } else if (e.data.type === 'njr_sampler_bank_delta' && (e.data.delta === 1 || e.data.delta === -1)) {
                applySamplerBankDelta(e.data.delta);
            }
        });
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: 'imprezja_sampler_iframe_ready' }, window.location.origin);
            }
        } catch (_) {}
        socket.on('njr_sampler_set_bank', (data) => {
            if (!data || typeof data.index !== 'number' || !Number.isFinite(data.index)) return;
            applySamplerSetBank(data.index);
        });
        socket.on('njr_sampler_bank_delta', (data) => {
            const d = data && (data.delta === 1 || data.delta === -1) ? data.delta : 0;
            if (d) applySamplerBankDelta(d);
        });
        function toggleTile(id) {
            if (!active) return;
            socket.emit('njr_sampler_toggle', { bankIndex: currentBankIndex, tileId: id });
        }

        function toggleImprezatorTrack(id) {
            if (!active) return;
            socket.emit('njr_sampler_imprezator_toggle', id);
        }

        function lockOrientationPortrait() {
            if (screen.orientation && typeof screen.orientation.lock === 'function') {
                screen.orientation.lock('portrait').catch(() => {});
            }
        }
        function unlockOrientation() {
            if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                screen.orientation.unlock();
            }
        }
        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const enterFs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                const p = enterFs?.call(el);
                if (p && typeof p.then === 'function') p.then(lockOrientationPortrait).catch(() => {});
            } else {
                unlockOrientation();
                (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen)?.call(document);
            }
        }
        document.addEventListener('fullscreenchange', () => {
            const isFs = !!document.fullscreenElement;
            document.documentElement.classList.toggle('fullscreen', isFs);
            if (isFs) lockOrientationPortrait();
            else unlockOrientation();
        });
        document.addEventListener('webkitfullscreenchange', () => {
            const isFs = !!document.webkitFullscreenElement;
            document.documentElement.classList.toggle('fullscreen', isFs);
            if (isFs) lockOrientationPortrait();
            else unlockOrientation();
        });
        document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

        if ('wakeLock' in navigator) {
            let lock = null;
            async function requestWakeLock() {
                try {
                    lock = await navigator.wakeLock.request('screen');
                } catch (e) {}
            }
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                    if (socket.connected) {
                        rejoin();
                        fetchStateViaREST();
                    } else fetchStateViaREST();
                }
            });
            requestWakeLock();
        }
        setInterval(() => {
            if (document.visibilityState === 'visible' && !socket.connected) fetchStateViaREST();
        }, 5000);

        window.addEventListener('load', () => {
            fetchStateViaREST();
            scheduleRenderAfterLayout();
        });
        window.addEventListener('pageshow', () => {
            fetchStateViaREST();
            scheduleRenderAfterLayout();
        });
    </script>
</body>
</html>
