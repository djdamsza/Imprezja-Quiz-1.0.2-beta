<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bitwa wokalna – Panel</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .track-item, .track-item * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .track-item { touch-action: manipulation; }
        html { width: 100%; height: 100%; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
        html.fullscreen, html:fullscreen, html:-webkit-full-screen { width: 100vw; height: 100vh; height: 100dvh; overflow: auto; -webkit-overflow-scrolling: touch; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d14;
            min-height: 100vh;
            min-height: 100dvh;
            color: #fff;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        .bank-name {
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
            color: rgba(255,255,255,0.9);
            padding: 8px 16px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .tracks-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            padding: 16px;
        }
        .track-item {
            padding: 20px 16px;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.15);
            cursor: pointer;
            transition: transform 0.1s;
            font-size: 1.12rem;
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .track-item .track-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            transition: background 0.15s linear;
        }
        .track-item .track-label { position: relative; z-index: 1; }
        .track-item .track-icon { font-size: 1.1rem; margin-right: 6px; opacity: 0.9; }
        .track-item:active { transform: scale(0.98); }
        .track-item.playing { border-color: #9b59b6; box-shadow: 0 0 0 2px rgba(155,89,182,0.5); }
        .wait-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            padding: 24px;
            text-align: center;
        }
        .wait-screen p { color: rgba(255,255,255,0.7); margin-top: 12px; }
        .fullscreen-btn {
            position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); right: max(16px, env(safe-area-inset-right));
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(155, 89, 182, 0.9); border: 2px solid rgba(255,255,255,0.3);
            color: #fff; font-size: 1.3rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .fullscreen-btn:hover, .fullscreen-btn:active { background: rgba(155, 89, 182, 1); }
    </style>
</head>
<body>
    <div class="bank-name" id="bank-name" style="display:none;">—</div>

    <div class="wait-screen" id="wait-screen">
        <p>Ładowanie...</p>
    </div>

    <div class="tracks-scroll" id="tracks" style="display: none;"></div>

    <button type="button" class="fullscreen-btn" id="fullscreen-btn" title="Pełny ekran">⛶</button>

    <script>
        const socket = io();
        let config = { banks: [] };
        let active = false;
        let currentBankIndex = 0;
        let touchStartX = 0;
        let touchStartY = 0;

        function ensureBanks() {
            if (!config.banks || !config.banks.length) {
                const oldTracks = config.tracks || [];
                config.banks = [{ id: 'b1', name: 'Bank 1', tracks: Array.isArray(oldTracks) ? oldTracks : [] }];
            }
        }
        function applyBankIndex(index, notify) {
            ensureBanks();
            currentBankIndex = Math.max(0, Math.min(config.banks.length - 1, Math.floor(Number(index)) || 0));
            render();
            if (notify !== false) notifyAdminBankTab();
        }
        function getCurrentTracks() {
            ensureBanks();
            const b = config.banks[currentBankIndex];
            return b ? (b.tracks || []) : [];
        }
        let usedIds = new Set();
        let playingTrackId = null;
        let trackProgress = {}; // trackId -> 0..1
        socket.emit('bitwa_wokalna_join_phone');
        function notifyAdminBankTab() {
            try {
                if (window.parent !== window) {
                    window.parent.postMessage({ type: 'bitwa_wokalna_bank_tab', index: currentBankIndex }, window.location.origin);
                }
            } catch (_) {}
        }
        window.addEventListener('message', (ev) => {
            if (ev.origin !== window.location.origin) return;
            const d = ev.data;
            if (!d || !d.type) return;
            if (d.type === 'bitwa_wokalna_bootstrap') {
                if (d.config) config = d.config;
                if (typeof d.active === 'boolean') active = d.active;
                ensureBanks();
                if (typeof d.targetBankIndex === 'number' && Number.isFinite(d.targetBankIndex)) {
                    applyBankIndex(d.targetBankIndex, true);
                } else {
                    render();
                }
                return;
            }
            if (d.type === 'bitwa_wokalna_set_bank') {
                if (typeof d.index !== 'number' || !Number.isFinite(d.index)) return;
                applyBankIndex(d.index, true);
                return;
            }
        });
        socket.on('bitwa_wokalna_set_bank', (payload) => {
            if (typeof payload?.index !== 'number' || !Number.isFinite(payload.index)) return;
            applyBankIndex(payload.index, true);
        });
        let autoStartDone = false;
        socket.on('bitwa_wokalna_state', (s) => {
            active = s.active;
            if (s.config) config = s.config;
            if (s.usedIds) usedIds = new Set(Array.from(s.usedIds).map(String));
            ensureBanks();
            if (typeof s.activeBankIndex === 'number' && Number.isFinite(s.activeBankIndex)) {
                applyBankIndex(s.activeBankIndex, false);
            } else {
                currentBankIndex = Math.min(currentBankIndex, config.banks.length - 1);
                if (currentBankIndex < 0) currentBankIndex = 0;
            }
            if (!s.active && !autoStartDone) {
                autoStartDone = true;
                fetch('/api/bitwa-wokalna/start', { method: 'POST' }).catch(() => {});
            }
            render();
        });
        socket.on('bitwa_wokalna_used', (payload) => {
            if (payload && payload.trackId != null) usedIds.add(String(payload.trackId));
            render();
        });
        socket.on('bitwa_wokalna_progress', (payload) => {
            if (payload && payload.trackId != null) {
                trackProgress[payload.trackId] = Math.max(0, Math.min(1, payload.progress ?? 0));
                updateProgressBar(payload.trackId);
            }
        });
        socket.on('bitwa_wokalna_ended', (payload) => {
            if (payload && payload.trackId != null) {
                playingTrackId = null;
                trackProgress[String(payload.trackId)] = 0;
                render();
            }
        });

        function updateProgressBar(trackId) {
            const el = document.querySelector(`.track-item[data-id="${trackId}"] .track-bg`);
            if (!el) return;
            const p = (trackProgress[trackId] ?? 0) * 100;
            const t = getCurrentTracks().find(x => x.id === trackId);
            const color = (t && t.color) || '#3498db';
            el.style.background = `linear-gradient(to right, #555 0%, #555 ${p}%, ${color} ${p}%, ${color} 100%)`;
        }

        function render() {
            const wait = document.getElementById('wait-screen');
            const tracks = document.getElementById('tracks');
            const bankNameEl = document.getElementById('bank-name');
            const trackList = getCurrentTracks();
            const hasBanks = config.banks && config.banks.length > 0;
            if (!active || !hasBanks) {
                wait.style.display = 'flex';
                tracks.style.display = 'none';
                if (bankNameEl) bankNameEl.style.display = 'none';
                wait.querySelector('p').textContent = active ? 'Brak banków.' : 'Bitwa wokalna nie jest włączone. Włącz na komputerze.';
                return;
            }
            wait.style.display = 'none';
            tracks.style.display = 'block';
            const bank = config.banks[currentBankIndex];
            if (bankNameEl) {
                bankNameEl.textContent = bank ? (bank.name || 'Bank ' + (currentBankIndex + 1)) : '—';
                bankNameEl.style.display = 'block';
            }
            const emptyMsg = trackList.length === 0 ? '<p style="text-align:center;color:rgba(255,255,255,0.6);font-size:1rem;padding:24px;">Brak utworów w tym banku</p>' : '';
            tracks.innerHTML = emptyMsg + trackList.map((t) => {
                const label = (t.displayName || t.audio?.replace(/^.*\//, '').replace(/\.[^.]+$/, '') || 'Utwór').replace(/</g, '&lt;');
                const isUsed = usedIds.has(String(t.id));
                const isPlaying = playingTrackId != null && String(t.id) === playingTrackId;
                const color = t.color || '#3498db';
                const p = (isPlaying ? (trackProgress[t.id] ?? 0) : 0) * 100;
                let bgStyle;
                if (isPlaying) {
                    bgStyle = `linear-gradient(to right, #555 0%, #555 ${p}%, ${color} ${p}%, ${color} 100%)`;
                } else if (isUsed) {
                    bgStyle = '#555';
                } else {
                    bgStyle = color;
                }
                const icon = isPlaying ? '⏸' : '▶';
                return `
                    <div class="track-item ${isUsed ? 'used' : ''} ${isPlaying ? 'playing' : ''}" data-id="${t.id}">
                        <div class="track-bg" style="background:${bgStyle}"></div>
                        <span class="track-label"><span class="track-icon">${icon}</span> ${label}</span>
                    </div>
                `;
            }).join('');
        }

        function goToBank(delta) {
            ensureBanks();
            if (config.banks.length <= 1) return;
            socket.emit('bitwa_wokalna_bank_delta', { delta });
        }

        let didSwipe = false;
        document.getElementById('tracks').addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
            didSwipe = false;
        }, { passive: true });
        document.getElementById('tracks').addEventListener('touchend', (e) => {
            if (!e.changedTouches || !e.changedTouches[0]) return;
            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
                didSwipe = true;
                goToBank(dx > 0 ? -1 : 1);
            }
        }, { passive: true });
        document.getElementById('tracks').addEventListener('click', (e) => {
            if (didSwipe) return;
            e.preventDefault();
            e.stopPropagation();
            const item = e.target.closest('.track-item[data-id]');
            if (item && item.dataset.id) handleTrackClick(item.dataset.id);
        });
        document.getElementById('tracks').addEventListener('contextmenu', (e) => {
            if (e.target.closest('.track-item')) e.preventDefault();
        });

        function handleTrackClick(id) {
            if (!active) return;
            const sid = id != null ? String(id) : '';
            if (!sid) return;
            if (playingTrackId === sid) {
                socket.emit('bitwa_wokalna_stop', sid);
                playingTrackId = null;
                trackProgress[sid] = 0;
                render();
            } else {
                playingTrackId = sid;
                trackProgress[sid] = 0;
                render();
                socket.emit('bitwa_wokalna_play', sid);
            }
        }

        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const enterFs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                enterFs?.call(el)?.catch(() => {});
            } else {
                (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen)?.call(document);
            }
        }
        document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

        if ('wakeLock' in navigator) {
            let lock = null;
            async function requestWakeLock() {
                try { lock = await navigator.wakeLock.request('screen'); } catch (e) {}
            }
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') requestWakeLock();
            });
            requestWakeLock();
        }
    </script>
</body>
</html>
