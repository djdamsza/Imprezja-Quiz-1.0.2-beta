<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hot or Not Champion – Głosowanie</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#0a0a18; color:#fff; font-family:Arial,sans-serif; height:100dvh; display:flex; flex-direction:column; overflow:hidden; }

/* ── HEADER ── */
#header { padding:10px 14px 6px; display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
#qtext { font-size:15px; color:#ffd700; font-weight:900; letter-spacing:1px; text-align:center; }
#round-label { font-size:42px; font-weight:900; text-align:center; color:#fff; letter-spacing:2px; line-height:1; }
#match-info { font-size:11px; color:#666; text-align:center; letter-spacing:1px; }

/* ── VOTING AREA ── */
#vote-area { flex:1; display:flex; flex-direction:column; gap:6px; padding:0 6px 6px; min-height:0; }

.vote-btn {
  flex:1; display:flex; flex-direction:row; align-items:center;
  border:3px solid transparent; border-radius:14px; overflow:hidden;
  background:#12121f; transition:border-color .2s, background .2s;
  cursor:pointer; padding:0 10px 0 0; gap:10px; min-height:0;
}
.vote-btn:active { transform:scale(.98); }
.vote-btn.selected.A { border-color:#3498db; background:rgba(52,152,219,.12); }
.vote-btn.selected.B { border-color:#e74c3c; background:rgba(231,76,60,.12); }

.sid {
  font-size:52px; font-weight:900; padding:0 4px; line-height:1;
  opacity:.6; flex-shrink:0; width:50px; text-align:center;
}
.vote-btn.A .sid { color:#3498db; }
.vote-btn.B .sid { color:#e74c3c; }

.img-wrap { height:100%; width:auto; aspect-ratio:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:6px 0; flex-shrink:0; }
.img-wrap img { max-width:100%; max-height:100%; object-fit:contain; border-radius:8px; display:block; }

/* Description: always to the right of photo (row layout), big */
.vdesc {
  flex:1; font-size:6.5vw; font-weight:900; text-align:left;
  padding:4px 0; color:#fff; letter-spacing:.5px;
  overflow:hidden; line-height:1.2;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
}

/* ── VOTE BUTTON ── */
#vote-wrap { padding:8px 16px 12px; flex-shrink:0; }
#vote-btn { width:100%; padding:14px; border:none; border-radius:40px;
  font-size:20px; font-weight:900; background:#ffd700; color:#000;
  cursor:pointer; letter-spacing:2px; display:none; }
#vote-btn:active { transform:scale(.97); }

/* ── BATTLE BAR ── */
#battle-bar-wrap { padding:4px 12px 0; flex-shrink:0; display:none; }
#v-battle-bar { height:7vw; max-height:42px; border-radius:40px; overflow:hidden;
  background:linear-gradient(to right,#c0392b,#e74c3c);
  box-shadow:0 4px 16px rgba(0,0,0,.5); position:relative; }
#v-bar-fill { height:100%; width:50%; background:linear-gradient(to right,#2980b9,#3498db);
  transition:width .8s ease-out; border-right:2px solid rgba(255,255,255,.7); }
#v-score-a { position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:5vw; font-weight:900; color:#fff; }
#v-score-b { position:absolute; right:12px; top:50%; transform:translateY(-50%); font-size:5vw; font-weight:900; color:#fff; }

/* ── STATUS SCREENS ── */
#src { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px; }
#src-title { font-size:40px; font-weight:900; color:#ffd700; }
#src-sub { font-size:17px; color:#888; }

#voted-screen { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:20px; }
#voted-icon { font-size:72px; }
#voted-result { font-size:20px; font-weight:bold; color:#ffd700; }
#voted-desc { font-size:16px; color:#aaa; }

#wait-screen { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:20px; }
#wait-title { font-size:28px; font-weight:900; color:#fff; }
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <div id="qtext"></div>
  <div id="round-label">HOT OR NOT</div>
  <div id="match-info"></div>
</div>

<!-- Voting area (two photos) -->
<div id="vote-area">
  <button class="vote-btn A" id="btnA" onclick="vote('A')">
    <div class="sid">A</div>
    <div class="img-wrap"><img id="vimgA" src="" alt=""></div>
    <div class="vdesc" id="vdescA"></div>
  </button>
  <button class="vote-btn B" id="btnB" onclick="vote('B')">
    <div class="sid">B</div>
    <div class="img-wrap"><img id="vimgB" src="" alt=""></div>
    <div class="vdesc" id="vdescB"></div>
  </button>
</div>

<!-- Battle bar (result) -->
<div id="battle-bar-wrap">
  <div id="v-battle-bar">
    <div id="v-score-a">0%</div>
    <div id="v-bar-fill"></div>
    <div id="v-score-b">0%</div>
  </div>
</div>

<!-- Vote button -->
<div id="vote-wrap">
  <button id="vote-btn">ZAGŁOSUJ</button>
</div>

<!-- Status screens -->
<div id="src">
  <div id="src-title"></div>
  <div id="src-sub"></div>
</div>
<div id="voted-screen">
  <div id="voted-icon">✅</div>
  <div id="voted-result"></div>
  <div id="voted-desc"></div>
</div>
<div id="wait-screen">
  <div id="wait-title">⏳</div>
  <div style="font-size:16px; color:#888;">Oczekiwanie…</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
socket.emit('hnc_join_phone');

let chosen = null;
let voted = false;
let lastMatchKey = '';
let currentPhase = '';

function matchKey(s) { return `${s.phase}-${s.currentRound}-${s.currentMatch}`; }

socket.on('hnc_state', s => {
  const key = matchKey(s);
  if (key !== lastMatchKey) {
    chosen = null;
    voted = false;
    lastMatchKey = key;
  }
  // Re-register as voter after reset
  if (s.phase === 'setup' && currentPhase !== 'setup') {
    socket.emit('hnc_join_phone');
  }
  currentPhase = s.phase;
  renderPhone(s);
});

function renderPhone(s) {
  // Update question text
  const qt = document.getElementById('qtext');
  qt.textContent = s.questionText || '';
  qt.style.display = s.questionText ? 'block' : 'none';

  ['vote-area','vote-wrap','battle-bar-wrap','src','voted-screen','wait-screen','header']
    .forEach(id => {
      const el = document.getElementById(id);
      if (el) el.style.display = id === 'header' ? 'flex' : 'none';
    });

  if (s.phase === 'round_complete') {
    document.getElementById('src').style.display = 'flex';
    document.getElementById('src-title').textContent = `✅ KONIEC ${s.completedRoundName||'RUNDY'}`;
    document.getElementById('src-sub').textContent = s.matchName ? `Następna: ${s.matchName}` : '';
    return;
  }
  if (s.phase === 'champion') {
    const w = s.bracket?.[s.bracket.length-1]?.[0]?.winner;
    document.getElementById('src').style.display = 'flex';
    document.getElementById('src-title').textContent = '🏆 KONIEC TURNIEJU';
    document.getElementById('src-sub').textContent = w ? (w.desc || '') : '';
    return;
  }
  if (!s.match || s.phase === 'setup' || s.phase === 'ready') {
    document.getElementById('wait-screen').style.display = 'flex';
    document.getElementById('wait-title').textContent = s.phase === 'ready' ? 'Gotowy do startu…' : '⏳';
    return;
  }
  if (s.phase === 'match_result') {
    renderResult(s);
    return;
  }
  renderVote(s);
}

function renderVote(s) {
  const m = s.match;
  document.getElementById('round-label').textContent = s.matchName || 'RUNDA';
  document.getElementById('match-info').textContent = `Mecz ${s.currentMatch+1}/${s.matchesInRound}`;
  document.getElementById('vote-area').style.display = 'flex';

  document.getElementById('vimgA').src = m.photoA?.url||'';
  document.getElementById('vdescA').textContent = m.photoA?.desc||'';
  document.getElementById('vimgB').src = m.photoB?.url||'';
  document.getElementById('vdescB').textContent = m.photoB?.desc||'';

  const bA = document.getElementById('btnA');
  const bB = document.getElementById('btnB');
  bA.disabled = false;
  bB.disabled = false;
  bA.className = `vote-btn A${chosen==='A'?' selected':''}`;
  bB.className = `vote-btn B${chosen==='B'?' selected':''}`;

  const vbtn = document.getElementById('vote-btn');
  vbtn.style.display = chosen && !voted ? 'block' : 'none';
  document.getElementById('vote-wrap').style.display = 'block';
}

function renderResult(s) {
  const m = s.match;
  const total = m.votesA + m.votesB;
  const pA = total ? Math.round(m.votesA/total*100) : 50;
  const pB = 100 - pA;

  document.getElementById('round-label').textContent = s.matchName || 'RUNDA';
  document.getElementById('match-info').textContent = '';
  document.getElementById('vote-area').style.display = 'flex';

  document.getElementById('vimgA').src = m.photoA?.url||'';
  document.getElementById('vdescA').textContent = m.photoA?.desc||'';
  document.getElementById('vimgB').src = m.photoB?.url||'';
  document.getElementById('vdescB').textContent = m.photoB?.desc||'';

  // Mark winner
  document.getElementById('btnA').className = `vote-btn A${m.winner?.id===m.photoA?.id?' selected':''}`;
  document.getElementById('btnB').className = `vote-btn B${m.winner?.id===m.photoB?.id?' selected':''}`;

  // Show battle bar
  document.getElementById('battle-bar-wrap').style.display = 'block';
  document.getElementById('v-bar-fill').style.width = pA + '%';
  document.getElementById('v-score-a').textContent = pA + '%';
  document.getElementById('v-score-b').textContent = pB + '%';
}

function vote(side) {
  if (voted || currentPhase === 'match_result') return;
  chosen = side;
  document.getElementById('btnA').className = `vote-btn A${chosen==='A'?' selected':''}`;
  document.getElementById('btnB').className = `vote-btn B${chosen==='B'?' selected':''}`;
  document.getElementById('vote-btn').style.display = 'block';
  document.getElementById('vote-wrap').style.display = 'block';
}

document.getElementById('vote-btn').addEventListener('click', () => {
  if (!chosen || voted) return;
  voted = true;
  socket.emit('hnc_vote', { side: chosen });
  document.getElementById('vote-btn').style.display = 'none';
  document.getElementById('btnA').disabled = true;
  document.getElementById('btnB').disabled = true;
});
</script>
</body>
</html>
