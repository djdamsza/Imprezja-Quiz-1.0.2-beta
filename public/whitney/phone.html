<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Whitney – Panel</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .tile, .tile * { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        .tile .emoji.img { pointer-events: none; }
        .tile { touch-action: pan-y; }
        html {
            width: 100%;
            height: 100%;
            -webkit-text-size-adjust: 100%;
            overflow-x: hidden;
        }
        html.fullscreen, html:fullscreen, html:-webkit-full-screen {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d14;
            min-height: 100vh;
            min-height: 100dvh;
            color: #fff;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            padding-top: calc(52px + env(safe-area-inset-top));
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        html.fullscreen body, html:fullscreen body, html:-webkit-full-screen body {
            min-height: 100%;
            height: 100%;
        }
        .volume-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: #0d0d14;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .volume-bar input[type="range"] {
            width: 100%;
            height: 8px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            outline: none;
        }
        .volume-bar input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: #00bcd4;
            border-radius: 50%;
            cursor: pointer;
        }
        .tiles-container {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            padding: 16px;
            flex: 1;
            min-height: 0;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            max-width: 100%;
            width: 100%;
        }
        .tile.tile-last-odd {
            grid-column: 1 / -1;
            width: 50%;
            margin: 0 auto;
            justify-self: center;
        }
        .tile {
            aspect-ratio: 1;
            width: 100%;
            min-width: 0;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            border: 3px solid rgba(255,255,255,0.2);
            min-height: 0;
        }
        .tile:active { transform: scale(0.96); }
        .tile.playing { box-shadow: 0 0 0 4px #f1c40f, 0 0 20px rgba(241,196,15,0.5); }
        .tile.bg-playing { box-shadow: 0 0 0 4px #00bcd4, 0 0 20px rgba(0,188,212,0.5); }
        .tile { position: relative; }
        .tile .tile-bg-note { position: absolute; top: 6px; right: 6px; font-size: 1.1rem; opacity: 0.95; }
        .tile .tile-play-icon { position: absolute; top: 6px; left: 6px; font-size: 1.1rem; opacity: 0.95; }
        .tile .emoji { font-size: 2.5rem; margin-bottom: 4px; }
        .tile .emoji.img { width: 48px; height: 48px; object-fit: contain; }
        .tile .label { font-size: 0.77rem; font-weight: 600; text-align: center; padding: 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; min-width: 0; }
        .wait-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 60vh;
            padding: 24px;
            text-align: center;
        }
        .wait-screen p { color: rgba(255,255,255,0.7); margin-top: 12px; }
        .fullscreen-btn {
            position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); right: max(16px, env(safe-area-inset-right));
            width: 48px; height: 48px; border-radius: 50%;
            background: rgba(155, 89, 182, 0.9); border: 2px solid rgba(255,255,255,0.3);
            color: #fff; font-size: 1.3rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
        .fullscreen-btn:hover, .fullscreen-btn:active { background: rgba(155, 89, 182, 1); }
    </style>
</head>
<body>
    <div class="volume-bar">
        <input type="range" id="volume" min="0" max="100" value="100">
    </div>

    <div class="wait-screen" id="wait-screen">
        <p>Ładowanie Whitney...</p>
    </div>

    <div class="tiles-container" id="tiles" style="display: none;"></div>

    <button type="button" class="fullscreen-btn" id="fullscreen-btn" title="Pełny ekran">⛶</button>

    <script>
        const socket = io();
        let config = { tiles: [] };
        let active = false;
        let playingTileId = null;
        let playingBackgroundTileId = null;

        socket.emit('whitney_join_phone');
        let autoStartDone = false;
        socket.on('whitney_state', (s) => {
            active = s.active;
            if (s.config) config = s.config;
            if (!s.active && !autoStartDone) {
                autoStartDone = true;
                fetch('/api/whitney/start', { method: 'POST' }).catch(() => {});
            }
            render();
        });
        socket.on('whitney_volume_sync', (v) => {
            const vol = Math.max(0, Math.min(1, v));
            const slider = document.getElementById('volume');
            if (slider) slider.value = Math.round(vol * 100);
        });

        document.getElementById('volume').addEventListener('input', (e) => {
            const v = e.target.value / 100;
            socket.emit('whitney_volume', v);
        });

        socket.on('whitney_playing', (payload) => {
            const p = typeof payload === 'object' ? payload : { tileId: payload, isBackground: false };
            if (p.isBackground) {
                playingBackgroundTileId = p.tileId;
            } else {
                playingTileId = p.tileId;
            }
            render();
        });

        function render() {
            const wait = document.getElementById('wait-screen');
            const tiles = document.getElementById('tiles');
            const trackList = config.tiles || [];
            if (!active || trackList.length === 0) {
                wait.style.display = 'flex';
                tiles.style.display = 'none';
                wait.querySelector('p').textContent = active ? 'Brak kafelków.' : 'Whitney nie jest włączony. Włącz na komputerze.';
                return;
            }
            wait.style.display = 'none';
            tiles.style.display = 'grid';
            tiles.style.gridTemplateColumns = 'repeat(2, 1fr)';
            const cnt = trackList.length;
            const lastOdd = cnt % 2 === 1;
            tiles.innerHTML = trackList.map((t, i) => {
                const isPlaying = playingTileId === t.id || playingBackgroundTileId === t.id;
                const isBg = playingBackgroundTileId === t.id;
                const icon = isPlaying ? '⏸' : '▶';
                const emoji = t.image && (t.image.startsWith('/') || t.image.startsWith('http')) ? '' : (t.image || '');
                const img = t.image && (t.image.startsWith('/') || t.image.startsWith('http')) ? t.image : '';
                const spanClass = lastOdd && i === cnt - 1 ? ' tile-last-odd' : '';
                return `
                    <div class="tile${spanClass} ${isPlaying ? 'playing' : ''} ${isBg ? 'bg-playing' : ''}" data-id="${t.id}" style="background:${t.color || '#3498db'}">
                        <span class="tile-play-icon">${icon}</span>
                        ${t.isBackground ? '<span class="tile-bg-note" title="Tło muzyczne">🎵</span>' : ''}
                        ${img ? `<img class="emoji img" src="${img}" alt="" draggable="false" loading="lazy">` : (emoji ? `<span class="emoji">${emoji}</span>` : '')}
                        <span class="label">${(t.label || '').replace(/</g,'&lt;') || '—'}</span>
                    </div>
                `;
            }).join('');
        }

        function toggleTile(id) {
            if (!active) return;
            socket.emit('whitney_toggle', { tileId: id });
        }

        const TILE_TAP_MAX_MOVE_PX = 22;
        let tileTouchPan = null;
        let tileIgnoreClicksUntil = 0;

        function handleWhitneyTileTap(e) {
            e.stopPropagation();
            const tile = e.target.closest('.tile[data-id]');
            if (tile && tile.dataset.id) toggleTile(tile.dataset.id);
        }

        const tilesElWhitney = document.getElementById('tiles');
        tilesElWhitney.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) { tileTouchPan = null; return; }
            const t = e.touches[0];
            tileTouchPan = { x0: t.clientX, y0: t.clientY, moved: false };
        }, { passive: true });
        tilesElWhitney.addEventListener('touchmove', (e) => {
            if (!tileTouchPan || e.touches.length !== 1) return;
            const t = e.touches[0];
            if (Math.hypot(t.clientX - tileTouchPan.x0, t.clientY - tileTouchPan.y0) > TILE_TAP_MAX_MOVE_PX) {
                tileTouchPan.moved = true;
            }
        }, { passive: true });
        tilesElWhitney.addEventListener('touchcancel', () => { tileTouchPan = null; }, { passive: true });
        tilesElWhitney.addEventListener('touchend', (e) => {
            if (!tileTouchPan || e.changedTouches.length !== 1) {
                tileTouchPan = null;
                return;
            }
            const t = e.changedTouches[0];
            const moved = tileTouchPan.moved || Math.hypot(t.clientX - tileTouchPan.x0, t.clientY - tileTouchPan.y0) > TILE_TAP_MAX_MOVE_PX;
            tileTouchPan = null;
            if (moved) {
                tileIgnoreClicksUntil = Date.now() + 450;
                return;
            }
            e.preventDefault();
            handleWhitneyTileTap(e);
        }, { passive: false });
        tilesElWhitney.addEventListener('click', (e) => {
            if (Date.now() < tileIgnoreClicksUntil) {
                e.preventDefault();
                e.stopPropagation();
                return;
            }
            e.preventDefault();
            handleWhitneyTileTap(e);
        });
        tilesElWhitney.addEventListener('contextmenu', (e) => {
            if (e.target.closest('.tile')) e.preventDefault();
        });

        function lockOrientationPortrait() {
            if (screen.orientation && typeof screen.orientation.lock === 'function') {
                screen.orientation.lock('portrait').catch(() => {});
            }
        }
        function unlockOrientation() {
            if (screen.orientation && typeof screen.orientation.unlock === 'function') {
                screen.orientation.unlock();
            }
        }
        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const enterFs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
                const p = enterFs?.call(el);
                if (p && typeof p.then === 'function') p.then(lockOrientationPortrait).catch(() => {});
            } else {
                unlockOrientation();
                (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen)?.call(document);
            }
        }
        document.addEventListener('fullscreenchange', () => {
            const isFs = !!document.fullscreenElement;
            document.documentElement.classList.toggle('fullscreen', isFs);
            if (isFs) lockOrientationPortrait();
            else unlockOrientation();
        });
        document.addEventListener('webkitfullscreenchange', () => {
            const isFs = !!document.webkitFullscreenElement;
            document.documentElement.classList.toggle('fullscreen', isFs);
            if (isFs) lockOrientationPortrait();
            else unlockOrientation();
        });
        document.getElementById('fullscreen-btn').addEventListener('click', toggleFullscreen);

        if ('wakeLock' in navigator) {
            let lock = null;
            async function requestWakeLock() {
                try {
                    lock = await navigator.wakeLock.request('screen');
                } catch (e) {}
            }
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') requestWakeLock();
            });
            requestWakeLock();
        }
    </script>
</body>
</html>
