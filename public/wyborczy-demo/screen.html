<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dodatek Wyborczy – Ekran</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #0a0a1a;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    height: 100%;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  /* ════ IDLE ════ */
  #screen-idle {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  #screen-idle .crown { font-size: 120px; animation: float 3s ease-in-out infinite; }
  #screen-idle h1 { font-size: 56px; font-weight: 900; letter-spacing: 6px; text-transform: uppercase; color: #ffd700; }
  #screen-idle p { font-size: 26px; color: #aaa; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }

  /* ════ VOTING ════ */
  #screen-voting {
    flex: 1;
    display: none;
    flex-direction: column;
    min-height: 0;
  }
  .voting-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    background: rgba(255,215,0,.08);
    border-bottom: 2px solid rgba(255,215,0,.25);
    flex-shrink: 0;
  }
  .voting-header .title { font-size: 26px; font-weight: 800; color: #ffd700; letter-spacing: 3px; text-transform: uppercase; }
  .voting-header .progress { font-size: 30px; font-weight: 700; color: #fff; }
  .voting-header .vote-count { font-size: 24px; color: #aaa; }

  .voting-photo-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px 24px;
    min-height: 0;
    position: relative;
  }
  .voting-photo-wrap img {
    /* Fill as much space as possible while respecting both dimensions */
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    /* For very portrait images: let height drive size */
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 8px 60px rgba(0,0,0,.8);
    animation: fadeIn .4s ease;
    /* image-rendering: pixelated adds crispness for low quality */
    image-rendering: -webkit-optimize-contrast;
  }
  @keyframes fadeIn { from{opacity:0;transform:scale(.96)} to{opacity:1;transform:scale(1)} }

  .pulse-ring {
    position: absolute;
    top: 20px; right: 20px;
    width: 18px; height: 18px;
    background: #ff4444;
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
    z-index: 2;
  }
  .pulse-ring::after {
    content: '';
    position: absolute;
    inset: -7px;
    border-radius: 50%;
    border: 2px solid #ff4444;
    animation: pulse-ring 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  @keyframes pulse-ring { 0%{transform:scale(1);opacity:.8} 100%{transform:scale(2.2);opacity:0} }

  .voting-bottom {
    flex-shrink: 0;
    background: rgba(0,0,0,.55);
    border-top: 1px solid rgba(255,215,0,.15);
  }
  .voting-label {
    padding: 14px 32px;
    text-align: center;
    font-size: 36px;
    font-weight: 700;
    color: #eee;
    min-height: 0;
  }

  /* GŁOSY ODDANE overlay */
  #all-voted-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity .5s ease;
  }
  #all-voted-overlay.show {
    opacity: 1;
    pointer-events: none;
  }
  #all-voted-overlay .av-box {
    text-align: center;
    animation: popIn .4s ease;
  }
  @keyframes popIn { 0%{transform:scale(.7)} 80%{transform:scale(1.05)} 100%{transform:scale(1)} }
  #all-voted-overlay .av-icon { font-size: 100px; }
  #all-voted-overlay .av-text {
    font-size: 72px;
    font-weight: 900;
    color: #4cff9f;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 40px rgba(76,255,159,.6);
    margin-top: 16px;
    line-height: 1;
  }
  #all-voted-overlay .av-sub {
    font-size: 28px;
    color: #aaa;
    margin-top: 12px;
  }

  /* ════ REVEAL – pojedyncze odkrycie miejsca ════ */
  #screen-reveal {
    flex: 1;
    display: none;
    position: relative;
    overflow: hidden;
    background: #000;
  }

  /* Fullscreen photo */
  #reveal-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  #reveal-img.show { opacity: 1; }

  /* Dark vignette overlay */
  #reveal-vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.7) 100%);
    pointer-events: none;
  }

  /* Place badge – bottom-right */
  #reveal-badge {
    position: absolute;
    bottom: 40px;
    right: 48px;
    text-align: right;
    opacity: 0;
    transition: opacity .5s ease;
    z-index: 10;
  }
  #reveal-badge.show { opacity: 1; }
  #reveal-badge .place-label {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 4px 24px rgba(0,0,0,.9), 0 0 60px currentColor;
    line-height: 1;
  }
  #reveal-badge .place-name {
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 2px;
    line-height: 1.1;
    text-shadow: 0 4px 32px rgba(0,0,0,.9);
    margin-top: 6px;
  }
  #reveal-badge .place-avg {
    font-size: 42px;
    font-weight: 700;
    margin-top: 8px;
    text-shadow: 0 2px 12px rgba(0,0,0,.9);
  }

  /* Colors per place */
  .place-color-3 { color: #cd7f32; }
  .place-color-2 { color: #c0c0c0; }
  .place-color-1 { color: #ffd700; }

  /* ── CONFETTI canvas ── */
  #confetti-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
  }

  /* ════ FULL PODIUM (słupki) ════ */
  #screen-podium {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    background: radial-gradient(ellipse at 50% 110%, #1a1200 0%, #0a0a1a 65%);
    position: relative;
    overflow: hidden;
  }
  .podium-bg-glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 80%, rgba(255,215,0,.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .podium-title-full {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: #ffd700;
    text-shadow: 0 0 40px rgba(255,215,0,.5);
    white-space: nowrap;
  }
  .podium-stage {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    width: 100%;
    gap: 20px;
    padding: 0 60px;
    z-index: 1;
  }
  .podium-slot {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transform: translateY(50px);
    transition: opacity .7s ease, transform .7s ease;
  }
  .podium-slot.revealed { opacity: 1; transform: translateY(0); }

  .p-frame {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 60px rgba(0,0,0,.85);
    position: relative;
    flex-shrink: 0;
  }
  .p-frame img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .p-badge {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 10px;
    text-align: center;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: linear-gradient(0deg, rgba(0,0,0,.85) 0%, transparent 100%);
  }
  .p-label { font-size: 20px; color: #ddd; margin-top: 8px; text-align: center; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .p-avg { font-weight: 800; margin-top: 4px; text-align: center; }
  .p-block {
    width: 100%;
    border-radius: 10px 10px 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    color: rgba(255,255,255,.4);
  }

  /* Slot sizes */
  .slot-3 .p-frame { width: 220px; height: 240px; border: 3px solid #cd7f32; }
  .slot-3 .p-badge { color: #cd7f32; font-size: 22px; }
  .slot-3 .p-avg { color: #cd7f32; font-size: 28px; }
  .slot-3 .p-block { height: 90px; font-size: 40px; background: linear-gradient(180deg, #6b3e1e, #4a2a10); }

  .slot-2 .p-frame { width: 270px; height: 300px; border: 3px solid #c0c0c0; }
  .slot-2 .p-badge { color: #c0c0c0; font-size: 24px; }
  .slot-2 .p-avg { color: #c0c0c0; font-size: 32px; }
  .slot-2 .p-block { height: 130px; font-size: 46px; background: linear-gradient(180deg, #555, #333); }

  .slot-1 .p-frame { width: 340px; height: 380px; border: 4px solid #ffd700; box-shadow: 0 0 60px rgba(255,215,0,.4); }
  .slot-1 .p-badge { color: #ffd700; font-size: 28px; }
  .slot-1 .p-avg { color: #ffd700; font-size: 38px; }
  .slot-1 .p-block { height: 180px; font-size: 56px; background: linear-gradient(180deg, #7a6200, #4a3b00); }
  .slot-1.revealed .p-frame { animation: goldGlow 2s ease-in-out infinite alternate; }
  @keyframes goldGlow { from{box-shadow:0 0 40px rgba(255,215,0,.4)} to{box-shadow:0 0 90px rgba(255,215,0,.9)} }

  /* ════ STATS ════ */
  #screen-stats {
    flex: 1;
    display: none;
    flex-direction: column;
    padding: 36px 60px;
    overflow-y: auto;
  }
  #screen-stats h2 {
    font-size: 42px;
    font-weight: 900;
    color: #ffd700;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
    text-align: center;
  }
  .stats-table { width: 100%; border-collapse: collapse; }
  .stats-table tr { border-bottom: 1px solid rgba(255,255,255,.08); }
  .stats-table th { color: #ffd700; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; padding: 10px 16px; text-align: left; }
  .stats-table td { padding: 12px 16px; vertical-align: middle; }
  .stats-thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
  .stats-place { font-size: 64px; font-weight: 900; width: 90px; text-align: center; }
  .stats-name { font-size: 24px; font-weight: 600; color: #ddd; }
  .stats-count { font-size: 22px; color: #aaa; }
  .stats-avg { font-size: 54px; font-weight: 900; }
  .stats-bar-wrap { width: 240px; background: rgba(255,255,255,.1); border-radius: 6px; height: 12px; }
  .stats-bar { height: 12px; border-radius: 6px; background: linear-gradient(90deg, #ffd700, #ff8c00); }
</style>
</head>
<body>

<!-- IDLE -->
<div id="screen-idle">
  <div class="crown">👑</div>
  <h1>Dodatek Wyborczy</h1>
  <p>Czekaj na uruchomienie przez administratora…</p>
</div>

<!-- GŁOSY ODDANE overlay (nad wszystkim) -->
<div id="all-voted-overlay">
  <div class="av-box">
    <div class="av-icon">✅</div>
    <div class="av-text">Głosy Oddane</div>
    <div class="av-sub">Administrator przejdzie do następnego zdjęcia</div>
  </div>
</div>

<!-- VOTING -->
<div id="screen-voting">
  <div class="voting-header">
    <span class="title">👑 Głosowanie</span>
    <span class="progress" id="v-progress">1 / 1</span>
    <span class="vote-count" id="v-vote-count">0 głosów</span>
  </div>
  <div class="voting-photo-wrap">
    <div class="pulse-ring"></div>
    <img id="v-photo" src="" alt="">
  </div>
  <div class="voting-bottom">
    <div class="voting-label" id="v-label"></div>
  </div>
</div>

<!-- REVEAL (odkrycie pojedynczego miejsca) -->
<div id="screen-reveal">
  <canvas id="confetti-canvas"></canvas>
  <img id="reveal-img" src="" alt="">
  <div id="reveal-vignette"></div>
  <div id="reveal-badge">
    <div class="place-label" id="reveal-place-label">MIEJSCE 3</div>
    <div class="place-name" id="reveal-place-name"></div>
    <div class="place-avg" id="reveal-place-avg"></div>
  </div>
</div>

<!-- FULL PODIUM (słupki) -->
<div id="screen-podium">
  <div class="podium-bg-glow"></div>
  <div class="podium-title-full">🏆 Podium</div>
  <div class="podium-stage">
    <div style="display:flex;gap:20px;align-items:flex-end" id="podium-order"></div>
  </div>
</div>

<!-- STATS -->
<div id="screen-stats">
  <h2>📊 Wyniki szczegółowe</h2>
  <table class="stats-table">
    <thead>
      <tr>
        <th>Miejsce</th>
        <th>Zdjęcie</th>
        <th>Opis</th>
        <th>Głosy</th>
        <th>Średnia</th>
        <th style="width:260px">Wynik</th>
      </tr>
    </thead>
    <tbody id="stats-tbody"></tbody>
  </table>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let lastState = null;
let podiumRanking = [];

// ── Screen switcher ──
function showScreen(name) {
  ['idle','voting','reveal','podium','stats'].forEach(n => {
    const el = document.getElementById('screen-' + n);
    if (el) el.style.display = 'none';
  });
  const el = document.getElementById('screen-' + name);
  if (el) el.style.display = name === 'reveal' ? 'block' : 'flex';
}

// ── Apply full state ──
function applyState(st) {
  lastState = st;
  if (st.phase === 'idle') {
    showScreen('idle');
  } else if (st.phase === 'voting') {
    hideAllVoted();
    showScreen('voting');
    const img = document.getElementById('v-photo');
    if (st.photo) {
      const newSrc = st.photo.url;
      if (img.getAttribute('data-src') !== newSrc) {
        img.setAttribute('data-src', newSrc);
        img.style.animation = 'none';
        img.src = newSrc;
        requestAnimationFrame(() => { img.style.animation = ''; });
      }
    }
    document.getElementById('v-label').textContent = st.photo ? (st.photo.label || '') : '';
    document.getElementById('v-progress').textContent = (st.currentIndex + 1) + ' / ' + st.total;
    updateVoteCount(st.currentVotes);
  } else if (st.phase === 'podium') {
    podiumRanking = st.ranking || [];
    showScreen('reveal'); // reveal view, admin drills into places
    stopConfetti();
  } else if (st.phase === 'podium_full') {
    showScreen('podium');
    buildFullPodium(st.ranking || podiumRanking);
    // Auto-reveal all
    setTimeout(() => {
      document.querySelectorAll('.podium-slot').forEach(s => s.classList.add('revealed'));
    }, 200);
  } else if (st.phase === 'stats') {
    showScreen('stats');
    buildStats(st.ranking);
  }
}

function updateVoteCount(count) {
  document.getElementById('v-vote-count').textContent =
    count + (count === 1 ? ' głos' : count < 5 ? ' głosy' : ' głosów');
}

// "Głosy Oddane" overlay
function showAllVoted() {
  const ov = document.getElementById('all-voted-overlay');
  ov.classList.add('show');
}
function hideAllVoted() {
  document.getElementById('all-voted-overlay').classList.remove('show');
}

// ── REVEAL – odkrycie miejsca ──
const placeColors  = { 1: '#ffd700', 2: '#c0c0c0', 3: '#cd7f32' };
const placeLabels  = { 1: '🥇 MIEJSCE 1', 2: '🥈 MIEJSCE 2', 3: '🥉 MIEJSCE 3' };

socket.on('wyborczy_podium_reveal', (data) => {
  const { place, url, label, avg, count, confetti: doConfetti } = data;
  if (!url) return;

  hideAllVoted();
  showScreen('reveal');
  stopConfetti();

  const color = placeColors[place] || '#fff';
  const badge = document.getElementById('reveal-badge');
  badge.classList.remove('show');
  badge.querySelector('.place-label').textContent = placeLabels[place] || `MIEJSCE ${place}`;
  badge.querySelector('.place-label').style.color = color;
  badge.querySelector('.place-name').textContent = label || '';
  badge.querySelector('.place-name').style.color = '#fff';
  badge.querySelector('.place-avg').textContent = avg != null ? `★ ${avg.toFixed(2)} / 10` : '';
  badge.querySelector('.place-avg').style.color = color;

  const img = document.getElementById('reveal-img');
  img.classList.remove('show');
  img.src = url;

  requestAnimationFrame(() => { badge.classList.add('show'); });

  setTimeout(() => { img.classList.add('show'); }, 600);

  if (doConfetti !== false) {
    startConfetti(place);
  }
});

socket.on('wyborczy_state', applyState);
socket.on('wyborczy_vote_update', (data) => {
  if (lastState && lastState.currentIndex === data.photoIndex) {
    updateVoteCount(data.count);
  }
});

socket.on('wyborczy_all_voted', () => {
  showAllVoted();
});

socket.emit('wyborczy_get_state');

// ════ CONFETTI ENGINE ════
let confettiAnimFrame = null;
let confettiParticles = [];

const CONFETTI_COLORS_BY_PLACE = {
  3: ['#cd7f32','#e8a055','#ff8c00','#fff','#c47c2a'],
  2: ['#c0c0c0','#e8e8e8','#fff','#aaa','#d4d4d4'],
  1: ['#ffd700','#ffec6e','#ff8c00','#fff','#ffc200','#ffe066']
};

function startConfetti(place) {
  stopConfetti();
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
  const ctx = canvas.getContext('2d');
  const colors = CONFETTI_COLORS_BY_PLACE[place] || CONFETTI_COLORS_BY_PLACE[1];
  const count = place === 1 ? 180 : 120;

  confettiParticles = Array.from({ length: count }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * 200,
    w: 8 + Math.random() * 10,
    h: 5 + Math.random() * 6,
    color: colors[Math.floor(Math.random() * colors.length)],
    vy: 3 + Math.random() * 4,
    vx: -1.5 + Math.random() * 3,
    rot: Math.random() * Math.PI * 2,
    rotV: (-0.05 + Math.random() * 0.1),
    opacity: 0.8 + Math.random() * 0.2
  }));

  let ticks = 0;
  function draw() {
    ticks++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of confettiParticles) {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rotV;
      if (ticks > 120) p.opacity -= 0.008;
      if (p.y < canvas.height + 20 && p.opacity > 0) alive = true;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if (alive && ticks < 600) {
      confettiAnimFrame = requestAnimationFrame(draw);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  confettiAnimFrame = requestAnimationFrame(draw);
}

function stopConfetti() {
  if (confettiAnimFrame) { cancelAnimationFrame(confettiAnimFrame); confettiAnimFrame = null; }
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  confettiParticles = [];
}

// ════ FULL PODIUM (słupki) ════
function buildFullPodium(ranking) {
  const el = document.getElementById('podium-order');
  el.innerHTML = '';
  // Layout: 3 – 1 – 2
  const order = [
    ranking.find(r => r.place === 3),
    ranking.find(r => r.place === 1),
    ranking.find(r => r.place === 2)
  ].filter(Boolean);

  order.forEach(r => {
    const { place, url, label, avg, count } = r;
    const medals = { 1: '🥇 MIEJSCE 1', 2: '🥈 MIEJSCE 2', 3: '🥉 MIEJSCE 3' };
    const heights = { 1: 180, 2: 130, 3: 90 };
    const div = document.createElement('div');
    div.className = `podium-slot slot-${place}`;
    div.innerHTML = `
      <div class="p-frame">
        <img src="${url}" alt="">
        <div class="p-badge">${medals[place]}</div>
      </div>
      <div class="p-label">${label || '&nbsp;'}</div>
      <div class="p-avg">★ ${avg.toFixed(2)} / 10</div>
      <div class="p-block" style="height:${heights[place]}px">${place}</div>
    `;
    el.appendChild(div);
  });
}

// ════ STATS ════
function buildStats(ranking) {
  const tbody = document.getElementById('stats-tbody');
  tbody.innerHTML = '';
  const sorted = [...ranking].sort((a, b) => b.place - a.place);
  const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
  const colors = { 1: '#ffd700', 2: '#c0c0c0', 3: '#cd7f32' };
  sorted.forEach(r => {
    const c = colors[r.place] || '#aaa';
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="stats-place" style="color:${c}">${medals[r.place] || '#' + r.place}</td>
      <td><img class="stats-thumb" src="${r.url}" alt=""></td>
      <td class="stats-name">${r.label || '—'}</td>
      <td class="stats-count">${r.count}</td>
      <td class="stats-avg" style="color:${c}">${r.avg.toFixed(2)}</td>
      <td><div class="stats-bar-wrap"><div class="stats-bar" style="width:${Math.round(r.avg/10*100)}%"></div></div></td>
    `;
    tbody.appendChild(tr);
  });
}
</script>
</body>
</html>
