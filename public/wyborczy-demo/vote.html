<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Głosuj – Wyborczy</title>
<link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0d0d1f;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: rgba(255,215,0,.08);
    border-bottom: 1px solid rgba(255,215,0,.2);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header .title { font-size: 16px; font-weight: 700; color: #ffd700; letter-spacing: 2px; text-transform: uppercase; }
  .header .progress { font-size: 14px; color: #aaa; }

  /* IDLE */
  #view-idle {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px 20px;
  }
  #view-idle .crown { font-size: 72px; animation: float 3s ease-in-out infinite; }
  #view-idle h2 { font-size: 24px; font-weight: 700; color: #ffd700; text-align: center; }
  #view-idle p { font-size: 16px; color: #888; text-align: center; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }

  /* VOTING */
  #view-voting {
    flex: 1;
    display: none;
    flex-direction: column;
  }
  .photo-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    min-height: 0;
  }
  .photo-wrap img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 6px 32px rgba(0,0,0,.7);
    animation: fadeIn .35s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:scale(.96)} to{opacity:1;transform:scale(1)} }
  .photo-label {
    padding: 10px 16px;
    text-align: center;
    font-size: 18px;
    font-weight: 500;
    color: #ddd;
    min-height: 44px;
  }

  /* STAR PANEL */
  .star-panel {
    background: rgba(0,0,0,.5);
    border-top: 1px solid rgba(255,215,0,.15);
    padding: 16px 12px 24px;
    flex-shrink: 0;
  }
  .star-panel .instruction {
    text-align: center;
    font-size: 13px;
    color: #888;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .stars-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .star-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid rgba(255,215,0,.3);
    background: rgba(255,215,0,.05);
    color: #888;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all .15s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }
  .star-btn.hover, .star-btn.selected {
    background: rgba(255,215,0,.2);
    border-color: #ffd700;
    color: #ffd700;
    transform: scale(1.12);
    box-shadow: 0 0 12px rgba(255,215,0,.4);
  }
  .star-btn.selected {
    background: #ffd700;
    color: #222;
    transform: scale(1.18);
    box-shadow: 0 0 20px rgba(255,215,0,.6);
  }
  .selected-label {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: #ffd700;
    min-height: 28px;
    margin-bottom: 12px;
  }
  .btn-vote {
    width: 100%;
    padding: 18px;
    background: linear-gradient(135deg, #ffd700, #ff8c00);
    color: #222;
    font-size: 20px;
    font-weight: 800;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: opacity .2s, transform .1s, box-shadow .2s;
    text-transform: uppercase;
    box-shadow: none;
  }
  .btn-vote:active { transform: scale(.97); }
  .btn-vote:disabled { opacity: .2; cursor: not-allowed; box-shadow: none; }
  .btn-vote.ready {
    box-shadow: 0 0 0 4px rgba(255,215,0,.4), 0 8px 28px rgba(255,140,0,.5);
    animation: btnPulse 1.4s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%,100% { box-shadow: 0 0 0 4px rgba(255,215,0,.35), 0 8px 28px rgba(255,140,0,.4); }
    50% { box-shadow: 0 0 0 8px rgba(255,215,0,.15), 0 12px 36px rgba(255,140,0,.6); }
  }

  /* VOTED */
  #view-voted {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px 20px;
  }
  #view-voted .check { font-size: 80px; animation: popIn .4s ease; }
  @keyframes popIn { 0%{transform:scale(0)} 80%{transform:scale(1.1)} 100%{transform:scale(1)} }
  #view-voted h2 { font-size: 26px; font-weight: 800; color: #4cff9f; text-align: center; }
  #view-voted p { font-size: 16px; color: #888; text-align: center; }
  .voted-stars { font-size: 28px; color: #ffd700; margin-top: 4px; }

  /* PODIUM / STATS */
  #view-end {
    flex: 1;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 40px 20px;
    text-align: center;
  }
  #view-end .trophy { font-size: 80px; }
  #view-end h2 { font-size: 26px; font-weight: 800; color: #ffd700; }
  #view-end p { font-size: 16px; color: #888; }
</style>
</head>
<body>

<div class="header">
  <span class="title">👑 Wyborczy</span>
  <span class="progress" id="h-progress"></span>
</div>

<!-- IDLE -->
<div id="view-idle">
  <div class="crown">👑</div>
  <h2>Czekaj na głosowanie</h2>
  <p>Administrator za chwilę<br>wyświetli pierwsze zdjęcie</p>
</div>

<!-- VOTING -->
<div id="view-voting">
  <div class="photo-wrap">
    <img id="vt-photo" src="" alt="">
  </div>
  <div class="photo-label" id="vt-label"></div>
  <div class="star-panel">
    <div class="instruction">Oceń od 1 do 10 gwiazdek</div>
    <div class="stars-row" id="stars-row">
      <!-- generated by JS -->
    </div>
    <div class="selected-label" id="selected-label">Wybierz ocenę</div>
    <button class="btn-vote" id="btn-vote" disabled>Zagłosuj</button>
  </div>
</div>

<!-- VOTED -->
<div id="view-voted">
  <div class="check">✅</div>
  <h2>Głos oddany!</h2>
  <div class="voted-stars" id="voted-stars"></div>
  <p>Czekaj na kolejne zdjęcie…</p>
</div>

<!-- END -->
<div id="view-end">
  <div class="trophy">🏆</div>
  <h2>Głosowanie zakończone!</h2>
  <p>Wyniki zostaną ogłoszone<br>na ekranie głównym.</p>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let selectedStars = 0;
let votedForIndex = -1;
let currentIndex = -1;

socket.on('connect', () => {
  socket.emit('wyborczy_join_voters');
});

// Build star buttons
const starsRow = document.getElementById('stars-row');
for (let i = 1; i <= 10; i++) {
  const btn = document.createElement('button');
  btn.className = 'star-btn';
  btn.textContent = i;
  btn.dataset.val = i;
  btn.addEventListener('click', () => selectStars(i));
  starsRow.appendChild(btn);
}

function selectStars(n) {
  selectedStars = n;
  document.querySelectorAll('.star-btn').forEach(b => {
    const v = parseInt(b.dataset.val);
    b.classList.toggle('selected', v === n);
    b.classList.toggle('hover', v <= n && v !== n);
  });
  const labels = ['','Bardzo słabo 😞','Słabo 😕','Poniżej oczekiwań','Przeciętnie','Nie najlepiej 😐','OK 👍','Dobrze 😊','Bardzo dobrze ⭐','Świetnie 🌟','Rewelacja! 👑✨'];
  document.getElementById('selected-label').textContent = `${n} / 10 — ${labels[n] || ''}`;
  const btn = document.getElementById('btn-vote');
  btn.disabled = false;
  btn.classList.add('ready');
  // Scroll so button is visible
  setTimeout(() => btn.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

document.getElementById('btn-vote').addEventListener('click', () => {
  if (!selectedStars || votedForIndex === currentIndex) return;
  document.getElementById('btn-vote').classList.remove('ready');
  socket.emit('wyborczy_vote', { stars: selectedStars });
});

socket.on('wyborczy_vote_ok', (data) => {
  votedForIndex = data.photoIndex;
  const starsText = '★'.repeat(selectedStars) + '☆'.repeat(10 - selectedStars);
  document.getElementById('voted-stars').textContent = `${selectedStars} / 10  ${starsText}`;
  showView('voted');
});

function showView(name) {
  ['idle','voting','voted','end'].forEach(n => {
    document.getElementById('view-' + n).style.display = 'none';
  });
  document.getElementById('view-' + name).style.display = 'flex';
}

function applyState(st) {
  document.getElementById('h-progress').textContent =
    st.phase === 'voting' ? `${st.currentIndex + 1} / ${st.total}` : '';

  if (st.phase === 'idle') {
    showView('idle');
    votedForIndex = -1;
    currentIndex = -1;
  } else if (st.phase === 'voting') {
    currentIndex = st.currentIndex;

    if (st.alreadyVoted) {
      showView('voted');
      return;
    }

    // New photo – reset vote UI
    if (currentIndex !== votedForIndex) {
      selectedStars = 0;
      document.querySelectorAll('.star-btn').forEach(b => { b.classList.remove('selected','hover'); });
      document.getElementById('selected-label').textContent = 'Wybierz ocenę';
      const btn = document.getElementById('btn-vote');
      btn.disabled = true;
      btn.classList.remove('ready');
      showView('voting');
    } else {
      showView('voted');
    }

    const img = document.getElementById('vt-photo');
    if (st.photo && img.src !== location.origin + st.photo.url) {
      img.src = st.photo.url;
    }
    document.getElementById('vt-label').textContent = st.photo ? (st.photo.label || '') : '';
  } else if (st.phase === 'podium' || st.phase === 'stats') {
    showView('end');
  }
}

socket.on('wyborczy_state', applyState);
socket.emit('wyborczy_get_state');
</script>
</body>
</html>
