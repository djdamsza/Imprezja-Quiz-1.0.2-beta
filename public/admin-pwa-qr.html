<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel na telefonie – QR | Imprezja</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png">
    <link rel="stylesheet" href="/css/admin-editor-shared.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--imp-font);
            background: var(--imp-bg-gradient);
            min-height: 100vh;
            color: var(--imp-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        h1 {
            color: var(--imp-accent);
            font-size: 1.5rem;
            margin-bottom: 12px;
        }
        .desc {
            color: rgba(255,255,255,0.7);
            font-size: 0.95rem;
            margin-bottom: 24px;
            max-width: 320px;
        }
        .qr-wrap {
            background: #fff;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .qr-wrap img {
            display: block;
            width: 260px;
            height: 260px;
        }
        .qr-url {
            font-size: 0.8rem;
            word-break: break-all;
            color: rgba(255,255,255,0.6);
            margin-bottom: 24px;
            max-width: 320px;
        }
        .back-link {
            color: #f1c40f;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .back-link:hover { text-decoration: underline; }
        .loading { color: rgba(255,255,255,0.6); }
        .error { color: #e74c3c; margin-bottom: 16px; }
        .https-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 999px;
            margin-bottom: 12px;
        }
        .https-badge.ok { background: rgba(46, 204, 113, 0.2); color: #2ecc71; }
        .https-badge.warn { background: rgba(231, 76, 60, 0.2); color: #e74c3c; }
        .https-note {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.75);
            max-width: 340px;
            margin-bottom: 16px;
            line-height: 1.45;
        }
        .https-note a { color: #f1c40f; }
        .https-note strong { color: #fff; }
    </style>
</head>
<body class="imp-admin-editor">
    <a href="/start.html" class="back-link">← Powrót do wyboru trybu</a>
    <h1>📱 Panel na telefonie</h1>
    <p class="desc">Zeskanuj kod QR telefonem, aby otworzyć panel sterowania na urządzeniu mobilnym.</p>
    <div id="https-badge"></div>
    <div id="https-note" class="https-note"></div>
    <div id="qr-container">
        <p class="loading">Ładowanie QR…</p>
    </div>
    <p id="qr-url" class="qr-url"></p>

    <script>
        (async function() {
            const urlEl = document.getElementById('qr-url');
            const qrContainer = document.getElementById('qr-container');
            const badgeEl = document.getElementById('https-badge');
            const noteEl = document.getElementById('https-note');
            try {
                const r = await fetch('/api/admin-pwa-qr');
                const d = await r.json();
                if (d.qrCode) {
                    qrContainer.innerHTML = '<div class="qr-wrap"><img src="' + d.qrCode + '" alt="QR"></div>';
                    urlEl.textContent = d.url || '';
                    if (d.httpsAvailable && d.protocol === 'https') {
                        badgeEl.innerHTML = '<span class="https-badge ok">HTTPS · port ' + (d.url.match(/:(\d+)/) || [, '3443'])[1] + '</span>';
                        noteEl.innerHTML = 'Po zeskanowaniu telefon może poprosić o <strong>zaakceptowanie certyfikatu</strong> (bezpieczne w sieci lokalnej). Dzięki HTTPS ekran nie będzie gasnął podczas prowadzenia.';
                    } else {
                        badgeEl.innerHTML = '<span class="https-badge warn">HTTP — ekran może gasnąć</span>';
                        let note = 'Kod QR wskazuje HTTP, bo serwer HTTPS nie wystartował. Zrestartuj aplikację.';
                        if (d.httpsUrl) {
                            note += ' Możesz też otworzyć ręcznie: <a href="' + d.httpsUrl + '">' + d.httpsUrl + '</a>';
                        }
                        if (d.certExpired) note += ' Certyfikat HTTPS wygasł — wygeneruj nowy w folderze certs/.';
                        noteEl.innerHTML = note;
                    }
                } else {
                    qrContainer.innerHTML = '<p class="error">' + (d.error || 'Błąd generowania QR') + '</p>';
                }
            } catch (e) {
                qrContainer.innerHTML = '<p class="error">Błąd połączenia: ' + (e.message || 'Nieznany') + '</p>';
            }
        })();
    </script>
</body>
</html>
