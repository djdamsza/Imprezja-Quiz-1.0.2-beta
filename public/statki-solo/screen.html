<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statki Solo – Screen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000c1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#waiting{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000c1a;z-index:10}
#waiting h1{font-size:clamp(1.4rem,4vw,2.5rem);color:#7dd3fc;margin-bottom:12px}
#waiting p{color:#475569;font-size:1rem}
.dot{display:inline-block;animation:blink 1.4s infinite both}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
#board-wrap{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:10px}

/* Overlay animations */
@keyframes hitPop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
@keyframes rewardSlide{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes colGlow{0%,100%{opacity:.7}50%{opacity:1}}
#overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}

/* Phase indicator */
#phase-bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;
    background:rgba(0,0,0,.6);border:1px solid rgba(14,165,233,.35);
    border-radius:24px;padding:6px 20px;font-size:1rem;color:#64748b;
    transition:all .3s;white-space:nowrap;pointer-events:none}
#phase-bar.active{color:#7dd3fc;border-color:rgba(14,165,233,.7);background:rgba(14,165,233,.1)}
#phase-bar span{font-weight:800;color:#fbbf24;font-size:1.15em}
</style>
</head>
<body>
<div id="waiting">
    <h1>⚓ Statki Solo</h1>
    <p>Oczekiwanie na admina<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
</div>
<div id="board-wrap"></div>
<div id="overlay"></div>
<div id="phase-bar">Oczekiwanie…</div>

<audio id="soundtrack" loop></audio>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const LETTERS = 'ABCDEFGHIJ';

// ── WakeLock — ekran TV nie gaśnie podczas gry ─────────────
let wakeLock = null;
async function keepAwake() {
    if (!('wakeLock' in navigator)) return;
    try {
        wakeLock = await navigator.wakeLock.request('screen');
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
            }
        });
    } catch(e) {}
}
keepAwake();
let gameState = null;
let audioUnlocked = false;
let actx = null;

const waiting = document.getElementById('waiting');
const boardWrap = document.getElementById('board-wrap');
const overlay = document.getElementById('overlay');
const phaseBar = document.getElementById('phase-bar');
const soundtrackEl = document.getElementById('soundtrack');

// ── Web Audio ──────────────────────────────────────────────
function getCtx() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
}
document.addEventListener('click', () => { if (!audioUnlocked) { getCtx(); audioUnlocked = true; } });
document.addEventListener('touchstart', () => { if (!audioUnlocked) { getCtx(); audioUnlocked = true; } }, {passive:true});

// Sonar ping — gdy admin przewija (zmiana celu)
function playSonar() {
    try {
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(900, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.35);
        g.gain.setValueAtTime(0.18, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
    } catch(e) {}
}

// Celowanie skonfirmowane (faza 2 — rząd)
function playAimLock() {
    try {
        const ctx = getCtx();
        [500, 750].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'sine'; osc.frequency.value = freq;
            g.gain.setValueAtTime(0, ctx.currentTime + i * 0.1);
            g.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i * 0.1 + 0.03);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.18);
            osc.start(ctx.currentTime + i * 0.1);
            osc.stop(ctx.currentTime + i * 0.1 + 0.2);
        });
    } catch(e) {}
}

// Strzał — whoosh (przed animacją)
function playWhoosh() {
    try {
        const ctx = getCtx();
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.5);
        const src = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const g = ctx.createGain();
        src.buffer = buf; filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2000, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.35);
        filter.Q.value = 0.5;
        g.gain.setValueAtTime(0.6, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        src.connect(filter); filter.connect(g); g.connect(ctx.destination);
        src.start(); src.stop(ctx.currentTime + 0.4);
    } catch(e) {}
}

// Trafienie — eksplozja
function playExplosion() {
    try {
        const ctx = getCtx();
        const buf = ctx.createBuffer(1, ctx.sampleRate * 1.2, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 0.5);
        const src = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const g = ctx.createGain();
        src.buffer = buf; filter.type = 'lowpass'; filter.frequency.value = 350;
        g.gain.setValueAtTime(0.9, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
        src.connect(filter); filter.connect(g); g.connect(ctx.destination);
        src.start(); src.stop(ctx.currentTime + 1.2);
    } catch(e) {}
}

// Pudło — woda
function playSplash() {
    try {
        const ctx = getCtx();
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.7, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(i * 0.02) * Math.pow(1 - i / d.length, 1.2);
        const src = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const g = ctx.createGain();
        src.buffer = buf; filter.type = 'highpass'; filter.frequency.value = 800;
        g.gain.setValueAtTime(0.35, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
        src.connect(filter); filter.connect(g); g.connect(ctx.destination);
        src.start(); src.stop(ctx.currentTime + 0.7);
    } catch(e) {}
}

// Fanfara — wygrana
function playVictory() {
    try {
        const ctx = getCtx();
        [523, 659, 784, 1047].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'triangle'; osc.frequency.value = freq;
            const t = ctx.currentTime + i * 0.22;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.3, t + 0.05);
            g.gain.setValueAtTime(0.3, t + 0.15);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
            osc.start(t); osc.stop(t + 0.5);
        });
    } catch(e) {}
}

// ── Soundtrack ─────────────────────────────────────────────
function startSoundtrack(url) {
    if (!url) return;
    const src = url.startsWith('http') ? url : '/uploads/' + url;
    if (!soundtrackEl.src || !soundtrackEl.src.endsWith(encodeURI(src.replace(/^.*\/uploads\//, '')))) {
        soundtrackEl.src = src; soundtrackEl.volume = 0.65;
    }
    soundtrackEl.play().catch(()=>{});
}
function stopSoundtrack() { soundtrackEl.pause(); soundtrackEl.currentTime = 0; }
socket.on('ships_solo_volume', d => { soundtrackEl.volume = Math.max(0, Math.min(1, d.volume)); });

// ── Board rendering ────────────────────────────────────────
let lastAimPhase = null;

function renderBoard() {
    if (!gameState) return;
    const g = gameState;
    const n = g.boardSize || 8;
    const shots = g.shots || {};
    const aimRow = g.aimRow;    // null lub indeks wiersza
    const aimCol = g.aimCol;    // null lub indeks kolumny
    const phase = g.phase;      // 'col' = celowanie kolumną, 'row' = celowanie wierszem

    const vw = window.innerWidth, vh = window.innerHeight;
    const maxBoard = Math.min(vw * 0.94, vh * 0.88);
    const headPx = Math.max(20, Math.floor(maxBoard / (n + 1) * 0.8));
    const cellPx = Math.floor((maxBoard - headPx) / n);
    const fsh = Math.max(11, Math.floor(headPx * 0.55));
    const fsc = Math.max(11, Math.floor(cellPx * 0.42));

    // Phase indicator
    if (aimCol !== null || aimRow !== null) {
        phaseBar.classList.add('active');
        if (phase === 'col') {
            phaseBar.innerHTML = `Kolumna: <span>${aimCol !== null ? LETTERS[aimCol] : '?'}</span>`;
        } else {
            phaseBar.innerHTML = `<span>${aimCol !== null ? LETTERS[aimCol] : '?'}</span>${aimRow !== null ? aimRow + 1 : '?'} – Celowanie…`;
        }
    } else {
        phaseBar.classList.remove('active');
        phaseBar.textContent = g.gameEnded ? '🏁 Gra zakończona' : 'Oczekiwanie…';
    }

    let html = `<table style="border-collapse:collapse;table-layout:fixed;border:3px solid #0ea5e9;background:#000;box-shadow:0 0 60px rgba(14,165,233,.3);">`;

    // Header row — litery (kolumny)
    html += `<tr>`;
    html += `<th style="width:${headPx}px;height:${headPx}px;background:#00111f;border:1px solid #0d3a5c;"></th>`;
    for (let c = 0; c < n; c++) {
        const isAimedCol = aimCol === c;
        const isPhaseCol = phase === 'col' && isAimedCol;
        const isPhaseRow = phase === 'row' && isAimedCol; // kolumna już wybrana
        let bg = '#00111f', color = '#38bdf8', extra = '';
        if (isPhaseCol) {
            bg = 'rgba(14,165,233,.3)'; color = '#fff';
            extra = 'box-shadow:0 0 20px rgba(14,165,233,.5);';
        } else if (isPhaseRow) {
            bg = 'rgba(14,165,233,.15)'; color = '#7dd3fc';
        }
        html += `<th style="width:${cellPx}px;height:${headPx}px;background:${bg};color:${color};font-size:${fsh}px;font-weight:700;border:1px solid #0d3a5c;${extra}transition:background .2s,box-shadow .2s;">${LETTERS[c]}</th>`;
    }
    html += `</tr>`;

    // Data rows
    for (let r = 0; r < n; r++) {
        const isAimedRow = aimRow === r;
        const isRowHL = phase === 'row' && isAimedRow;

        // Row header — cyfry
        let rhBg = '#00111f', rhColor = '#475569';
        if (isRowHL) { rhBg = 'rgba(14,165,233,.22)'; rhColor = '#7dd3fc'; }

        html += `<tr>`;
        html += `<th style="width:${headPx}px;height:${cellPx}px;background:${rhBg};color:${rhColor};font-size:${fsh}px;font-weight:700;border:1px solid #0d3a5c;transition:background .2s;">${r + 1}</th>`;

        for (let c = 0; c < n; c++) {
            const key = `${r}_${c}`;
            const shot = shots[key];
            const isAimCell = phase === 'row' && aimRow === r && aimCol === c; // skrzyżowanie!
            const isColHL = phase === 'col' && aimCol === c;
            const isColDim = phase === 'row' && aimCol === c && !isAimedRow;
            const isColRow = phase === 'row' && aimCol === c && isAimedRow;

            let bg = '#001020';
            let content = '';
            let extra = '';

            if (shot) {
                if (shot.hit) {
                    bg = '#166534';
                    const sz = shot.shipSize;
                    const numFs = Math.max(13, Math.floor(cellPx * 0.52));
                    content = sz
                        ? `<span style="font-size:${numFs}px;font-weight:900;color:#4ade80;text-shadow:0 0 12px #4ade80;">${sz}</span>`
                        : `<span style="font-size:${Math.max(10,cellPx*0.45)}px;">🔥</span>`;
                    extra = 'box-shadow:inset 0 0 12px rgba(74,222,128,.3);';
                } else {
                    bg = '#0f172a';
                    content = `<span style="color:#334155;font-size:${Math.max(10,cellPx*0.4)}px;font-weight:700;">✕</span>`;
                }
            } else if (isAimCell) {
                // Czerwone skrzyżowanie — tu trafi pocisk
                bg = '#7f1d1d';
                extra = 'box-shadow:0 0 28px rgba(239,68,68,.9),inset 0 0 14px rgba(239,68,68,.4);border:2px solid #ef4444 !important;';
                content = `<span style="font-size:${Math.max(12,cellPx*0.45)}px;">🎯</span>`;
            } else if (isColHL) {
                // Faza 1: cała kolumna świeci
                bg = 'rgba(14,165,233,.18)';
            } else if (isColDim) {
                // Faza 2: wybrana kolumna (dimmer)
                bg = 'rgba(14,165,233,.1)';
            } else if (isRowHL) {
                // Faza 2: cały rząd świeci (poza skrzyżowaniem)
                bg = 'rgba(14,165,233,.15)';
            }

            html += `<td style="width:${cellPx}px;height:${cellPx}px;background:${bg};border:1px solid #0d3a5c;text-align:center;vertical-align:middle;${extra}transition:background .18s;">${content}</td>`;
        }
        html += `</tr>`;
    }

    html += `</table>`;
    boardWrap.innerHTML = html;
}

// ── Shot overlay animation ─────────────────────────────────
function showShotOverlay(hit, reward, shipSize, gameEnded) {
    overlay.innerHTML = '';
    if (hit) {
        const sz = shipSize ? `<div style="margin-top:10px;font-size:clamp(18px,3.5vw,40px);color:#94a3b8;font-weight:600">Statek <strong style="color:#4ade80;font-size:1.3em;">${shipSize}</strong>-masztowy</div>` : '';
        overlay.innerHTML = `
<div style="animation:hitPop .5s cubic-bezier(.34,1.56,.64,1) both;text-align:center;">
  <div style="font-size:clamp(60px,12vw,120px);line-height:1;">💥</div>
  <div style="font-size:clamp(44px,9vw,100px);font-weight:900;color:#4ade80;text-shadow:0 0 40px #4ade80,0 0 80px rgba(74,222,128,.5);letter-spacing:3px;margin-top:8px;">TRAFIONY!</div>
  ${sz}
  ${reward ? `<div style="margin-top:20px;font-size:clamp(24px,4.5vw,60px);font-weight:700;color:#fbbf24;text-shadow:0 0 24px #fbbf24;animation:rewardSlide .8s .5s ease both;">🏆 ${reward}</div>` : ''}
  ${gameEnded ? `<div style="margin-top:20px;font-size:clamp(18px,3vw,38px);color:#7dd3fc;animation:rewardSlide 1s .9s ease both;">🎉 Wszystkie statki zatopione!</div>` : ''}
</div>`;
        document.body.style.animation = 'shake .45s ease';
        setTimeout(() => document.body.style.animation = '', 480);
        const dur = reward || gameEnded ? 5200 : 3200;
        setTimeout(() => { overlay.innerHTML = ''; }, dur);
    } else {
        overlay.innerHTML = `<div style="animation:rewardSlide .35s ease both;color:#475569;font-size:clamp(24px,5vw,64px);font-weight:700;">💧 Pudło</div>`;
        setTimeout(() => { overlay.innerHTML = ''; }, 2200);
    }
}

// ── Socket events ──────────────────────────────────────────
socket.on('ships_solo_state', (g) => {
    if (!g) {
        waiting.style.display = 'flex'; boardWrap.style.display = 'none';
        phaseBar.classList.remove('active'); phaseBar.textContent = 'Oczekiwanie…';
        return;
    }
    gameState = g;
    waiting.style.display = 'none';
    boardWrap.style.display = 'flex';
    if (g.soundtrack) startSoundtrack(g.soundtrack);
    renderBoard();
});

socket.on('ships_solo_aim_update', (d) => {
    if (!gameState) return;
    const prevPhase = gameState.phase;
    gameState.aimRow = d.aimRow;
    gameState.aimCol = d.aimCol;
    gameState.phase = d.phase;
    renderBoard();
    // Dźwięki: sonar przy zmianie celu, aimLock przy przejściu do fazy 'row'
    if (d.phase === 'row' && prevPhase === 'col') {
        playAimLock();
    } else {
        playSonar();
    }
});

socket.on('ships_solo_shot_result', (d) => {
    if (!gameState) return;
    if (d.shots) gameState.shots = d.shots;
    if (d.phase !== undefined) gameState.phase = d.phase;
    gameState.aimRow = null; gameState.aimCol = null;
    if (d.gameEnded) gameState.gameEnded = true;
    renderBoard();
    if (d.hit !== undefined) {
        playWhoosh();
        setTimeout(() => {
            d.hit ? playExplosion() : playSplash();
            if (d.gameEnded) setTimeout(playVictory, 600);
        }, 380);
        showShotOverlay(d.hit, d.reward, d.shipSize, d.gameEnded);
    }
    if (d.gameEnded) stopSoundtrack();
});

window.addEventListener('resize', renderBoard);
socket.on('connect', () => socket.emit('ships_solo_get_state'));
</script>
</body>
</html>
