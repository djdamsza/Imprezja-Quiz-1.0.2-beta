<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Statki Solo – Screen</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000c1a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#waiting{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000c1a;z-index:10}
#waiting h1{font-size:clamp(1.4rem,4vw,2.5rem);color:#7dd3fc;margin-bottom:12px}
#waiting p{color:#475569;font-size:1rem}
.dot{display:inline-block;animation:blink 1.4s infinite both}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
#board-wrap{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:10px}

/* Overlay animations */
@keyframes hitPop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-14px)}40%,80%{transform:translateX(14px)}}
@keyframes rewardSlide{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes colGlow{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes strzelaj-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}

/* Phase indicator (coordinate display) */
#phase-bar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;
    background:rgba(0,0,0,.6);border:1px solid rgba(14,165,233,.35);
    border-radius:24px;padding:6px 20px;font-size:1rem;color:#64748b;
    transition:all .3s;white-space:nowrap;pointer-events:none}
#phase-bar.active{color:#7dd3fc;border-color:rgba(14,165,233,.7);background:rgba(14,165,233,.1)}
#phase-bar span{font-weight:800;color:#fbbf24;font-size:1.15em}

/* STRZELAJ / CZEKAJ status banner — right side, below legend */
#status-banner{position:fixed;right:16px;bottom:10%;z-index:60;
    display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;transition:opacity .3s}
#status-text{font-size:clamp(1.4rem,3vw,2.4rem);font-weight:900;letter-spacing:3px;
    text-shadow:0 2px 20px currentColor;transition:color .3s,text-shadow .3s}
#status-text.strzelaj{color:#ef4444;animation:strzelaj-pulse 0.9s ease-in-out infinite;text-shadow:0 0 40px rgba(239,68,68,.7),0 2px 8px rgba(0,0,0,.8)}
#status-text.celowanie{color:#fbbf24;animation:none;text-shadow:0 0 24px rgba(251,191,36,.5)}

/* Navigation buttons — bottom corners, hidden in fullscreen */
#btn-solo-fs{position:fixed;bottom:16px;right:16px;z-index:200;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);color:#94a3b8;font-size:.82rem;font-weight:700;padding:8px 18px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:6px}
#btn-solo-fs:hover{background:rgba(255,255,255,.14);color:#fff}
#btn-solo-back{position:fixed;bottom:16px;left:16px;z-index:200;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.15);color:#64748b;font-size:.82rem;font-weight:600;padding:8px 18px;border-radius:10px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px}
#btn-solo-back:hover{background:rgba(255,255,255,.1);color:#94a3b8}

/* Shot countdown ring */
#countdown-wrap{display:none;flex-direction:column;align-items:center;gap:4px}
#countdown-num{font-size:clamp(2rem,4vw,3.5rem);font-weight:900;color:#fbbf24;line-height:1;min-width:2ch;text-align:center}
#countdown-bar-outer{width:clamp(80px,10vw,140px);height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
#countdown-bar{height:100%;background:#ef4444;border-radius:4px;transition:width .2s linear}

/* Shot counter top-right */
#shot-counter{position:fixed;top:14px;right:20px;z-index:50;
    background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);
    border-radius:20px;padding:5px 16px;font-size:.9rem;color:#94a3b8;pointer-events:none}

/* Ship legend — right side, near board edge */
#ship-legend{position:fixed;right:10px;top:70px;z-index:50;
    background:rgba(0,8,20,.88);border:1.5px solid rgba(14,165,233,.35);
    border-radius:18px;padding:20px 22px;display:none;flex-direction:column;
    gap:10px;pointer-events:none;backdrop-filter:blur(6px)}
.sl-title{color:#7dd3fc;font-size:1.3rem;font-weight:800;letter-spacing:.08em;
    text-transform:uppercase;text-align:center;margin-bottom:6px;
    padding-bottom:8px;border-bottom:1px solid rgba(14,165,233,.25)}
.sl-row{display:flex;gap:6px;align-items:center}
.sl-row.sunk{opacity:.32}
.sl-cell{width:31px;height:31px;border-radius:4px;flex-shrink:0;
    border:2px solid rgba(14,165,233,.5);background:rgba(14,165,233,.15);
    transition:background .35s,border-color .35s}
.sl-cell.hit{background:#15803d;border-color:#4ade80}
</style>
</head>
<body>
<div id="waiting">
    <h1>⚓ Statki Solo</h1>
    <p>Oczekiwanie na admina<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></p>
</div>
<div id="board-wrap"></div>
<div id="overlay"></div>
<div id="phase-bar">Oczekiwanie…</div>
<div id="shot-counter" style="display:none">Strzał 1</div>
<div id="ship-legend"></div>
<div id="status-banner">
    <div id="status-text" class="czekaj">CZEKAJ</div>
    <div id="countdown-wrap">
        <div id="countdown-num">10</div>
        <div id="countdown-bar-outer"><div id="countdown-bar" style="width:100%"></div></div>
    </div>
</div>

<button id="btn-solo-fs" type="button" onclick="soloStatkiRequestFs()">⛶ Pełny ekran</button>
<a id="btn-solo-back" href="/statki-solo/">← Cofnij</a>

<audio id="soundtrack" loop></audio>

<script src="/socket.io/socket.io.js"></script>
<script src="/lib/audio-normalize.js"></script>
<script src="/lib/digital-output-cap.js"></script>
<script>
const socket = io();
const LETTERS = 'ABCDEFGHIJ';

function soloStatkiRequestFs() {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (!fn) return;
    try {
        const p = fn.call(el);
        if (p && typeof p.catch === 'function') p.catch(() => {});
    } catch (e) {}
}

// ── WakeLock — ekran TV nie gaśnie podczas gry ─────────────
let wakeLock = null;
async function keepAwake() {
    if (!('wakeLock' in navigator)) return;
    try {
        wakeLock = await navigator.wakeLock.request('screen');
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible') {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
            }
        });
    } catch(e) {}
}
keepAwake();

// ── Fullscreen — hide nav buttons when in fullscreen ────
function soloStatkiFsActive() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function soloStatkiOnFsChange() {
    const fs = soloStatkiFsActive();
    document.getElementById('btn-solo-fs').style.display = fs ? 'none' : 'flex';
    document.getElementById('btn-solo-back').style.display = fs ? 'none' : 'flex';
}
document.addEventListener('fullscreenchange', soloStatkiOnFsChange);
document.addEventListener('webkitfullscreenchange', soloStatkiOnFsChange);

let gameState = null;
/** Po zakończeniu gry (lub „Koniec”) nie wznawiaj muzyki przy kolejnych ships_solo_state (np. visibilitychange). */
let statkiSoundtrackAllowed = true;
let audioUnlocked = false;
let actx = null;

const waiting = document.getElementById('waiting');
const boardWrap = document.getElementById('board-wrap');
const overlay = document.getElementById('overlay');
const phaseBar = document.getElementById('phase-bar');
const soundtrackEl = document.getElementById('soundtrack');
const statusText = document.getElementById('status-text');
const countdownWrap = document.getElementById('countdown-wrap');
const countdownNum = document.getElementById('countdown-num');
const countdownBar = document.getElementById('countdown-bar');
const shotCounter = document.getElementById('shot-counter');

// ── Status & Countdown ─────────────────────────────────────
const SHOT_TIMEOUT_S = 10;
let countdownInterval = null;
let countdownLeft = SHOT_TIMEOUT_S;

function setStatus(mode) { // 'strzelaj' | 'celowanie' | 'hidden'
    const banner = document.getElementById('status-banner');
    if (mode === 'strzelaj') {
        statusText.textContent = '🎯 STRZELAJ!';
        statusText.className = 'strzelaj';
        banner.style.opacity = '1';
        startCountdown();
    } else if (mode === 'celowanie') {
        statusText.textContent = '🔭 CELOWANIE';
        statusText.className = 'celowanie';
        banner.style.opacity = '1';
        stopCountdown();
    } else {
        banner.style.opacity = '0';
        stopCountdown();
    }
}
function startCountdown() {
    stopCountdown();
    countdownLeft = SHOT_TIMEOUT_S;
    countdownNum.textContent = countdownLeft;
    countdownBar.style.width = '100%';
    countdownWrap.style.display = 'flex';
    countdownInterval = setInterval(() => {
        countdownLeft--;
        countdownNum.textContent = countdownLeft;
        const pct = Math.max(0, (countdownLeft / SHOT_TIMEOUT_S) * 100);
        countdownBar.style.width = pct + '%';
        if (countdownLeft <= 0) stopCountdown();
    }, 1000);
}
function stopCountdown() {
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
    countdownWrap.style.display = 'none';
}
function updateShotCounter() {
    if (!gameState) return;
    const n = Object.keys(gameState.shots || {}).length;
    shotCounter.textContent = 'Strzał ' + (n + 1);
    shotCounter.style.display = gameState.gameEnded ? 'none' : 'block';
}

// ── Web Audio ──────────────────────────────────────────────
function getCtx() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
}
document.addEventListener('click', () => { if (!audioUnlocked) { getCtx(); audioUnlocked = true; } });
document.addEventListener('touchstart', () => { if (!audioUnlocked) { getCtx(); audioUnlocked = true; } }, {passive:true});

// Sonar ping — gdy admin przewija (zmiana celu)
function playSonar() {
    try {
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(900, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.35);
        g.gain.setValueAtTime(0.18, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
    } catch(e) {}
}

// Celowanie skonfirmowane (faza 2 — rząd)
function playAimLock() {
    try {
        const ctx = getCtx();
        [500, 750].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'sine'; osc.frequency.value = freq;
            g.gain.setValueAtTime(0, ctx.currentTime + i * 0.1);
            g.gain.linearRampToValueAtTime(0.2, ctx.currentTime + i * 0.1 + 0.03);
            g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.18);
            osc.start(ctx.currentTime + i * 0.1);
            osc.stop(ctx.currentTime + i * 0.1 + 0.2);
        });
    } catch(e) {}
}

// Strzał — whoosh (przed animacją)
function playWhoosh() {
    try {
        const ctx = getCtx();
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 1.5);
        const src = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const g = ctx.createGain();
        src.buffer = buf; filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2000, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.35);
        filter.Q.value = 0.5;
        g.gain.setValueAtTime(0.6, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        src.connect(filter); filter.connect(g); g.connect(ctx.destination);
        src.start(); src.stop(ctx.currentTime + 0.4);
    } catch(e) {}
}

// Trafienie — eksplozja
function playExplosion() {
    try {
        const ctx = getCtx();
        const buf = ctx.createBuffer(1, ctx.sampleRate * 1.2, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 0.5);
        const src = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const g = ctx.createGain();
        src.buffer = buf; filter.type = 'lowpass'; filter.frequency.value = 350;
        g.gain.setValueAtTime(0.9, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
        src.connect(filter); filter.connect(g); g.connect(ctx.destination);
        src.start(); src.stop(ctx.currentTime + 1.2);
    } catch(e) {}
}

// Pudło — woda
function playSplash() {
    try {
        const ctx = getCtx();
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.7, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(i * 0.02) * Math.pow(1 - i / d.length, 1.2);
        const src = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const g = ctx.createGain();
        src.buffer = buf; filter.type = 'highpass'; filter.frequency.value = 800;
        g.gain.setValueAtTime(0.35, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.7);
        src.connect(filter); filter.connect(g); g.connect(ctx.destination);
        src.start(); src.stop(ctx.currentTime + 0.7);
    } catch(e) {}
}

// Fanfara — wygrana
function playVictory() {
    try {
        const ctx = getCtx();
        [523, 659, 784, 1047].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination);
            osc.type = 'triangle'; osc.frequency.value = freq;
            const t = ctx.currentTime + i * 0.22;
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.3, t + 0.05);
            g.gain.setValueAtTime(0.3, t + 0.15);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
            osc.start(t); osc.stop(t + 0.5);
        });
    } catch(e) {}
}

// ── Soundtrack (kanał × master) ────────────────────────────
let statkiSoundtrackGain = 1;
let statkiChannelVolume = 1;
let statkiMasterVolume = 1;
function applyStatkiVolume() {
    soundtrackEl.volume = clampDigitalOutputLinear(Math.min(1, statkiChannelVolume * statkiMasterVolume) * statkiSoundtrackGain);
}
function prepareStatkiSoundtrackForActiveGame() {
    statkiSoundtrackAllowed = true;
}

/** Zatrzymaj muzykę; lockPlayback=true — nie odtwarzaj aż do nowej gry (init / reset). */
function stopSoundtrack(lockPlayback) {
    soundtrackEl.loop = false;
    try {
        soundtrackEl.pause();
        soundtrackEl.currentTime = 0;
    } catch (e) {}
    if (lockPlayback) statkiSoundtrackAllowed = false;
}

async function startSoundtrack(url) {
    if (!url) return;
    if (!statkiSoundtrackAllowed || (gameState && gameState.gameEnded)) return;
    const src = url.startsWith('http') || url.startsWith('/') ? url : '/uploads/' + url;
    if (!soundtrackEl.src || !soundtrackEl.src.endsWith(encodeURI(src.replace(/^.*\/uploads\//, '')))) {
        statkiSoundtrackGain = 1;
        if (typeof window.AudioNormalize !== 'undefined' && (src.startsWith('/') || src.includes(window.location.host))) {
            statkiSoundtrackGain = await window.AudioNormalize.getNormalizedGainForUrl(src);
        }
        soundtrackEl.src = src;
        applyStatkiVolume();
    }
    if (!statkiSoundtrackAllowed || (gameState && gameState.gameEnded)) return;
    soundtrackEl.loop = gameState && gameState.soundtrackLoop === false ? false : true;
    soundtrackEl.play().catch(()=>{});
}
socket.on('ships_solo_volume', d => { statkiChannelVolume = Math.max(0, Math.min(1, d.volume)); applyStatkiVolume(); });
socket.on('master_volume', d => { statkiMasterVolume = (d && d.volume != null) ? Math.max(0, Math.min(1, d.volume)) : 1; applyStatkiVolume(); });
socket.on('ships_solo_stop_music', () => stopSoundtrack(true));

// ── Ship legend ────────────────────────────────────────────
function renderShipLegend() {
    const el = document.getElementById('ship-legend');
    if (!gameState || !gameState.ships || !gameState.ships.length) {
        el.style.display = 'none'; return;
    }
    const shots = gameState.shots || {};
    const ships = [...gameState.ships].sort((a, b) => b.size - a.size);

    let sunkCount = 0;
    const shipData = ships.map(ship => {
        const cells = [];
        for (let i = 0; i < ship.size; i++) {
            const r = ship.vertical ? ship.row + i : ship.row;
            const c = ship.vertical ? ship.col : ship.col + i;
            cells.push(!!(shots[`${r}_${c}`] && shots[`${r}_${c}`].hit));
        }
        const isSunk = cells.length > 0 && cells.every(Boolean);
        if (isSunk) sunkCount++;
        return { cells, sunk: isSunk };
    });

    // Fleet size summary (e.g. "1×5  1×4  2×3  1×2")
    const sizeCounts = {};
    ships.forEach(s => { sizeCounts[s.size] = (sizeCounts[s.size] || 0) + 1; });
    const sizeLabel = Object.keys(sizeCounts).sort((a,b)=>b-a)
        .map(sz => `${sizeCounts[sz]}×${sz}▬`).join('  ');

    const titleLine = sunkCount > 0
        ? `${sunkCount}/${ships.length} zatopionych`
        : `${ships.length} statków`;

    let html = `<div class="sl-title">⚓ ${titleLine}</div>`;
    html += `<div style="color:#475569;font-size:1.15rem;text-align:center;margin-bottom:6px;letter-spacing:.04em">${sizeLabel}</div>`;
    for (const sd of shipData) {
        html += `<div class="sl-row${sd.sunk ? ' sunk' : ''}">`;
        html += sd.cells.map(h => `<div class="sl-cell${h ? ' hit' : ''}"></div>`).join('');
        html += '</div>';
    }
    el.innerHTML = html;
    el.style.display = 'flex';
}

// ── Board rendering ────────────────────────────────────────
let lastAimPhase = null;

function renderBoard() {
    if (!gameState) return;
    const g = gameState;
    const n = g.boardSize || 8;
    const shots = g.shots || {};
    const aimRow = g.aimRow;    // null lub indeks wiersza
    const aimCol = g.aimCol;    // null lub indeks kolumny
    const phase = g.phase;      // 'col' = celowanie kolumną, 'row' = celowanie wierszem

    const vw = window.innerWidth, vh = window.innerHeight;
    const maxBoard = Math.min(vw * 0.94, vh * 0.88);
    const headPx = Math.max(20, Math.floor(maxBoard / (n + 1) * 0.8));
    const cellPx = Math.floor((maxBoard - headPx) / n);
    const fsh = Math.max(11, Math.floor(headPx * 0.55));
    const fsc = Math.max(11, Math.floor(cellPx * 0.42));

    // Phase indicator
    if (aimCol !== null || aimRow !== null) {
        phaseBar.classList.add('active');
        if (phase === 'col') {
            phaseBar.innerHTML = `Kolumna: <span>${aimCol !== null ? LETTERS[aimCol] : '?'}</span>`;
        } else {
            phaseBar.innerHTML = `<span>${aimCol !== null ? LETTERS[aimCol] : '?'}</span>${aimRow !== null ? aimRow + 1 : '?'} – Celowanie…`;
        }
    } else {
        phaseBar.classList.remove('active');
        phaseBar.textContent = g.gameEnded ? '🏁 Gra zakończona' : 'Oczekiwanie…';
    }

    let html = `<table style="border-collapse:collapse;table-layout:fixed;border:3px solid #0ea5e9;background:#000;box-shadow:0 0 60px rgba(14,165,233,.3);">`;

    // Header row — litery (kolumny)
    html += `<tr>`;
    html += `<th style="width:${headPx}px;height:${headPx}px;background:#00111f;border:1px solid #0d3a5c;"></th>`;
    for (let c = 0; c < n; c++) {
        const isAimedCol = aimCol === c;
        const isPhaseCol = phase === 'col' && isAimedCol;
        const isPhaseRow = phase === 'row' && isAimedCol; // kolumna już wybrana
        let bg = '#00111f', color = '#38bdf8', extra = '';
        if (isPhaseCol) {
            bg = 'rgba(14,165,233,.3)'; color = '#fff';
            extra = 'box-shadow:0 0 20px rgba(14,165,233,.5);';
        } else if (isPhaseRow) {
            bg = 'rgba(14,165,233,.15)'; color = '#7dd3fc';
        }
        html += `<th style="width:${cellPx}px;height:${headPx}px;background:${bg};color:${color};font-size:${fsh}px;font-weight:700;border:1px solid #0d3a5c;${extra}transition:background .2s,box-shadow .2s;">${LETTERS[c]}</th>`;
    }
    html += `</tr>`;

    // Data rows
    for (let r = 0; r < n; r++) {
        const isAimedRow = aimRow === r;
        const isRowHL = phase === 'row' && isAimedRow;

        // Row header — cyfry
        let rhBg = '#00111f', rhColor = '#475569';
        if (isRowHL) { rhBg = 'rgba(14,165,233,.22)'; rhColor = '#7dd3fc'; }

        html += `<tr>`;
        html += `<th style="width:${headPx}px;height:${cellPx}px;background:${rhBg};color:${rhColor};font-size:${fsh}px;font-weight:700;border:1px solid #0d3a5c;transition:background .2s;">${r + 1}</th>`;

        for (let c = 0; c < n; c++) {
            const key = `${r}_${c}`;
            const shot = shots[key];
            const isAimCell = phase === 'row' && aimRow === r && aimCol === c; // skrzyżowanie!
            const isColHL = phase === 'col' && aimCol === c;
            const isColDim = phase === 'row' && aimCol === c && !isAimedRow;
            const isColRow = phase === 'row' && aimCol === c && isAimedRow;

            let bg = '#001020';
            let content = '';
            let extra = '';

            if (shot) {
                if (shot.hit) {
                    bg = '#166534';
                    const sz = shot.shipSize;
                    const numFs = Math.max(13, Math.floor(cellPx * 0.52));
                    content = sz
                        ? `<span style="font-size:${numFs}px;font-weight:900;color:#4ade80;text-shadow:0 0 12px #4ade80;">${sz}</span>`
                        : `<span style="font-size:${Math.max(10,cellPx*0.45)}px;">🔥</span>`;
                    extra = 'box-shadow:inset 0 0 12px rgba(74,222,128,.3);';
                } else {
                    bg = '#0f172a';
                    content = `<span style="color:#64748b;font-size:${Math.max(10,cellPx*0.4)}px;font-weight:700;">✕</span>`;
                }
            } else if (isAimCell) {
                // Czerwone skrzyżowanie — tu trafi pocisk
                bg = '#7f1d1d';
                extra = 'box-shadow:0 0 28px rgba(239,68,68,.9),inset 0 0 14px rgba(239,68,68,.4);border:2px solid #ef4444 !important;';
                content = `<span style="font-size:${Math.max(12,cellPx*0.45)}px;">🎯</span>`;
            } else if (isColHL) {
                // Faza 1: cała kolumna świeci
                bg = 'rgba(14,165,233,.18)';
            } else if (isColDim) {
                // Faza 2: wybrana kolumna (dimmer)
                bg = 'rgba(14,165,233,.1)';
            } else if (isRowHL) {
                // Faza 2: cały rząd świeci (poza skrzyżowaniem)
                bg = 'rgba(14,165,233,.15)';
            }

            html += `<td style="width:${cellPx}px;height:${cellPx}px;background:${bg};border:1px solid #0d3a5c;text-align:center;vertical-align:middle;${extra}transition:background .18s;">${content}</td>`;
        }
        html += `</tr>`;
    }

    html += `</table>`;
    boardWrap.innerHTML = html;
    renderShipLegend();
}

// ── Shot overlay — dwufazowy: trafienie znika, nagroda zostaje +3s ──────────
function showShotOverlay(hit, reward, shipSize, gameEnded) {
    overlay.innerHTML = '';
    if (hit) {
        const sz = shipSize ? `<div id="ov-ship" style="margin-top:10px;font-size:clamp(18px,3.5vw,40px);color:#94a3b8;font-weight:600;transition:opacity .6s">Statek <strong style="color:#4ade80;font-size:1.3em;">${shipSize}</strong>-masztowy</div>` : '';
        overlay.innerHTML = `
<div style="animation:hitPop .5s cubic-bezier(.34,1.56,.64,1) both;text-align:center;">
  <div id="ov-hit" style="transition:opacity .6s">
    <div style="font-size:clamp(60px,12vw,120px);line-height:1;">💥</div>
    <div style="font-size:clamp(44px,9vw,100px);font-weight:900;color:#4ade80;text-shadow:0 0 40px #4ade80,0 0 80px rgba(74,222,128,.5);letter-spacing:3px;margin-top:8px;">TRAFIONY!</div>
    ${sz}
  </div>
  ${reward ? `<div id="ov-reward" style="margin-top:20px;font-size:clamp(24px,4.5vw,60px);font-weight:700;color:#fbbf24;text-shadow:0 0 24px #fbbf24;animation:rewardSlide .8s .5s ease both;transition:opacity .6s">🏆 ${reward}</div>` : ''}
  ${gameEnded ? `<div id="ov-ended" style="margin-top:20px;font-size:clamp(18px,3vw,38px);color:#7dd3fc;animation:rewardSlide 1s .9s ease both;transition:opacity .6s">🎉 Wszystkie statki zatopione!</div>` : ''}
</div>`;
        document.body.style.animation = 'shake .45s ease';
        setTimeout(() => document.body.style.animation = '', 480);

        const HIT_DUR = 3000;  // trafienie widoczne przez 3s
        // Faza 2: ukryj tekst "TRAFIONY!", zostaw nagrodę
        setTimeout(() => {
            const hitEl = document.getElementById('ov-hit');
            if (hitEl) hitEl.style.opacity = '0';
            // Jeśli nie ma nagrody ani końca gry — wyczyść po chwili
            if (!reward && !gameEnded) {
                setTimeout(() => { overlay.innerHTML = ''; }, 700);
            }
        }, HIT_DUR);

        // Faza 3: ukryj nagrodę po dodatkowych 3s
        const rewardExtra = (reward || gameEnded) ? 3000 : 700;
        setTimeout(() => { overlay.innerHTML = ''; }, HIT_DUR + rewardExtra);

    } else {
        overlay.innerHTML = `<div style="animation:rewardSlide .35s ease both;color:#475569;font-size:clamp(24px,5vw,64px);font-weight:700;">💧 Pudło</div>`;
        setTimeout(() => { overlay.innerHTML = ''; }, 2200);
    }
}

// ── Socket events ──────────────────────────────────────────
socket.on('ships_solo_state', (g) => {
    if (!g) {
        waiting.style.display = 'flex'; boardWrap.style.display = 'none';
        phaseBar.classList.remove('active'); phaseBar.textContent = 'Oczekiwanie…';
        shotCounter.style.display = 'none';
        document.getElementById('ship-legend').style.display = 'none';
        setStatus('hidden');
        stopSoundtrack(false);
        prepareStatkiSoundtrackForActiveGame();
        try {
            soundtrackEl.removeAttribute('src');
            soundtrackEl.load();
        } catch (e) {}
        return;
    }
    gameState = g;
    waiting.style.display = 'none';
    boardWrap.style.display = 'flex';
    if (g.gameEnded) {
        stopSoundtrack(true);
    } else {
        prepareStatkiSoundtrackForActiveGame();
        if (g.soundtrack) startSoundtrack(g.soundtrack);
    }
    updateShotCounter();
    if (g.aimCol !== null && g.phase === 'row') setStatus('strzelaj');
    else if (g.aimCol !== null && g.phase === 'col') setStatus('celowanie');
    else setStatus('hidden');
    renderBoard();
});

socket.on('ships_solo_aim_update', (d) => {
    if (!gameState) return;
    gameState.aimRow = d.aimRow;
    gameState.aimCol = d.aimCol;
    gameState.phase = d.phase;
    renderBoard();
    if (d.phase === 'row') {
        setStatus('strzelaj');
        playAimLock();
    } else if (d.phase === 'col') {
        setStatus('celowanie');
        playSonar();
    } else {
        setStatus('hidden');
    }
});

socket.on('ships_solo_shot_result', (d) => {
    if (!gameState) return;
    if (d.shots) gameState.shots = d.shots;
    if (d.phase !== undefined) gameState.phase = d.phase;
    gameState.aimRow = null; gameState.aimCol = null;
    if (d.gameEnded) gameState.gameEnded = true;
    setStatus('hidden');
    updateShotCounter();
    renderBoard();
    if (d.hit !== undefined) {
        playWhoosh();
        setTimeout(() => {
            d.hit ? playExplosion() : playSplash();
            if (d.gameEnded) setTimeout(playVictory, 600);
        }, 380);
        showShotOverlay(d.hit, d.reward, d.shipSize, d.gameEnded);
    }
    if (d.gameEnded) stopSoundtrack(true);
});

// Timeout rundy – admin nie strzelił w czasie
socket.on('ships_solo_timeout', () => {
    if (!gameState) return;
    gameState.aimRow = null; gameState.aimCol = null; gameState.phase = 'col';
    setStatus('hidden');
    renderBoard();
    overlay.innerHTML = '<div style="animation:rewardSlide .35s ease both;color:#64748b;font-size:clamp(20px,4vw,54px);font-weight:700;">⏱ Czas minął</div>';
    setTimeout(() => { overlay.innerHTML = ''; }, 2000);
});

window.addEventListener('resize', renderBoard);
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        socket.emit('ships_solo_get_state');
        setTimeout(renderBoard, 200);
    }
});
socket.on('connect', () => socket.emit('ships_solo_get_state'));
</script>
</body>
</html>
