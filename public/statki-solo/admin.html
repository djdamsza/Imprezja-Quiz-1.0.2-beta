<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="icon" type="image/png" sizes="32x32" href="/img/icon-32.png"><link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Statki Solo – Admin</title>
<link rel="stylesheet" href="/css/admin-editor-shared.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--imp-bg);color:var(--imp-text);font-family:var(--imp-font);user-select:none}
body{padding-top:52px;padding-top:calc(52px + env(safe-area-inset-top))}

.volume-bar{position:fixed;top:0;left:0;right:0;z-index:100;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:#000c1a;border-bottom:1px solid rgba(255,255,255,.1)}
.volume-bar input[type=range]{width:100%;height:8px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.2);border-radius:4px;outline:none}
.volume-bar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;background:#0ea5e9;border-radius:50%;cursor:pointer}

.fullscreen-btn{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));right:max(16px,env(safe-area-inset-right));width:48px;height:48px;border-radius:8px;background:rgba(14,165,233,.9);border:2px solid rgba(255,255,255,.3);color:#fff;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:1000;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.fullscreen-btn:hover,.fullscreen-btn:active{background:rgba(14,165,233,1)}

.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ── Start screen ── */
#s-loading{align-items:center;justify-content:center;gap:12px}
#s-loading p{color:#475569}
#s-start{align-items:center;justify-content:center;gap:16px;padding:20px}
#s-start h1{font-size:1.5rem;font-weight:800;color:#7dd3fc}
.board-summary{background:rgba(14,165,233,.1);border:1px solid rgba(14,165,233,.3);border-radius:12px;padding:12px 18px;text-align:center;color:#94a3b8;font-size:.88rem;line-height:1.6;width:100%;max-width:340px}
.board-summary strong{color:#7dd3fc}
.music-panel{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 16px;width:100%;max-width:340px}
.music-panel h3{color:#94a3b8;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.btn-play{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:9px;background:rgba(14,165,233,.15);border:1px solid rgba(14,165,233,.3);border-radius:8px;color:#7dd3fc;cursor:pointer;font-size:.88rem;margin-top:8px}
.btn-play:hover{background:rgba(14,165,233,.25)}
.btn-main{width:100%;max-width:340px;padding:15px;font-size:1.05rem;font-weight:800;border:none;border-radius:14px;cursor:pointer;transition:all .2s}
.btn-blue{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;box-shadow:0 6px 24px rgba(14,165,233,.35)}
.btn-blue:hover{box-shadow:0 8px 32px rgba(14,165,233,.55);transform:translateY(-1px)}
.btn-blue:disabled{opacity:.4;pointer-events:none}
/* End button — only visible outside fullscreen */
.btn-end{background:rgba(239,68,68,.1);border:2px solid rgba(239,68,68,.4);color:#f87171;font-size:.88rem;padding:10px}
.btn-end:hover{background:rgba(239,68,68,.2)}

/* ── Grid picker screens ── */
#s-col,#s-row{background:#000c1a}
.phase-header{flex-shrink:0;display:flex;align-items:center;padding:12px 14px 8px;gap:8px;border-bottom:1px solid rgba(255,255,255,.05)}
.phase-title{flex:1;text-align:center;color:#64748b;font-size:.9rem;font-weight:600}
.phase-badge{font-size:.7rem;color:#0ea5e9;background:rgba(14,165,233,.15);padding:3px 10px;border-radius:20px;border:1px solid rgba(14,165,233,.25);white-space:nowrap}
.btn-back{background:none;border:none;color:#475569;font-size:.85rem;cursor:pointer;padding:4px 8px;border-radius:6px;white-space:nowrap}
.btn-back:hover{color:#94a3b8}

/* Target display — bottom info bar */
.target-bar{flex-shrink:0;padding:10px 16px 14px;background:#000c1a;border-top:1px solid rgba(255,255,255,.06);text-align:center}
.tbar-label{font-size:.72rem;color:#475569;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.tbar-coord{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.tbar-box{min-width:52px;padding:6px 12px;border-radius:10px;font-size:1.8rem;font-weight:900;line-height:1;border:2px solid rgba(14,165,233,.5);background:rgba(14,165,233,.12);color:#7dd3fc;text-align:center}
.tbar-box.fire{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.1);color:#fca5a5}
.tbar-box.chosen{border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.08);color:#fbbf24}
.tbar-sep{color:#475569;font-size:1.2rem;font-weight:300}
.tbar-hint{font-size:.7rem;color:#334155;letter-spacing:.04em}
.tbar-hint.ready{color:#22c55e;font-weight:700;font-size:.75rem}
.tbar-warn{font-size:.75rem;color:#ef4444;font-weight:700;margin-top:4px}

/* Grid picker */
.grid-picker{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px;align-content:center;min-height:0;overflow-y:auto}
.grid-btn{display:flex;align-items:center;justify-content:center;border-radius:16px;border:2.5px solid rgba(14,165,233,.4);background:rgba(14,165,233,.08);color:#7dd3fc;font-size:2.8rem;font-weight:900;cursor:pointer;min-height:72px;transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.grid-btn:active{background:rgba(14,165,233,.35);transform:scale(.94)}
.grid-btn.fire{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.06);color:#fca5a5}
.grid-btn.fire:active{background:rgba(239,68,68,.3);transform:scale(.94)}
.grid-btn.shot-hit{border-color:rgba(74,222,128,.25);background:rgba(22,101,52,.15);color:#4ade80;font-size:1.4rem;opacity:.5;pointer-events:none}
.grid-btn.shot-miss{border-color:rgba(100,116,139,.15);background:rgba(15,23,42,.4);color:#475569;font-size:1.4rem;opacity:.35;pointer-events:none}

/* ── Result ── */
#s-result{align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
.r-icon{font-size:clamp(46px,16vw,84px)}
.r-text{font-size:clamp(20px,7vw,44px);font-weight:900}
.r-reward{font-size:clamp(14px,4.5vw,26px);font-weight:700;color:#fbbf24}
.r-coord{font-size:clamp(12px,3vw,17px);color:#64748b}
#mini-board{border-collapse:collapse;border:2px solid #0ea5e9;background:#000;display:inline-table}
#mini-board th,#mini-board td{border:1px solid #0d3a5c;text-align:center;font-size:11px;font-weight:700}
.result-actions{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px;margin-top:4px}

/* Floating end button — hidden in fullscreen */
#btn-end-game{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:rgba(239,68,68,.1);border:1.5px solid rgba(239,68,68,.4);color:#f87171;font-size:.78rem;font-weight:700;padding:7px 22px;border-radius:10px;cursor:pointer;z-index:200;display:none;white-space:nowrap}
#btn-end-game:hover{background:rgba(239,68,68,.2)}
</style>
</head>
<body class="imp-admin-editor">

<div class="volume-bar">
    <input type="range" id="volume" min="0" max="100" value="65" title="Głośność">
</div>

<!-- Ładowanie -->
<div class="screen active" id="s-loading">
    <h2 style="color:#7dd3fc;font-size:1.4rem">⚓ Statki Solo</h2>
    <p style="color:#475569">Ładowanie konfiguracji…</p>
</div>

<!-- Start -->
<div class="screen" id="s-start">
    <h1>⚓ Statki Solo</h1>
    <div class="board-summary" id="board-summary">Ładowanie…</div>

    <!-- Suwak dostępny przed grą -->
    <div class="music-panel" id="music-panel" style="display:none">
        <h3>🎵 Soundtrack</h3>
        <button class="btn-play" id="btn-music-toggle" onclick="toggleMusic()">▶ Włącz muzykę</button>
    </div>

    <button class="btn-main btn-blue" id="btn-start" onclick="startGame()">🚀 Rozpocznij grę</button>
    <a href="/statki-solo/" style="color:#475569;font-size:.8rem;text-decoration:none">← Powrót</a>
</div>

<button type="button" class="fullscreen-btn" id="btn-fs-float" onclick="enterFullscreen()" title="Pełny ekran">⛶</button>

<!-- Faza 1: Kolumna -->
<div class="screen" id="s-col">
    <div class="phase-header">
        <span style="min-width:60px"></span>
        <span class="phase-title">Wybierz kolumnę</span>
        <span class="phase-badge" id="col-phase-badge">A – H</span>
    </div>
    <div class="grid-picker" id="col-grid"></div>
    <div class="target-bar">
        <div class="tbar-hint">Dotknij literę kolumny</div>
    </div>
</div>

<!-- Faza 2: Rząd (strzał) -->
<div class="screen" id="s-row">
    <div class="phase-header">
        <button class="btn-back" onclick="backToCol()">← Zmień kolumnę</button>
        <span class="phase-title" id="row-phase-title">Kolumna A → Rząd</span>
        <span class="phase-badge" id="row-phase-badge">1–8</span>
    </div>
    <div class="grid-picker" id="row-grid"></div>
    <div class="target-bar">
        <div class="tbar-coord">
            <div class="tbar-box chosen" id="tb-row-col">A</div>
            <div class="tbar-sep">+</div>
            <div class="tbar-box fire" id="tb-row-num">?</div>
        </div>
        <div class="tbar-hint ready">Dotknij numer aby STRZELIĆ 🎯</div>
    </div>
</div>

<!-- Wynik strzału -->
<div class="screen" id="s-result">
    <div class="r-icon" id="r-icon"></div>
    <div class="r-text" id="r-text"></div>
    <div class="r-reward" id="r-reward"></div>
    <div class="r-coord" id="r-coord"></div>
    <div id="admin-ship-legend" style="display:none;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;max-width:320px;width:100%;padding:8px 12px;background:rgba(14,165,233,.05);border:1px solid rgba(14,165,233,.14);border-radius:10px;margin-top:4px;margin-bottom:2px;"></div>
    <div style="overflow-x:auto;text-align:center;max-width:320px;width:100%;margin-top:2px" id="mini-board-wrap"></div>
    <div class="result-actions">
        <button class="btn-main btn-blue" onclick="nextShot()" id="btn-next">🎯 Następny strzał</button>
        <!-- End game visible here (safe — po celowym strzale), i poza fullscreen -->
        <button class="btn-main btn-end" onclick="endGame()" id="btn-end-result">🏁 Zakończ grę</button>
    </div>
</div>

<!-- Floating end button — pojawia się tylko poza fullscreen podczas gry -->
<button id="btn-end-game" onclick="endGame()">🏁 Zakończ grę</button>

<audio id="audio-bg" loop></audio>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const LETTERS = 'ABCDEFGHIJ';
let config = null;
let gameRunning = false;
let selectedCol = 0;
let selectedRow = 0;
let shots = {};
let musicPlaying = false;
let wakeLock = null;
let isFullscreen = false;
const audioEl = document.getElementById('audio-bg');
let actx = null;

// ── WakeLock ───────────────────────────────────────────────
async function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    try {
        wakeLock = await navigator.wakeLock.request('screen');
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
            }
        });
    } catch(e) {}
}
requestWakeLock();

// ── Fullscreen ─────────────────────────────────────────────
async function enterFullscreen() {
    try {
        await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    } catch(e) {
        // Fallback for iOS
        try { await document.body.webkitRequestFullscreen(); } catch(e2) {}
    }
}

document.addEventListener('fullscreenchange', onFsChange);
document.addEventListener('webkitfullscreenchange', onFsChange);
function onFsChange() {
    isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
    const fsBtn = document.getElementById('btn-fs-float');
    if (fsBtn) fsBtn.style.display = isFullscreen ? 'none' : 'flex';
    const floatEnd = document.getElementById('btn-end-game');
    floatEnd.style.display = (!isFullscreen && gameRunning && document.getElementById('s-result').classList.contains('active') === false) ? 'block' : 'none';
}

// ── Web Audio ──────────────────────────────────────────────
function getCtx() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
}
document.addEventListener('touchstart', () => getCtx(), {passive:true, once:true});
document.addEventListener('click', () => getCtx(), {once:true});

function playTick() {
    try {
        const ctx = getCtx(); const osc = ctx.createOscillator(); const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination);
        osc.type = 'sine'; osc.frequency.value = 680;
        g.gain.setValueAtTime(0.08, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
        osc.start(); osc.stop(ctx.currentTime + 0.06);
    } catch(e) {}
}
function playConfirm() {
    try {
        const ctx = getCtx();
        [600, 900].forEach((f, i) => {
            const osc = ctx.createOscillator(); const g = ctx.createGain();
            osc.connect(g); g.connect(ctx.destination); osc.type = 'sine'; osc.frequency.value = f;
            const t = ctx.currentTime + i * 0.1;
            g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            osc.start(t); osc.stop(t + 0.2);
        });
    } catch(e) {}
}
function playFire() {
    try {
        const ctx = getCtx(); const osc = ctx.createOscillator(); const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination); osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(35, ctx.currentTime + 0.28);
        g.gain.setValueAtTime(0.22, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.32);
        osc.start(); osc.stop(ctx.currentTime + 0.35);
    } catch(e) {}
}
function playHitResult() {
    try {
        const ctx = getCtx();
        const buf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 0.6);
        const src = ctx.createBufferSource(); const f = ctx.createBiquadFilter(); const g = ctx.createGain();
        src.buffer = buf; f.type = 'lowpass'; f.frequency.value = 280;
        g.gain.setValueAtTime(0.6, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
        src.connect(f); f.connect(g); g.connect(ctx.destination); src.start(); src.stop(ctx.currentTime + 0.5);
    } catch(e) {}
}
function playMissResult() {
    try {
        const ctx = getCtx(); const osc = ctx.createOscillator(); const g = ctx.createGain();
        osc.connect(g); g.connect(ctx.destination); osc.type = 'sine';
        osc.frequency.setValueAtTime(380, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.4);
        g.gain.setValueAtTime(0.13, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.start(); osc.stop(ctx.currentTime + 0.5);
    } catch(e) {}
}

// ── Screens ────────────────────────────────────────────────
function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    // Update floating end button visibility
    const floatEnd = document.getElementById('btn-end-game');
    const onResult = id === 's-result';
    floatEnd.style.display = (!isFullscreen && gameRunning && !onResult) ? 'block' : 'none';
}

// ── Config ─────────────────────────────────────────────────
async function loadConfig() {
    try {
        const r = await fetch('/api/statki-solo/config');
        config = await r.json();
        renderStartScreen();
    } catch(e) {
        document.getElementById('board-summary').textContent = 'Błąd ładowania. Otwórz edytor i zapisz planszę.';
    }
    show('s-start');
}
function renderStartScreen() {
    const el = document.getElementById('board-summary');
    if (!config || !config.ships || !config.ships.length) {
        el.innerHTML = '⚠️ Brak planszy.<br><small>Otwórz <a href="/statki-solo/editor.html" style="color:#0ea5e9">Edytor</a> i zapisz konfigurację.</small>';
        document.getElementById('btn-start').disabled = true;
        return;
    }
    const rewards = Object.values(config.rewards || {}).filter(Boolean);
    // Fleet composition: count per size
    const sizeCounts = {};
    config.ships.forEach(s => { sizeCounts[s.size] = (sizeCounts[s.size] || 0) + 1; });
    const fleetStr = Object.keys(sizeCounts).sort((a,b)=>b-a)
        .map(sz => `${sizeCounts[sz]}×${sz}-mast.`).join(' · ');
    el.innerHTML = `Plansza <strong>${config.boardSize}×${config.boardSize}</strong> · <strong>${config.ships.length}</strong> statków · <strong>${rewards.length}</strong> nagród<br><small style="color:#64748b">${fleetStr}</small>`;
    if (config.soundtrack) document.getElementById('music-panel').style.display = 'block';
}

// ── Głośność — regulator na górze ───────────────────────────
const volSlider = document.getElementById('volume');
function emitVolume() {
    const v = parseFloat(volSlider.value) / 100;
    socket.emit('ships_solo_volume', { volume: v });
}
volSlider.oninput = emitVolume;
socket.on('ships_solo_volume', (d) => { if (d && typeof d.volume === 'number') { volSlider.value = Math.round(d.volume * 100); } });
function toggleMusic() {
    if (!config || !config.soundtrack) return;
    musicPlaying = !musicPlaying;
    document.getElementById('btn-music-toggle').textContent = musicPlaying ? '⏸ Zatrzymaj muzykę' : '▶ Włącz muzykę';
}

// ── Start / Koniec ─────────────────────────────────────────
function startGame() {
    if (!config || !config.ships || !config.ships.length) return;
    shots = {}; gameRunning = true;
    socket.emit('ships_solo_init', config);
    selectedCol = 0; selectedRow = 0;
    buildColGrid();
}
function endGame() {
    if (!confirm('Zakończyć grę?')) return;
    socket.emit('ships_solo_end', {});
    gameRunning = false;
    musicPlaying = false;
    if (audioEl) { audioEl.pause(); audioEl.currentTime = 0; }
    document.getElementById('btn-music-toggle').textContent = '▶ Włącz muzykę';
    document.getElementById('btn-end-game').style.display = 'none';
    show('s-start');
}
function nextShot() {
    document.getElementById('btn-next').style.display = 'flex';
    buildColGrid();
}
function backToCol() {
    socket.emit('ships_solo_aim', { aimRow: null, aimCol: selectedCol, phase: 'col' });
    buildColGrid();
}

// ── Grid Picker ────────────────────────────────────────────

let _shotPending = false;

function buildColGrid() {
    _shotPending = false;
    const grid = document.getElementById('col-grid');
    const n = config.boardSize;
    document.getElementById('col-phase-badge').textContent = `A – ${LETTERS[n-1]}`;
    grid.innerHTML = '';
    for (let c = 0; c < n; c++) {
        const btn = document.createElement('button');
        btn.className = 'grid-btn';
        btn.textContent = LETTERS[c];
        btn.onclick = () => {
            selectedCol = c;
            playConfirm();
            socket.emit('ships_solo_aim', { aimRow: null, aimCol: c, phase: 'col' });
            buildRowGrid();
        };
        grid.appendChild(btn);
    }
    show('s-col');
}

function buildRowGrid() {
    _shotPending = false;
    const grid = document.getElementById('row-grid');
    const n = config.boardSize;
    document.getElementById('row-phase-title').textContent = `Kolumna ${LETTERS[selectedCol]} → Rząd`;
    document.getElementById('row-phase-badge').textContent = `1–${n}`;
    document.getElementById('tb-row-col').textContent = LETTERS[selectedCol];
    document.getElementById('tb-row-num').textContent = '?';
    grid.innerHTML = '';
    for (let r = 0; r < n; r++) {
        const btn = document.createElement('button');
        const key = `${r}_${selectedCol}`;
        const shot = shots[key];
        if (shot) {
            btn.className = 'grid-btn ' + (shot.hit ? 'shot-hit' : 'shot-miss');
            btn.textContent = shot.hit ? `${r+1} 💥` : `${r+1} ✕`;
        } else {
            btn.className = 'grid-btn fire';
            btn.textContent = String(r + 1);
            btn.onclick = () => {
                if (_shotPending) return;
                _shotPending = true;
                selectedRow = r;
                document.getElementById('tb-row-num').textContent = r + 1;
                socket.emit('ships_solo_aim', { aimRow: r, aimCol: selectedCol, phase: 'row' });
                grid.querySelectorAll('.grid-btn.fire').forEach(b => {
                    b.style.pointerEvents = 'none';
                    b.style.opacity = '.4';
                });
                btn.style.opacity = '1';
                btn.style.borderColor = '#ef4444';
                btn.style.background = 'rgba(239,68,68,.2)';
                setTimeout(() => {
                    playFire();
                    socket.emit('ships_solo_shot', { row: r, col: selectedCol });
                }, 1000);
            };
        }
        grid.appendChild(btn);
    }
    show('s-row');
}

// ── Wynik ──────────────────────────────────────────────────
socket.on('ships_solo_shot_result', (d) => {
    if (d.shots) shots = d.shots;
    if (d.hit === undefined) return;
    d.hit ? playHitResult() : playMissResult();

    document.getElementById('r-icon').textContent = d.hit ? '💥' : '💧';
    document.getElementById('r-text').textContent = d.hit ? 'TRAFIONY!' : 'Pudło';
    document.getElementById('r-text').style.color = d.hit ? '#4ade80' : '#64748b';
    let rew = '';
    if (d.hit) {
        if (d.shipSize) rew += `⚓ Statek ${d.shipSize}-masztowy`;
        if (d.reward) rew += (rew ? '  ·  ' : '') + '🏆 ' + d.reward;
    }
    document.getElementById('r-reward').textContent = rew;
    document.getElementById('r-coord').textContent = `Trafione pole: ${LETTERS[d.col]}${d.row + 1}`;
    renderMiniBoard(d.row, d.col);
    if (d.gameEnded) {
        document.getElementById('btn-next').style.display = 'none';
        document.getElementById('r-coord').textContent += ' · 🎉 Wszystkie zatopione!';
        musicPlaying = false;
    }
    show('s-result');
});

function renderAdminShipLegend() {
    const el = document.getElementById('admin-ship-legend');
    if (!el || !config || !config.ships || !config.ships.length) { if(el) el.style.display='none'; return; }
    const ships = [...config.ships].sort((a, b) => b.size - a.size);

    let sunkCount = 0;
    let html = '';
    for (const ship of ships) {
        let cells = '';
        let allHit = true;
        for (let i = 0; i < ship.size; i++) {
            const r = ship.vertical ? ship.row + i : ship.row;
            const c = ship.vertical ? ship.col : ship.col + i;
            const hit = !!(shots[`${r}_${c}`] && shots[`${r}_${c}`].hit);
            if (!hit) allHit = false;
            cells += `<span style="display:inline-block;width:11px;height:11px;border-radius:2px;flex-shrink:0;border:1px solid ${hit?'rgba(74,222,128,.6)':'rgba(14,165,233,.45)'};background:${hit?'#15803d':'rgba(14,165,233,.14)'};transition:background .3s;"></span>`;
        }
        if (allHit) sunkCount++;
        html += `<div style="display:flex;gap:2px;align-items:center;opacity:${allHit?'.35':'1'};transition:opacity .3s;">${cells}</div>`;
    }

    // Size summary text
    const sizeCounts = {};
    ships.forEach(s => { sizeCounts[s.size] = (sizeCounts[s.size] || 0) + 1; });
    const sizeStr = Object.keys(sizeCounts).sort((a,b)=>b-a).map(sz=>`${sizeCounts[sz]}×${sz}▬`).join('  ');
    const statusStr = sunkCount > 0
        ? `<span style="color:#ef4444;font-weight:700">${sunkCount}</span>/<span style="color:#94a3b8">${ships.length}</span> zatopionych`
        : `<span style="color:#7dd3fc">${ships.length} statków</span>`;

    el.innerHTML = `<div style="width:100%;text-align:center;font-size:.65rem;color:#475569;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,.06);">⚓ Flota: ${statusStr}</div><div style="width:100%;text-align:center;font-size:.58rem;color:#334155;margin-bottom:4px;">${sizeStr}</div>${html}`;
    el.style.display = 'flex';
}

function renderMiniBoard(lastR, lastC) {
    if (!config) return;
    const n = config.boardSize; const cs = Math.max(18, Math.floor(300 / (n + 1)));
    const fs = Math.max(7, Math.floor(cs * 0.5));
    // Header: litery (kolumny)
    let html = `<table id="mini-board"><tr><th style="width:${cs}px;height:${cs}px;background:#00111f;"></th>`;
    for (let c = 0; c < n; c++) {
        const hl = c === lastC ? 'color:#fbbf24;background:rgba(251,191,36,.12)' : 'color:#38bdf8;background:#00111f';
        html += `<th style="width:${cs}px;height:${cs}px;${hl};">${LETTERS[c]}</th>`;
    }
    html += '</tr>';
    for (let r = 0; r < n; r++) {
        const rhl = r === lastR ? 'color:#fbbf24;background:rgba(251,191,36,.12)' : 'color:#475569;background:#00111f';
        html += `<tr><th style="width:${cs}px;height:${cs}px;${rhl};">${r+1}</th>`;
        for (let c = 0; c < n; c++) {
            const shot = shots[`${r}_${c}`]; const isLast = r === lastR && c === lastC;
            let bg = '#001020', txt = '';
            if (shot) {
                bg = shot.hit ? '#166534' : '#1e293b';
                txt = shot.hit
                    ? `<span style="font-size:${fs}px;font-weight:900;color:#4ade80;">${shot.shipSize || '🔥'}</span>`
                    : `<span style="color:#334155;font-size:${fs}px;">✕</span>`;
            }
            html += `<td style="width:${cs}px;height:${cs}px;background:${bg};${isLast ? 'border:1.5px solid #fbbf24;' : ''}">${txt}</td>`;
        }
        html += '</tr>';
    }
    html += '</table>';
    document.getElementById('mini-board-wrap').innerHTML = html;
    renderAdminShipLegend();
}

socket.on('connect', () => {
    socket.emit('ships_solo_get_state');
    emitVolume();
});
socket.on('ships_solo_state', (g) => { if (g && gameRunning) shots = g.shots || {}; });

loadConfig();
