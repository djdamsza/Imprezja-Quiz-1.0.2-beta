      reviewCount = liczba_G + liczba_FB + liczba_WZK + liczba_Tr
      ratingValue = suma_pkt / reviewCount (np. zaokrąglone do 2 miejsc)
    – W JSON poniżej są LICZBY ORIENTACYJNE (przykład: G 4.9/40 + FB 5.0/25 + WZK 5.0/29 + Trust 4.8/15).
    – OBOWIĄZKOWO podmień na rzeczywiste dane z Google Business Profile, Facebooka, WZK i Trustindex.

  priceRange: skrót wg konwencji Google ($ = nisko … $$$$ = bardzo wysoko). Możesz zamienić np. na „4000–6000 PLN”
    jeśli Rich Results to zaakceptuje – często wystarczą symbole dolarów.
