# Build NJR-konwerter (PyInstaller) — Windows + macOS (ARM + Intel).
# Linki do pobrania: zob. GITHUB.md (Artifacts vs Release).
name: Build NJR Konwerter

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
            asset_suffix: windows-x64
          - os: macos-latest
            name: macOS Apple Silicon (arm64)
            asset_suffix: macos-arm64
          - os: macos-15-intel
            name: macOS Intel (x64)
            asset_suffix: macos-intel-x64

    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź editor/
        run: |
          test -f editor/njr.spec || { echo "Brak editor/njr.spec — w repo musi być pełny katalog editor/." >&2; exit 1; }
          test -f editor/requirements.txt

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: editor/requirements.txt

      - name: Zależności + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r editor/requirements.txt pyinstaller

      - name: PyInstaller (onefile)
        run: |
          cd editor
          python -m PyInstaller njr.spec --clean --noconfirm

      - name: Nazwa artefaktu (VERSION)
        id: ver
        run: |
          VERSION="$(tr -d ' \t\r\n' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pakuj do uploadu
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p _upload
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -f editor/dist/NJR-konwerter.exe
            cp "editor/dist/NJR-konwerter.exe" "_upload/NJR-konwerter-${VERSION}-${{ matrix.asset_suffix }}.exe"
          else
            test -f editor/dist/NJR-konwerter
            cp "editor/dist/NJR-konwerter" "_upload/NJR-konwerter-${VERSION}-${{ matrix.asset_suffix }}"
            chmod +x "_upload/NJR-konwerter-${VERSION}-${{ matrix.asset_suffix }}"
          fi
          ls -la _upload

      - uses: actions/upload-artifact@v4
        with:
          name: njr-${{ matrix.asset_suffix }}
          path: _upload/*
          if-no-files-found: error

  release:
    name: GitHub Release (tylko tag v*)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: njr-*
          merge-multiple: true

      - name: Spłaszcz katalog (artifacts → jeden poziom)
        run: |
          mkdir -p flat
          find release-assets -type f -exec cp -v {} flat/ \;
          ls -la flat

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NJR Konwerter ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          files: flat/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
